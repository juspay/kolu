[package]
name = "osfacts"
version = "0.1.0"
edition = "2021"
description = "Scoped, honest OS process and socket facts"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "osfacts"
path = "src/main.rs"

[dependencies]
libc = "0.2"
lexopt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
