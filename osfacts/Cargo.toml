[package]
name = "osfacts"
version = "0.1.0"
edition = "2021"
description = "Scoped, honest OS process and socket facts"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "osfacts"
path = "src/main.rs"

[[bin]]
name = "osfacts-listener"
path = "src/bin/osfacts-listener.rs"

[[bin]]
name = "osfacts-hermetic"
path = "src/bin/osfacts-hermetic.rs"

# Lane 2 cucumber harness — only does work when OSFACTS_LIVE=1.
[[test]]
name = "live_oracle"
path = "tests/live_oracle.rs"
harness = false

[dependencies]
libc = "0.2"
lexopt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json"] }
proptest = "1"
# cucumber MSRV is 1.88 (edition 2024); our pin is ≥1.93 — cleared.
cucumber = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Unprivileged user+net namespace for hermetic port-table isolation.
nix = { version = "0.29", features = ["sched", "user", "net"] }
