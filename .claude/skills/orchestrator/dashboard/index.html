<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RT-fable · board</title>
<style>
  :root {
    --bg:#f7f8fa; --card:#fff; --ink:#1a1d29; --dim:#6b7280; --line:#d7dbe3;
    --done:#16a34a; --run:#d97706; --wait:#6366f1; --block:#dc2626; --queued:#9aa1b1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1117; --card:#181b23; --ink:#e5e7ec; --dim:#8b93a3; --line:#2a2f3b; }
  }
  * { box-sizing:border-box }
  body { margin:0; padding:24px; background:var(--bg); color:var(--ink);
         font:14px/1.45 ui-sans-serif,system-ui,sans-serif }
  h1 { font-size:16px; margin:0 0 4px }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:26px 0 10px }
  .meta { color:var(--dim); font-size:12px; margin-bottom:8px }
  a { color:inherit }
  .flow { display:flex; align-items:center; flex-wrap:wrap; gap:2px 0;
          background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:10px 14px; margin-bottom:10px }
  .lane { font-weight:700; min-width:86px; font-size:13px }
  .lane small { display:block; font-weight:400; color:var(--dim); font-size:11px }
  .n { padding:3px 10px; border-radius:999px; font-size:12px; white-space:nowrap;
       border:1.5px solid var(--queued); color:var(--dim); margin:2px 0; text-decoration:none; display:inline-block }
  .n.done  { border-color:var(--done);  color:var(--done);  font-weight:600 }
  .n.run   { border-color:var(--run);   color:var(--run);   font-weight:700; animation:pulse 1.6s ease-in-out infinite }
  .n.wait  { border-color:var(--wait);  color:var(--wait);  font-weight:600 }
  .n.block { border-color:var(--block); color:var(--block); font-weight:700 }
  .n.q     { border-style:dashed }
  .arr { color:var(--queued); padding:0 6px; font-size:12px }
  @keyframes pulse { 50% { opacity:.45 } }
  .legend .lg { margin-right:14px; font-size:11.5px }
  .lg.done{color:var(--done)} .lg.run{color:var(--run)} .lg.wait{color:var(--wait)} .lg.block{color:var(--block)} .lg.q{color:var(--queued)}
  .queue { display:flex; flex-wrap:wrap; align-items:center; gap:4px 0;
           background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px }
  .strip { color:var(--dim); font-size:11.5px; margin-top:22px; border-top:1px solid var(--line); padding-top:8px }
  .archive { color:var(--dim); font-size:12px }
  .archive .n { font-size:11px; padding:2px 8px }
</style>
</head>
<body>
<h1>RT-fable · task flow</h1>
<div id="root"><div class="meta">loading index.json…</div></div>
<script src="./index.js"></script>
</body>
</html>
