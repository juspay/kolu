<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orchestrator · board</title>
<style>
  /* ── departure-board ops: full-mono, dark-first, signal colors ─────────── */
  :root {
    --bg:#0c0f14; --panel:#12161d; --panel2:#161b24; --ink:#dbe2ea; --dim:#77839a;
    --hair:#232a36; --hair2:#2d3644;
    --done:#2fbf71; --run:#f5a524; --wait:#7c8cf8; --block:#f25757; --q:#4a5568;
    --glow-run:rgba(245,165,36,.45); --mast:#0a0d11;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#f6f3ec; --panel:#fffdf8; --panel2:#f2eee5; --ink:#23293a; --dim:#7a8296;
      --hair:#e2dccd; --hair2:#d4cdba;
      --done:#1e9e5a; --run:#c77d00; --wait:#5563d6; --block:#cc3f3f; --q:#a8afc0;
      --glow-run:rgba(199,125,0,.30); --mast:#ece7db;
    }
  }
  * { box-sizing:border-box; margin:0 }
  html { scrollbar-width:thin }
  body {
    background:var(--bg); color:var(--ink);
    font:13.5px/1.55 ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
    padding:0 0 28px;
  }
  a { color:inherit; text-decoration:none }

  /* masthead — scanline strip */
  .mast {
    position:sticky; top:0; z-index:2; padding:12px 16px 10px;
    background:
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(127,127,127,.04) 2px 3px),
      var(--mast);
    border-bottom:1px solid var(--hair);
  }
  .mast h1 { font-size:16px; font-weight:800; letter-spacing:.22em; text-transform:uppercase }
  .mast h1 em { font-style:normal; color:var(--run) }
  .meta { margin-top:4px; font-size:11.5px; color:var(--dim); letter-spacing:.04em;
          display:flex; align-items:center; gap:7px; flex-wrap:wrap }
  .live-dot { width:6px; height:6px; border-radius:50%; background:var(--done);
              animation:blink 2.4s steps(1) infinite; flex:none }
  @keyframes blink { 50% { opacity:.25 } }

  section {
    padding:0 12px; display:grid; gap:10px;
    grid-template-columns:repeat(auto-fill, minmax(360px, 1fr));
  }
  h2 {
    font-size:11px; font-weight:700; letter-spacing:.28em; text-transform:uppercase;
    color:var(--dim); margin:22px 4px 2px; display:flex; align-items:center; gap:8px;
  }
  h2::after { content:""; flex:1; height:1px; background:var(--hair) }

  /* ── lane card ───────────────────────────────────────────────────────── */
  .card {
    background:var(--panel); border:1px solid var(--hair); border-left-width:3px;
    border-radius:8px; padding:12px 14px 14px;
  }
  .card.s-run   { border-left-color:var(--run) }
  .card.s-done  { border-left-color:var(--done) }
  .card.s-wait  { border-left-color:var(--wait) }
  .card.s-block { border-left-color:var(--block) }
  .boot .card { opacity:0; transform:translateY(6px); animation:rise .45s ease-out forwards }
  @keyframes rise { to { opacity:1; transform:none } }

  .card-head { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap }
  .lane-name { font-size:17px; font-weight:800; letter-spacing:.02em }
  .lane-name a:hover { text-decoration:underline; text-underline-offset:3px }
  .lane-sub { font-size:11px; color:var(--dim) }
  .now { margin-left:auto; font-size:11.5px; font-weight:700; letter-spacing:.14em;
         text-transform:uppercase; white-space:nowrap }
  .now.s-run   { color:var(--run) }  .now.s-done { color:var(--done) }
  .now.s-wait  { color:var(--wait) } .now.s-block{ color:var(--block) }
  .now.s-q     { color:var(--dim) }
  .now .caret { animation:blink 1.2s steps(1) infinite }

  /* ── the rail: stations joined by a hairline ─────────────────────────── */
  .rail { display:flex; margin-top:10px }
  .station { flex:1; min-width:0; position:relative; text-align:center; cursor:default }
  .station::before {           /* the track segment */
    content:""; position:absolute; top:6px; left:-50%; width:100%; height:2px;
    background:var(--hair2);
  }
  .station:first-child::before { display:none }
  .station.p-done::before { background:var(--done) }
  .dot {
    position:relative; z-index:1; display:inline-block; width:14px; height:14px;
    border-radius:50%; border:2px solid var(--q); background:var(--panel);
  }
  .station.p-done .dot  { border-color:var(--done); background:var(--done) }
  .station.p-done .dot::after {
    content:""; position:absolute; inset:0; margin:auto; width:4px; height:7px;
    border:solid var(--panel); border-width:0 2px 2px 0; transform:translateY(-1px) rotate(45deg);
  }
  .station.p-run .dot {
    border-color:var(--run); background:var(--run);
    animation:beacon 1.6s ease-out infinite;
  }
  @keyframes beacon {
    0%   { box-shadow:0 0 0 0 var(--glow-run) }
    70%  { box-shadow:0 0 0 9px transparent }
    100% { box-shadow:0 0 0 0 transparent }
  }
  .station.p-wait .dot  { border-color:var(--wait); background:var(--wait) }
  .station.p-block .dot { border-color:var(--block); background:var(--block) }
  .slabel {
    display:block; margin-top:5px; font-size:10px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--dim);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 2px;
  }
  .station.p-run .slabel   { color:var(--run); font-weight:700 }
  .station.p-wait .slabel  { color:var(--wait); font-weight:700 }
  .station.p-block .slabel { color:var(--block); font-weight:700 }
  .station.p-done .slabel  { color:var(--ink); opacity:.55 }
  a.station:hover .slabel { text-decoration:underline; text-underline-offset:2px }

  /* ── nested live-lane detail: the active step, expanded in place ─────── */
  .station.has-lane .dot { outline:2px solid var(--glow-run); outline-offset:2px }
  .sub-lane {
    margin-top:12px; padding:9px 12px 11px; border-radius:6px;
    background:var(--panel2); border:1px dashed var(--hair2);
    border-left:3px solid var(--run);
  }
  .sub-head { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:2px }
  .sub-title { font-size:12.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase }
  a.sub-title:hover { text-decoration:underline; text-underline-offset:3px }
  .rail-sub .dot { width:11px; height:11px }
  .rail-sub .station::before { top:5px }
  .rail-sub .slabel { font-size:9px }

  /* ── link badges: the icon tells the target class before the click ───── */
  :root { --lk-term:#3fc6c0; --lk-note:#d9a441; --lk-ext:#8a93a8; --lk-app:#9d8cf5 }
  @media (prefers-color-scheme: light) {
    :root { --lk-term:#0e8a84; --lk-note:#9a6b0f; --lk-ext:#7a8296; --lk-app:#6a58c9 }
  }
  .lkicon { font-size:.85em; margin-right:3px; font-weight:800 }
  .lk-term .lkicon { color:var(--lk-term) } .lk-note .lkicon { color:var(--lk-note) }
  .lk-ext .lkicon  { color:var(--lk-ext) }  .lk-app .lkicon  { color:var(--lk-app) }
  a.lk-term:hover, a.lk-note:hover, a.lk-ext:hover, a.lk-app:hover {
    text-decoration:underline; text-underline-offset:3px }
  .slabel .lkicon { font-size:1em; margin-right:2px }

  /* ── queue / shipped pills ───────────────────────────────────────────── */
  .pills { display:flex; flex-wrap:wrap; gap:6px }
  .pill {
    display:inline-block; padding:4px 11px; border-radius:5px; font-size:12px;
    border:1px solid var(--hair2); background:var(--panel);
  }
  .pill.s-wait  { border-color:var(--wait);  color:var(--wait);  font-weight:700 }
  .pill.s-block { border-color:var(--block); color:var(--block); font-weight:700 }
  .pill.s-done  { border-color:transparent; color:var(--done); background:var(--panel2) }
  .pill.s-q     { border-style:dashed; color:var(--dim) }
  .empty { color:var(--dim); font-size:12px; padding:2px 4px }
  /* grid spans — placed AFTER the base h2/.pills/.empty rules (specificity order) */
  section > h2 { grid-column:1 / -1 }
  section > .pills, section > .empty { grid-column:1 / -1 }

  details.shipped summary {
    cursor:pointer; list-style:none; font-size:11px; font-weight:700;
    letter-spacing:.28em; text-transform:uppercase; color:var(--dim);
    margin:20px 16px 8px; display:flex; align-items:center; gap:8px;
  }
  details.shipped summary::-webkit-details-marker { display:none }
  details.shipped summary::before { content:"▸" }
  details.shipped[open] summary::before { content:"▾" }
  details.shipped summary::after { content:""; flex:1; height:1px; background:var(--hair) }
  details.shipped .pills { padding:0 16px }

  .strip {
    margin:22px 16px 0; padding-top:10px; border-top:1px dashed var(--hair2);
    font-size:11px; color:var(--dim); line-height:1.7;
  }
</style>
</head>
<body>
<div class="mast">
  <h1>ORCHESTRATOR <em>·</em> TASK FLOW</h1>
  <div class="meta" id="meta"><span class="live-dot"></span><span>loading orchestrator-data.js…</span></div>
  <div class="meta" style="margin-top:2px"><span style="color:var(--lk-term)">❯ terminal</span><span style="color:var(--lk-note)">▤ note/file</span><span style="color:var(--lk-ext)">↗ external</span></div>
</div>
<div id="root"></div>
<script src="./index.js"></script>
</body>
</html>
