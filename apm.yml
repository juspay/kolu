name: kolu
version: 1.0.0
description: Terminal multiplexer with AI-native development workflow
type: hybrid
targets:
  - claude
  - codex
  - opencode

# Generated AGENTS.md files are runtime outputs, not source inputs. Excluding
# them keeps distributed compilation from treating stale generated files as
# additional placement anchors on subsequent `apm compile` runs.
compilation:
  exclude:
    - AGENTS.md
    - "**/AGENTS.md"
    - node_modules/**
    - "**/node_modules/**"

# Update a dependency: just ai::apm-update <package>  (e.g. srid/agency)
# Reinstall all:       just ai::apm
dependencies:
  apm:
    # Reusable skills extracted into the in-tree `agents/` package (its own
    # apm.yml + .apm/). Local path dependency — `just ai::apm` deploys them
    # alongside the remote packages below. See agents/README.md.
    - path: ./agents
    - srid/agency#master
    # NOTE: srid/llm-debate (the `/debate` skill, added in #1622) was REMOVED here.
    # It's a full apm PACKAGE (has its own apm.yml), so no ref form both (a) scopes
    # to just its `debate` skill — avoiding llm-debate's apm.yml, whose stale
    # self-reference to kolu's own `kolu` skill clobbers it under last-installed-wins
    # — AND (b) emits `.claude/skills/debate/`. The org/repo/path skill-path form
    # (like the juspay/skills entries below) only emits for a repo WITHOUT an
    # apm.yml. Dropped for now; to be re-added properly in a future PR (e.g. after
    # llm-debate's apm.yml pin to kolu's `kolu` skill is bumped past the padi rename).
    - juspay/skills/skills/nix-justfile
    - juspay/skills/skills/nix-typescript
    - juspay/skills/skills/pg
    - anthropics/skills/skills/frontend-design
    - juspay/nix-chrome-devtools-mcp
    - juspay/odu#grokbe/venue-pools-lease
    - juspay/project-unknown
