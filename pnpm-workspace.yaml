packages:
  - packages/**
  # osfacts TypeScript client — the one thing that did NOT leave with the tool
  # at OSF5, because a workspace member must be a path inside this repo and
  # kolu packages import it by name. See osfacts/README.md.
  - osfacts/client-ts
  # NOTE: `agents/` (the reusable APM skills package — agents/README.md) is NOT a
  # workspace member. It was one only so the lens-debate engine's unit tests ran
  # under `pnpm -r test:unit`; the engine is gone (the lens stage is prose + plain
  # subagents now), so the package is pure markdown with nothing to test or build.

# @pierre/trees and @pierre/diffs declare react/react-dom as peer deps but only
# need them for their /react entry points. Kolu consumes the vanilla classes
# directly from SolidJS, so these are optional.
packageExtensions:
  "@pierre/trees":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
  "@pierre/diffs":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
