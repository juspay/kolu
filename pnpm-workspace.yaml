packages:
  - packages/**
  # osfacts-client — GENERATED, never committed (`.gitignore`). Nix grafts it
  # from the npins `osfacts` pin so the client has exactly one source of truth,
  # in its own repo. `just install` does the same graft for a working tree; a
  # bare `pnpm install` without it fails loudly rather than half-installing.
  - osfacts-client
  # NOTE: `agents/` (the reusable APM skills package — agents/README.md) is NOT a
  # workspace member. It was one only so the lens-debate engine's unit tests ran
  # under `pnpm -r test:unit`; the engine is gone (the lens stage is prose + plain
  # subagents now), so the package is pure markdown with nothing to test or build.

# Effect 4 (release candidate). Every @effect/* package must resolve to the SAME version as
# `effect` itself, so these are exact pins (no `^`) for kolu-private members.
#
# `catalog:` is WORKSPACE-LOCAL, so it cannot appear in any package an OUTSIDE
# repo vendors: drishti, odu and olai copy those DIRECTORIES from a
# content-addressed pin (today `@kolu/padi-client` and `@kolu/solid-dockrow`,
# both declared in packages/tests/governance/vendorEntries.ts, plus the
# `@kolu/surface*` stack that file derives from the tree) and install their `dependencies` from their own
# workspace, where kolu's catalog does not exist. Those packages spell the
# literal version instead. Root `pnpm.overrides` (package.json) carries the same
# version a third time so transitive resolution collapses to one copy here.
#
# WHICH packages those are is not a list to remember — it is the hydrate closure
# of whatever kolu publishes outward, and it grew past the surface eight when
# `@kolu/padi-client` was carved out for olai (juspay/kolu#2216): its closure
# pulls @kolu/terminal-vocab, kolu-transcript-core and the seven integration
# packages in with it. Two files own this between them:
# `packages/tests/governance/vendorEntries.ts` answers WHICH directories are
# vendored (the `packages/surface*` roots are read off the tree, so a ninth joins
# by existing; only `@kolu/padi-client` is declared, being a fact about olai with
# no in-tree source) and walks their closure with `@kolu/daemon-test-gate`'s
# `declaredDependencyClosure`; `packages/tests/governance/effectPin.ts` takes
# that set and FAILS on a `catalog:` spec anywhere in it, so a new member of the
# set is told rather than discovered downstream.
# (`packages/padi-client/src/hydrate.closure.test.ts` walks the same closure for
# a different question — what a consumer must install — and says in its own
# header that the catalog rule is not its.)
#
# Bumping the stack therefore means editing all three places together:
#   1. this catalog, 2. `pnpm.overrides` in package.json,
#   3. every literal spec — `grep -rl '"effect": "4' packages/*/package.json packages/integrations/*/package.json`
catalog:
  effect: 4.0.0-rc.112
  "@effect/platform-node": 4.0.0-rc.112
  "@effect/platform-browser": 4.0.0-rc.112
  "@effect/vitest": 4.0.0-rc.112

# @pierre/trees and @pierre/diffs declare react/react-dom as peer deps but only
# need them for their /react entry points. Kolu consumes the vanilla classes
# directly from SolidJS, so these are optional.
packageExtensions:
  "@pierre/trees":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
  "@pierre/diffs":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
