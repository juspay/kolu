packages:
  - packages/**
  # osfacts-client — GENERATED, never committed (`.gitignore`). Nix grafts it
  # from the npins `osfacts` pin so the client has exactly one source of truth,
  # in its own repo. `just install` does the same graft for a working tree; a
  # bare `pnpm install` without it fails loudly rather than half-installing.
  - osfacts-client
  # NOTE: `agents/` (the reusable APM skills package — agents/README.md) is NOT a
  # workspace member. It was one only so the lens-debate engine's unit tests ran
  # under `pnpm -r test:unit`; the engine is gone (the lens stage is prose + plain
  # subagents now), so the package is pure markdown with nothing to test or build.

# Effect 4 (release candidate). Every @effect/* package must resolve to the SAME version as
# `effect` itself, so these are exact pins (no `^`) for kolu-private members.
#
# `catalog:` is WORKSPACE-LOCAL, so it cannot appear in the eight @kolu/surface*
# packages: drishti and odu vendor those DIRECTORIES from a content-addressed pin
# and install their `dependencies` from their own workspace, where kolu's catalog
# does not exist. Those seven spell the literal version instead. Root
# `pnpm.overrides` (package.json) carries the same version a third time so
# transitive resolution collapses to one copy here.
#
# Bumping the stack therefore means editing all three places together:
#   1. this catalog, 2. `pnpm.overrides` in package.json,
#   3. the literal specs in packages/surface{,-map,-app,-remote,-daemon,-daemon-supervisor,-mcp,-cli}/package.json
catalog:
  effect: 4.0.0-rc.110
  "@effect/platform-node": 4.0.0-rc.110
  "@effect/platform-browser": 4.0.0-rc.110
  "@effect/vitest": 4.0.0-rc.110

# @pierre/trees and @pierre/diffs declare react/react-dom as peer deps but only
# need them for their /react entry points. Kolu consumes the vanilla classes
# directly from SolidJS, so these are optional.
packageExtensions:
  "@pierre/trees":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
  "@pierre/diffs":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
