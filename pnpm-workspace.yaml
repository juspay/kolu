packages:
  - packages/**
  # The reusable APM skills package (agents/README.md). In the workspace so its
  # engine tests (agents/tests/) run under `pnpm -r test:unit` like every other
  # package's. Absent from default.nix's src fileset — like packages/tests, it
  # has no typecheck script and nothing the nix build consumes. Deliberately
  # DEPENDENCY-FREE: its vitest comes from the root devDependencies, so pnpm
  # never creates agents/node_modules — `apm install` vendors agents/ as a path
  # package and aborts on symlinks that escape the package root.
  - agents

# @pierre/trees and @pierre/diffs declare react/react-dom as peer deps but only
# need them for their /react entry points. Kolu consumes the vanilla classes
# directly from SolidJS, so these are optional.
packageExtensions:
  "@pierre/trees":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
  "@pierre/diffs":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
