<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 730" font-family="ui-sans-serif,system-ui,sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3a6ea5"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b7a3a"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6d4fa3"/>
    </marker>
    <marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8272"/>
    </marker>
  </defs>

  <!-- ══════════ Xyne Spaces ══════════ -->
  <rect x="40" y="20" width="280" height="104" rx="12" fill="#faf8f2" stroke="#ddd6c4"/>
  <text x="58" y="46" font-size="13" font-weight="700" fill="#5b6470" letter-spacing=".07em">XYNE SPACES</text>
  <text x="58" y="70" font-size="13" fill="#1a1c20">your chat threads</text>
  <text x="58" y="90" font-size="13" fill="#1a1c20">app API · flow cards</text>
  <text x="58" y="110" font-size="13" fill="#8a8272">identity · delivery</text>

  <!-- XS ⇄ pesu (blue: XS app API) -->
  <line x1="120" y1="124" x2="120" y2="188" stroke="#3a6ea5" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="24" y="160" font-size="12" fill="#3a6ea5">webhook · HMAC</text>
  <line x1="240" y1="188" x2="240" y2="124" stroke="#3a6ea5" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="252" y="160" font-size="12" fill="#3a6ea5">replies · progress · cards</text>

  <!-- ══════════ pesu ══════════ -->
  <rect x="40" y="188" width="280" height="168" rx="12" fill="#faf8f2" stroke="#ddd6c4"/>
  <text x="58" y="214" font-size="13" font-weight="700" fill="#5b6470" letter-spacing=".07em">PESU — STANDALONE DAEMON</text>
  <text x="58" y="238" font-size="13" fill="#1a1c20">webhook + author gate + binds</text>
  <text x="58" y="258" font-size="13" fill="#6d4fa3">embedded ACP client</text>
  <text x="58" y="278" font-size="13" fill="#1a1c20">supervision: spawn · respawn ·</text>
  <text x="58" y="298" font-size="13" fill="#1a1c20">cancel-with-grace</text>
  <text x="58" y="318" font-size="13" fill="#8a8272">repo allowlist → worktrees</text>
  <text x="58" y="338" font-size="13" fill="#8a8272">frames → session log file</text>

  <!-- pesu → adapter (purple: ACP) -->
  <line x1="180" y1="356" x2="180" y2="420" stroke="#6d4fa3" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="192" y="382" font-size="12" fill="#6d4fa3">ACP · NDJSON over stdio</text>
  <text x="192" y="400" font-size="12" fill="#8a8272">no socket anywhere</text>

  <!-- ══════════ adapter ══════════ -->
  <rect x="40" y="420" width="280" height="104" rx="12" fill="#faf8f2" stroke="#ddd6c4"/>
  <text x="58" y="446" font-size="13" font-weight="700" fill="#5b6470" letter-spacing=".07em">ACP ADAPTER — CHILD OF PESU</text>
  <text x="58" y="470" font-size="13" fill="#1a1c20">claude-agent-acp · codex-acp</text>
  <text x="58" y="490" font-size="13" fill="#1a1c20">any stdio ACP agent</text>
  <text x="58" y="510" font-size="13" fill="#8a8272">the headless session</text>

  <!-- ══════════ kolu — the takeover ══════════ -->
  <rect x="370" y="252" width="240" height="188" rx="12" fill="#f4faf4" stroke="#bcd9bc"/>
  <text x="388" y="278" font-size="13" font-weight="700" fill="#1b7a3a" letter-spacing=".07em">KOLU — THE TAKEOVER</text>
  <text x="388" y="302" font-size="13" fill="#1a1c20">not in the runtime path</text>
  <text x="388" y="322" font-size="13" fill="#1a1c20">open a terminal in the</text>
  <text x="388" y="342" font-size="13" fill="#1a1c20">thread's worktree, then</text>
  <text x="388" y="368" font-size="12.5" font-family="ui-monospace,monospace" fill="#1b7a3a">claude --resume &lt;id&gt;</text>
  <text x="388" y="394" font-size="13" fill="#8a8272">same files, same</text>
  <text x="388" y="414" font-size="13" fill="#8a8272">conversation, interactive</text>

  <!-- adapter → workspace / store -->
  <line x1="120" y1="524" x2="120" y2="600" stroke="#8a8272" stroke-width="1.6" marker-end="url(#arrN)"/>
  <text x="24" y="560" font-size="12" fill="#8a8272">tools act on</text>
  <text x="24" y="576" font-size="12" fill="#8a8272">the files</text>
  <line x1="280" y1="524" x2="420" y2="600" stroke="#8a8272" stroke-width="1.6" marker-end="url(#arrN)"/>
  <text x="290" y="566" font-size="12" fill="#8a8272">writes the transcript</text>

  <!-- ══════════ workspace ══════════ -->
  <rect x="40" y="600" width="280" height="104" rx="12" fill="#faf8f2" stroke="#ddd6c4"/>
  <text x="58" y="626" font-size="13" font-weight="700" fill="#5b6470" letter-spacing=".07em">WORKSPACE</text>
  <text x="58" y="650" font-size="13" fill="#1a1c20">git worktree per thread</text>
  <text x="58" y="670" font-size="13" fill="#8a8272">code — or knowledge notes</text>

  <!-- ══════════ session store ══════════ -->
  <rect x="350" y="600" width="260" height="104" rx="12" fill="#faf8f2" stroke="#ddd6c4"/>
  <text x="368" y="626" font-size="13" font-weight="700" fill="#5b6470" letter-spacing=".07em">SESSION STORE</text>
  <text x="368" y="650" font-size="12" font-family="ui-monospace,monospace" fill="#1a1c20">~/.claude/projects/*.jsonl</text>
  <text x="368" y="672" font-size="13" fill="#8a8272">the store the claude CLI reads</text>

  <!-- kolu → workspace / store (green dashed: the takeover) -->
  <line x1="420" y1="440" x2="300" y2="600" stroke="#1b7a3a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
  <text x="306" y="586" font-size="12" fill="#1b7a3a">same worktree</text>
  <line x1="520" y1="440" x2="490" y2="600" stroke="#1b7a3a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
  <text x="512" y="530" font-size="12" fill="#1b7a3a">resume the</text>
  <text x="512" y="546" font-size="12" fill="#1b7a3a">session</text>
</svg>
