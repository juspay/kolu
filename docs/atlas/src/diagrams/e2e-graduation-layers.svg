<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="system-ui, sans-serif">
  <style>
    .bg { fill: var(--color-bg, #fff); }
    .panel { fill: var(--color-surface, #f5f7fa); stroke: var(--color-border, #9aa4b2); }
    .gate { fill: var(--color-surface, #f5f7fa); stroke: var(--color-kolu-primary, #5879d9); }
    .text { fill: var(--color-text, #172033); }
    .muted { fill: var(--color-text-muted, #647084); }
    .accent { fill: var(--color-kolu-primary, #5879d9); }
    .line { stroke: var(--color-border, #9aa4b2); }
    .pass { stroke: var(--color-kolu-bottom, #279a72); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--color-border, #9aa4b2)"/>
    </marker>
    <marker id="passArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--color-kolu-bottom, #279a72)"/>
    </marker>
  </defs>
  <rect class="bg" width="760" height="320"/>

  <rect class="panel" x="35" y="28" width="200" height="78" rx="10"/>
  <text class="text" x="135" y="53" font-size="13" font-weight="650" text-anchor="middle">live Gherkin suite</text>
  <text class="muted" x="135" y="74" font-size="11" text-anchor="middle">58 files · 530 declarations</text>
  <text class="muted" x="135" y="91" font-size="11" text-anchor="middle">508 expanded executions</text>

  <rect class="panel" x="280" y="28" width="200" height="78" rx="10"/>
  <text class="text" x="380" y="53" font-size="13" font-weight="650" text-anchor="middle">immutable inventory</text>
  <text class="muted" x="380" y="74" font-size="11" text-anchor="middle">steps · backgrounds · tags</text>
  <text class="muted" x="380" y="91" font-size="11" text-anchor="middle">expanded Examples values</text>

  <rect class="panel" x="525" y="28" width="200" height="78" rx="10"/>
  <text class="text" x="625" y="53" font-size="13" font-weight="650" text-anchor="middle">attempt timing</text>
  <text class="muted" x="625" y="74" font-size="11" text-anchor="middle">every try · retry · duration</text>
  <text class="muted" x="625" y="91" font-size="11" text-anchor="middle">Linux + Darwin baseline</text>

  <line class="line" x1="235" y1="67" x2="275" y2="67" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="line" x1="480" y1="67" x2="520" y2="67" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="gate" x="135" y="145" width="490" height="88" rx="12" stroke-width="2"/>
  <text class="accent" x="380" y="172" font-size="14" font-weight="700" text-anchor="middle">coverage-ledger gate</text>
  <text class="text" x="380" y="194" font-size="11" text-anchor="middle">exact historical revision · user promise · real defect surface</text>
  <text class="text" x="380" y="212" font-size="11" text-anchor="middle">collected replacement · human review note · browser survivor</text>
  <line class="line" x1="380" y1="106" x2="380" y2="140" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="line" x1="625" y1="106" x2="625" y2="135" stroke-width="1.5"/>
  <line class="line" x1="625" y1="135" x2="575" y2="145" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="panel" x="175" y="268" width="410" height="34" rx="8"/>
  <text class="text" x="380" y="290" font-size="12" font-weight="650" text-anchor="middle">later change may remove exactly that E2E revision</text>
  <line class="pass" x1="380" y1="233" x2="380" y2="263" stroke-width="1.8" marker-end="url(#passArrow)"/>

  <text class="muted" x="380" y="249" font-size="10" text-anchor="middle">all required evidence present; no count target</text>
</svg>
