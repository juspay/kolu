<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="system-ui, sans-serif">
  <rect width="760" height="300" fill="#0f1117"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b95a7"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4a7"/>
    </marker>
  </defs>

  <!-- browser layer -->
  <rect x="40" y="30" width="680" height="74" rx="9" fill="#1a2130" stroke="#e8b44c" stroke-width="1.5"/>
  <text x="380" y="55" fill="#e6eaf2" font-size="13" font-weight="600" text-anchor="middle">browser e2e — 53 feature files · 492 scenarios</text>
  <text x="380" y="74" fill="#8b95a7" font-size="11" text-anchor="middle">pays per worker: Xvfb · built kolu-server · padi · kaval · Chromium · 20–60s DOM polls</text>
  <text x="380" y="92" fill="#2dd4a7" font-size="11" text-anchor="middle">~360 genuinely assert rendered UI — they stay</text>

  <!-- moving arrows -->
  <line x1="200" y1="104" x2="200" y2="168" stroke="#8b95a7" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="380" y1="104" x2="380" y2="168" stroke="#8b95a7" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="560" y1="104" x2="560" y2="168" stroke="#8b95a7" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="380" y="130" fill="#e6eaf2" font-size="11.5" font-weight="600" text-anchor="middle">~130 executions (~26%) graduate down</text>
  <text x="380" y="146" fill="#8b95a7" font-size="10.5" text-anchor="middle">mostly by DELETION — the package test already exists</text>

  <!-- smoke residue arrow -->
  <path d="M 690 168 C 730 140 730 120 700 106" stroke="#2dd4a7" stroke-width="1.3" fill="none" marker-end="url(#arrGreen)"/>
  <text x="712" y="150" fill="#2dd4a7" font-size="10" text-anchor="middle">thin</text>
  <text x="712" y="162" fill="#2dd4a7" font-size="10" text-anchor="middle">smokes</text>

  <!-- package layer -->
  <rect x="40" y="170" width="680" height="86" rx="9" fill="#141925" stroke="#3d4a63" stroke-width="1.5"/>
  <text x="380" y="192" fill="#8b95a7" font-size="11" font-weight="600" text-anchor="middle">PACKAGE TESTS — vitest boot + at most an in-process PTY</text>
  <rect x="54" y="202" width="120" height="40" rx="6" fill="#1a2130" stroke="#5b8def"/>
  <text x="114" y="219" fill="#9db4e8" font-size="11" text-anchor="middle">padi</text>
  <text x="114" y="233" fill="#8b95a7" font-size="9" text-anchor="middle">sensors · lifecycle · store</text>
  <rect x="182" y="202" width="100" height="40" rx="6" fill="#1a2130" stroke="#5b8def"/>
  <text x="232" y="219" fill="#9db4e8" font-size="11" text-anchor="middle">kaval</text>
  <text x="232" y="233" fill="#8b95a7" font-size="9" text-anchor="middle">OSC · PTY · daemon</text>
  <rect x="290" y="202" width="130" height="40" rx="6" fill="#1a2130" stroke="#5b8def"/>
  <text x="355" y="219" fill="#9db4e8" font-size="11" text-anchor="middle">integrations/*</text>
  <text x="355" y="233" fill="#8b95a7" font-size="9" text-anchor="middle">agents · git · anyagent</text>
  <rect x="428" y="202" width="130" height="40" rx="6" fill="#1a2130" stroke="#5b8def"/>
  <text x="493" y="219" fill="#9db4e8" font-size="11" text-anchor="middle">solid-markdown +</text>
  <text x="493" y="233" fill="#8b95a7" font-size="9" text-anchor="middle">client/lib units</text>
  <rect x="566" y="202" width="100" height="40" rx="6" fill="#1a2130" stroke="#5b8def"/>
  <text x="616" y="219" fill="#9db4e8" font-size="11" text-anchor="middle">server</text>
  <text x="616" y="233" fill="#8b95a7" font-size="9" text-anchor="middle">HTTP routes</text>

  <text x="380" y="284" fill="#5b6678" font-size="10.5" text-anchor="middle">the principle: a test lives at the lowest layer that can honestly assert it</text>
</svg>
