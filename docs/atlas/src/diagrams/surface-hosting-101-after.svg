<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="inherit" role="img" aria-label="The hosting side AFTER the ratified simplifications: universal identity on the base role, a daemon sub-role with only convergence, BoundPadi as an alias, and a registry that demands exactly destroy()"><defs><marker id="a3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="currentColor" opacity="0.75"/></marker></defs><rect x="28" y="18" width="924" height="44" rx="9" fill="#22a06b" fill-opacity="0.07" stroke="#22a06b" stroke-width="1.5"/><text x="490.0" y="37" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">UNIVERSAL: every surface server auto-answers hello (framework-stamped) — padi · kaval · drishti agents · test fakes</text><text x="490.0" y="53" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">so identity is a property of SERVING, and any client may ask &quot;who are you&quot; before any versioned handshake</text><rect x="310" y="92" width="360" height="96" rx="9" fill="#22a06b" fill-opacity="0.1" stroke="#22a06b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="490.0" y="111" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">MirrorSession&lt;Client&gt; — the ROLE</text><text x="490.0" y="127" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">pin() · currentClient() · onState() · destroy()</text><text x="490.0" y="140" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">identity(): ServerIdentity | null   ← universal now</text><text x="490.0" y="153" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">(null only transiently, never null-forever)</text><rect x="710" y="92" width="242" height="96" rx="9" fill="#22a06b" fill-opacity="0.1" stroke="#22a06b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="831.0" y="111" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">ServerIdentity (one value)</text><text x="831.0" y="127" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">contractVersion · startedAt</text><text x="831.0" y="140" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">buildId  = convergence currency</text><text x="831.0" y="153" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">commit  = navigable — DISTINCT</text><text x="831.0" y="166" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">fields, never merged</text><rect x="60" y="240" width="250" height="88" rx="9" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-width="1.5"/><text x="185.0" y="259" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">HostSession — the ssh CLASS</text><text x="185.0" y="275" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">provision (Nix) → run over ssh →</text><text x="185.0" y="288" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">reconnect → give-up-loudly</text><text x="185.0" y="301" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">unchanged; keeps &lt;C&gt; for direct users</text><path d="M 185 240 L 430 188" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a3)"/><text x="307.5" y="207.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">implements</text><rect x="390" y="240" width="260" height="74" rx="9" fill="#22a06b" fill-opacity="0.1" stroke="#22a06b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="520.0" y="259" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">DaemonMirrorSession</text><text x="520.0" y="275" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">extends MirrorSession</text><text x="520.0" y="288" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">ONLY adds: convergence()</text><text x="520.0" y="301" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">(supervision is all that is daemon-y)</text><path d="M 520 240 L 520 188" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a3)"/><text x="520.0" y="207.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">extends</text><rect x="700" y="240" width="252" height="88" rx="9" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.5"/><text x="826.0" y="259" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">BoundPadi = an ALIAS now</text><text x="826.0" y="275" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">DaemonMirrorSession&lt;PadiClient&gt;</text><text x="826.0" y="288" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">&amp; { preservation: {children:&quot;survive&quot;},</text><text x="826.0" y="301" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">    renew(): Promise&lt;void&gt; }</text><text x="826.0" y="314" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">six bespoke readouts: deleted</text><path d="M 700 278 L 650 278" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a3)" stroke-dasharray="4 3"/><text x="675.0" y="271.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">aliases</text><rect x="60" y="410" width="270" height="84" rx="9" fill="#c08a2d" fill-opacity="0.1" stroke="#c08a2d" stroke-width="1.5"/><text x="195.0" y="429" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">reServeSurface · pumpRemoteSurface</text><text x="195.0" y="445" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">take MirrorSession</text><text x="195.0" y="458" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">(the mirror machinery — unchanged</text><text x="195.0" y="471" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">consumers of the role)</text><path d="M 195 410 L 450 188" stroke="#22a06b" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a3)"/><text x="322.5" y="292.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">consume the role ✓</text><rect x="390" y="410" width="300" height="110" rx="9" fill="#c08a2d" fill-opacity="0.1" stroke="#c08a2d" stroke-width="1.5"/><text x="540.0" y="429" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">buildHostRegistry</text><text x="540.0" y="445" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">HostEntry&lt;S extends DestroyableSession, H&gt;</text><text x="540.0" y="458" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">DestroyableSession = { destroy(): void }</text><text x="540.0" y="471" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">— demands EXACTLY what it uses</text><text x="540.0" y="484" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">controls given ⇒ reconnect()/recheckAll() EXIST</text><text x="540.0" y="497" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">controls absent ⇒ they don&#x27;t typecheck</text><path d="M 540 410 L 540 332" stroke="#22a06b" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a3)"/><text x="540.0" y="364.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">stores any destroyable session ✓</text><rect x="730" y="410" width="222" height="84" rx="9" fill="#c08a2d" fill-opacity="0.1" stroke="#c08a2d" stroke-width="1.5"/><text x="841.0" y="429" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">SurfaceAppProvider (browser)</text><text x="841.0" y="445" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">controlPlane: Accessor&lt;…&gt;</text><text x="841.0" y="458" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">static: () =&gt; surfaceApp</text><text x="841.0" y="471" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">live switch: swap the accessor</text><path d="M 840 410 L 840 332" stroke="#22a06b" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a3)"/><text x="840.0" y="364.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">reads identity()/convergence() ✓</text><g font-size="10.5" fill="currentColor" opacity="0.9"><text x="60" y="560" font-weight="700">No red arrows left:</text><text x="185" y="560">every slot names exactly the role it uses · dashed = interface · solid = running code · the dead export (evictHostSession) is deleted</text></g></svg>