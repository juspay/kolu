<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="inherit" role="img" aria-label="The hosting side AFTER all rulings: universal identity on the base role; the daemon sub-role carries supervision including renew; no alias — the two padi arms are simply DaemonMirrorSession of the padi client"><defs><marker id="a4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="currentColor" opacity="0.75"/></marker></defs><rect x="28" y="18" width="924" height="42" rx="9" fill="#22a06b" fill-opacity="0.07" stroke="#22a06b" stroke-width="1.5"/><text x="490.0" y="37" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">UNIVERSAL: every surface server auto-answers hello (framework-stamped) — padi · kaval · drishti agents · test fakes</text><text x="490.0" y="53" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">identity is a property of SERVING; any client may ask &quot;who are you&quot; before any versioned handshake</text><rect x="300" y="90" width="380" height="92" rx="9" fill="#22a06b" fill-opacity="0.1" stroke="#22a06b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="490.0" y="109" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">MirrorSession&lt;Client&gt; — the base ROLE</text><text x="490.0" y="125" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">pin · currentClient · onState · destroy</text><text x="490.0" y="138" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">identity(): ServerIdentity | null  ← universal</text><text x="490.0" y="151" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">(3 implementations, below)</text><rect x="710" y="90" width="242" height="92" rx="9" fill="#22a06b" fill-opacity="0.1" stroke="#22a06b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="831.0" y="109" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">ServerIdentity (one value)</text><text x="831.0" y="125" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">contractVersion · startedAt</text><text x="831.0" y="138" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">buildId = convergence currency</text><text x="831.0" y="151" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">commit = navigable — distinct</text><rect x="370" y="228" width="300" height="88" rx="9" fill="#22a06b" fill-opacity="0.1" stroke="#22a06b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="520.0" y="247" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">DaemonMirrorSession — sub-role</text><text x="520.0" y="263" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">extends MirrorSession; adds SUPERVISION,</text><text x="520.0" y="276" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">which includes replacement:</text><text x="520.0" y="289" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">convergence() · renew() · preservation</text><text x="520.0" y="302" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">(2 implementations, below — NO alias)</text><path d="M 520 228 L 520 182" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a4)"/><text x="520.0" y="198.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">extends</text><rect x="40" y="360" width="260" height="96" rx="9" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-width="1.5"/><text x="170.0" y="379" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">HostSession  (class)</text><text x="170.0" y="395" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">implements MirrorSession ONLY</text><text x="170.0" y="408" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">ssh + Nix + reconnect appliance;</text><text x="170.0" y="421" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">fronts ANY server; supervises nothing</text><text x="170.0" y="434" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">→ drishti holds N of these directly</text><path d="M 170 360 L 420 182" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a4)"/><text x="295.0" y="264.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">implements the base role</text><rect x="340" y="360" width="280" height="96" rx="9" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.5"/><text x="480.0" y="379" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">LocalPadiSession  (local arm)</text><text x="480.0" y="395" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">today: PadiBindingSession — renamed</text><text x="480.0" y="408" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">implements DaemonMirrorSession&lt;PadiClient&gt;</text><text x="480.0" y="421" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">unix socket · own reconnect loop ·</text><text x="480.0" y="434" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">drain-took = socket close</text><path d="M 480 360 L 490 316" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a4)"/><text x="485.0" y="331.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">implements</text><rect x="660" y="360" width="292" height="96" rx="9" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.5"/><text x="806.0" y="379" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">RemotePadiSession  (remote arm)</text><text x="806.0" y="395" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">implements DaemonMirrorSession&lt;PadiClient&gt;</text><text x="806.0" y="408" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">WRAPS a HostSession (composition) ·</text><text x="806.0" y="421" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">drain-took = hello poll + instance fence</text><path d="M 800 360 L 560 316" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a4)"/><text x="680.0" y="331.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">implements</text><path d="M 660 408 L 300 408" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.75" marker-end="url(#a4)"/><text x="480.0" y="401.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">wraps →</text><rect x="40" y="500" width="400" height="64" rx="9" fill="#c08a2d" fill-opacity="0.1" stroke="#c08a2d" stroke-width="1.5"/><text x="240.0" y="519" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">consumers (unchanged)</text><text x="240.0" y="535" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">pump/reServe → MirrorSession ✓ · registry → DestroyableSession ✓</text><text x="240.0" y="548" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">browser provider → Accessor&lt;ControlPlane&gt; ✓</text><rect x="480" y="500" width="472" height="64" rx="9" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="716.0" y="519" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">kolu&#x27;s call sites, after</text><text x="716.0" y="535" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">no BoundPadi — they write DaemonMirrorSession&lt;PadiSurfaceClient&gt;</text><text x="716.0" y="548" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">directly: the pool&#x27;s S param, the dialogs, the renew() button</text><g font-size="10.5" fill="currentColor" opacity="0.9"><text x="40" y="596" font-weight="700">Who implements what:</text><text x="190" y="596">MirrorSession ← HostSession + both padi arms · DaemonMirrorSession ← the two padi arms only · kaval is supervised BY padi one layer down, never bound by kolu-server</text></g></svg>