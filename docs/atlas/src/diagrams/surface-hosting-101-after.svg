<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="inherit" role="img" aria-label="Final shape: one reconnecting-session loop appliance with pluggable connectOnce transports and one admit hook; ssh session is loop plus ssh connector; padi is one factory over two connectors; extension by object spread"><defs><marker id="a5" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="currentColor" opacity="0.75"/></marker></defs><rect x="28" y="16" width="924" height="40" rx="9" fill="#22a06b" fill-opacity="0.07" stroke="#22a06b" stroke-width="1.5"/><text x="490.0" y="35" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">UNIVERSAL: every surface server auto-answers hello (framework-stamped) — identity is a property of serving</text><rect x="60" y="80" width="340" height="74" rx="9" fill="#22a06b" fill-opacity="0.1" stroke="#22a06b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="230.0" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">ReconnectingSession&lt;Client&gt; — the ROLE</text><text x="230.0" y="115" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">a self-healing source of clients:</text><text x="230.0" y="128" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">currentClient across respawns · onState · identity()</text><rect x="430" y="80" width="300" height="74" rx="9" fill="#22a06b" fill-opacity="0.1" stroke="#22a06b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="580.0" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">DaemonMirrorSession — sub-role</text><text x="580.0" y="115" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">extends ReconnectingSession; supervision:</text><text x="580.0" y="128" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">convergence() · renew() · preservation</text><path d="M 430 117 L 400 117" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a5)"/><text x="415.0" y="110.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">extends</text><rect x="760" y="80" width="192" height="74" rx="9" fill="#22a06b" fill-opacity="0.1" stroke="#22a06b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="856.0" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">ServerIdentity</text><text x="856.0" y="115" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">contractVersion · startedAt</text><text x="856.0" y="128" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">buildId ≠ commit (distinct)</text><rect x="280" y="200" width="420" height="110" rx="9" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-width="1.5"/><text x="490.0" y="219" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">reconnectingSession({ connectOnce, admit? })  — THE appliance</text><text x="490.0" y="235" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">owns: reconnect · backoff · give-up-loudly · state merging</text><text x="490.0" y="248" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">connectOnce = ONE attempt (transport plug) → { client, closed, isAlive }</text><text x="490.0" y="261" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">admit = ONE typed hook gating each fresh spawn →</text><text x="490.0" y="274" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">adopt | refuse(state) | replaced   (verdicts merge into onState)</text><path d="M 490 200 L 490 154" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a5)"/><text x="490.0" y="170.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">returns the role</text><rect x="60" y="360" width="260" height="80" rx="9" fill="#c08a2d" fill-opacity="0.1" stroke="#c08a2d" stroke-width="1.5"/><text x="190.0" y="379" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">endpointConnector(…)</text><text x="190.0" y="395" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">local transport plug:</text><text x="190.0" y="408" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">adopt-or-spawn via the supervisor</text><text x="190.0" y="421" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">Endpoint · unix socket · socket-close</text><rect x="660" y="360" width="292" height="80" rx="9" fill="#c08a2d" fill-opacity="0.1" stroke="#c08a2d" stroke-width="1.5"/><text x="806.0" y="379" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">sshConnector({ binary, drvMap… })</text><text x="806.0" y="395" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">remote transport plug:</text><text x="806.0" y="408" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">Nix provision · ssh front ·</text><text x="806.0" y="421" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">hello-poll liveness</text><path d="M 190 360 L 380 310" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a5)"/><text x="285.0" y="328.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">plugs into connectOnce</text><path d="M 800 360 L 620 310" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a5)"/><text x="710.0" y="328.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">plugs into connectOnce</text><rect x="60" y="470" width="270" height="76" rx="9" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.5"/><text x="195.0" y="489" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">SshHostSession (drishti&#x27;s N)</text><text x="195.0" y="505" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">= reconnectingSession({</text><text x="195.0" y="518" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">    connectOnce: sshConnector(…) })</text><text x="195.0" y="531" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">no admit — fronts anything</text><path d="M 195 470 L 430 310" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a5)" stroke-dasharray="4 3"/><text x="312.5" y="383.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">is just</text><rect x="390" y="470" width="300" height="90" rx="9" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.5"/><text x="540.0" y="489" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">padiSession(connector) — ONE factory</text><text x="540.0" y="505" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">reconnectingSession({ connectOnce: connector,</text><text x="540.0" y="518" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">  admit: padiAdmit /* hello→decide→drain */ })</text><text x="540.0" y="531" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">spread-extended: { ...base, convergence,</text><text x="540.0" y="544" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">renew, preservation, … }  ← TS-idiomatic derive</text><path d="M 540 470 L 520 310" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a5)" stroke-dasharray="4 3"/><text x="530.0" y="383.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">built on</text><rect x="720" y="470" width="232" height="90" rx="9" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="836.0" y="489" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">the two former arms</text><text x="836.0" y="505" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">local  = padiSession(endpointConnector)</text><text x="836.0" y="518" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">remote = padiSession(sshConnector)</text><text x="836.0" y="531" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">ONE construction, two plugs —</text><text x="836.0" y="544" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">LocalPadiSession/RemotePadiSession collapse</text><path d="M 720 505 L 690 505" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a5)"/><text x="705.0" y="498.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85"></text><g font-size="10.5" fill="currentColor" opacity="0.9"><text x="60" y="606" font-weight="700">One loop, two plugs, one hook:</text><text x="270" y="606">the reconnect volatility lives once; transports are connectors; supervision is the admit hook; extension is object spread (closures, not classes).</text></g></svg>