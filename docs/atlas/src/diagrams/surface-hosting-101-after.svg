<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="inherit" role="img" aria-label="The hosting side AFTER the simplifications, now with the implementations shown: HostSession implements the base role only; the two padi arms implement the daemon sub-role and stand behind the BoundPadi alias"><defs><marker id="a3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="currentColor" opacity="0.75"/></marker></defs><rect x="28" y="18" width="924" height="42" rx="9" fill="#22a06b" fill-opacity="0.07" stroke="#22a06b" stroke-width="1.5"/><text x="490.0" y="37" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">UNIVERSAL: every surface server auto-answers hello (framework-stamped) — padi · kaval · drishti agents · test fakes</text><text x="490.0" y="53" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">identity is a property of SERVING; any client may ask &quot;who are you&quot; before any versioned handshake</text><rect x="300" y="90" width="380" height="92" rx="9" fill="#22a06b" fill-opacity="0.1" stroke="#22a06b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="490.0" y="109" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">MirrorSession&lt;Client&gt; — the base ROLE</text><text x="490.0" y="125" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">pin · currentClient · onState · destroy</text><text x="490.0" y="138" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">identity(): ServerIdentity | null  ← universal</text><text x="490.0" y="151" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">(3 implementations, below)</text><rect x="710" y="90" width="242" height="92" rx="9" fill="#22a06b" fill-opacity="0.1" stroke="#22a06b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="831.0" y="109" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">ServerIdentity (one value)</text><text x="831.0" y="125" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">contractVersion · startedAt</text><text x="831.0" y="138" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">buildId = convergence currency</text><text x="831.0" y="151" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">commit = navigable — distinct</text><rect x="390" y="228" width="260" height="72" rx="9" fill="#22a06b" fill-opacity="0.1" stroke="#22a06b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="520.0" y="247" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">DaemonMirrorSession — sub-role</text><text x="520.0" y="263" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">extends MirrorSession</text><text x="520.0" y="276" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">+ convergence() — supervision only</text><text x="520.0" y="289" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">(2 implementations, below)</text><path d="M 520 228 L 520 182" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a3)"/><text x="520.0" y="198.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">extends</text><rect x="40" y="340" width="260" height="96" rx="9" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-width="1.5"/><text x="170.0" y="359" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">HostSession  (class)</text><text x="170.0" y="375" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">implements MirrorSession ONLY</text><text x="170.0" y="388" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">ssh + Nix + reconnect appliance;</text><text x="170.0" y="401" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">fronts ANY server; supervises nothing</text><text x="170.0" y="414" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">→ drishti holds N of these directly</text><path d="M 170 340 L 420 182" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a3)"/><text x="295.0" y="254.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">implements the base role</text><rect x="340" y="340" width="280" height="96" rx="9" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.5"/><text x="480.0" y="359" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">LocalPadiSession  (local arm)</text><text x="480.0" y="375" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">implements DaemonMirrorSession</text><text x="480.0" y="388" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">today: PadiBindingSession — renamed;</text><text x="480.0" y="401" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">unix socket · runs the kit policy</text><path d="M 480 340 L 490 300" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a3)"/><text x="485.0" y="313.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">implements</text><rect x="660" y="340" width="292" height="96" rx="9" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.5"/><text x="806.0" y="359" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">RemotePadiSession  (remote arm)</text><text x="806.0" y="375" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">implements DaemonMirrorSession</text><text x="806.0" y="388" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">WRAPS a HostSession (composition) and</text><text x="806.0" y="401" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">adds supervision (decide() + fence) on top</text><path d="M 800 340 L 560 300" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a3)"/><text x="680.0" y="313.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">implements</text><path d="M 660 388 L 300 388" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.75" marker-end="url(#a3)"/><text x="480.0" y="381.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">wraps →</text><rect x="500" y="480" width="300" height="64" rx="9" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="650.0" y="499" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">BoundPadi — kolu&#x27;s ALIAS</text><text x="650.0" y="515" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">= DaemonMirrorSession&lt;PadiClient&gt;</text><text x="650.0" y="528" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">&amp; { preservation · renew() }</text><path d="M 560 480 L 470 436" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a3)"/><text x="515.0" y="451.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">its type names the two arms</text><path d="M 740 480 L 810 436" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#a3)"/><text x="775.0" y="451.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85"></text><rect x="40" y="480" width="400" height="64" rx="9" fill="#c08a2d" fill-opacity="0.1" stroke="#c08a2d" stroke-width="1.5"/><text x="240.0" y="499" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">consumers (unchanged from the main diagram)</text><text x="240.0" y="515" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">pump/reServe → MirrorSession ✓ · registry → DestroyableSession ✓</text><text x="240.0" y="528" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">browser provider → Accessor&lt;ControlPlane&gt; ✓</text><g font-size="10.5" fill="currentColor" opacity="0.9"><text x="40" y="600" font-weight="700">Who implements what:</text><text x="185" y="600">MirrorSession ← HostSession + both padi arms · DaemonMirrorSession ← the two padi arms only · BoundPadi = their shared type, named</text><text x="40" y="622" opacity="0.75">dashed = interface · solid = running code · kaval never appears here: it is supervised BY padi one layer down, not bound by kolu-server</text></g></svg>