<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="system-ui, sans-serif">
  <rect width="920" height="300" fill="#0f1117"/>
  <!-- legend -->
  <g font-size="10.5" fill="#8b95a7">
    <circle cx="640" cy="26" r="5" fill="#2dd4a7"/><text x="652" y="30">shipped</text>
    <circle cx="722" cy="26" r="5" fill="#e8b44c"/><text x="734" y="30">small delta</text>
    <circle cx="820" cy="26" r="5" fill="#5b8def"/><text x="832" y="30">new build</text>
  </g>

  <!-- feature nodes -->
  <g>
    <rect x="30" y="60" width="200" height="58" rx="9" fill="#141925" stroke="#2dd4a7" stroke-width="1.5"/>
    <text x="44" y="82" fill="#7fe3c3" font-size="12.5" font-weight="600">padi-tui create</text>
    <text x="44" y="99" fill="#8b95a7" font-size="10.5">--worktree · --parent · -- argv → id</text>

    <rect x="30" y="140" width="200" height="58" rx="9" fill="#141925" stroke="#2dd4a7" stroke-width="1.5"/>
    <text x="44" y="162" fill="#7fe3c3" font-size="12.5" font-weight="600">kaval-tui send / wait / snapshot</text>
    <text x="44" y="179" fill="#8b95a7" font-size="10.5">the messaging loop (proven in campaign)</text>

    <rect x="30" y="220" width="200" height="58" rx="9" fill="#141925" stroke="#2dd4a7" stroke-width="1.5"/>
    <text x="44" y="242" fill="#7fe3c3" font-size="12.5" font-weight="600">sub-terminal parentId</text>
    <text x="44" y="259" fill="#8b95a7" font-size="10.5">a relation on the wire, rendered</text>

    <rect x="300" y="60" width="200" height="58" rx="9" fill="#141925" stroke="#e8b44c" stroke-width="1.5"/>
    <text x="314" y="82" fill="#f0d49b" font-size="12.5" font-weight="600">F1 · spawn placement</text>
    <text x="314" y="99" fill="#8b95a7" font-size="10.5">create --near &lt;tile&gt; --title &lt;role&gt;</text>

    <rect x="300" y="140" width="200" height="58" rx="9" fill="#141925" stroke="#5b8def" stroke-width="1.5"/>
    <text x="314" y="162" fill="#9db4e8" font-size="12.5" font-weight="600">F2 · terminal relations</text>
    <text x="314" y="179" fill="#8b95a7" font-size="10.5">chrome.setRelation {to, kind, label}</text>

    <rect x="300" y="220" width="200" height="58" rx="9" fill="#141925" stroke="#5b8def" stroke-width="1.5"/>
    <text x="314" y="242" fill="#9db4e8" font-size="12.5" font-weight="600">F4 · /goal stop-hook</text>
    <text x="314" y="259" fill="#8b95a7" font-size="10.5">can't stop silently; useful solo</text>

    <rect x="570" y="140" width="200" height="58" rx="9" fill="#141925" stroke="#5b8def" stroke-width="1.5"/>
    <text x="584" y="162" fill="#9db4e8" font-size="12.5" font-weight="600">F3 · canvas team edges</text>
    <text x="584" y="179" fill="#8b95a7" font-size="10.5">render F2 + role badges</text>
  </g>

  <!-- capstone -->
  <rect x="700" y="52" width="190" height="74" rx="10" fill="#1a2130" stroke="#c07ae8" stroke-width="2"/>
  <text x="716" y="78" fill="#dbb8f0" font-size="14" font-weight="700">/team</text>
  <text x="716" y="96" fill="#c8d0de" font-size="10.5">convene · brief · lifecycle ·</text>
  <text x="716" y="110" fill="#c8d0de" font-size="10.5">disband — composes F1–F4</text>

  <!-- arrows -->
  <g stroke="#3d4a63" stroke-width="1.6" fill="none">
    <path d="M232 89 L 298 89"/>
    <path d="M232 249 C 265 249, 270 200, 298 178"/>
    <path d="M502 169 L 568 169"/>
    <path d="M502 89 C 590 89, 640 89, 698 89"/>
    <path d="M772 138 C 790 132, 795 128, 795 128"/>
    <path d="M502 249 C 620 245, 680 150, 700 122"/>
    <path d="M232 169 C 400 320, 660 260, 705 124" stroke-dasharray="5 3"/>
  </g>
  <text x="536" y="60" fill="#8b95a7" font-size="10">F1 → /team</text>
  <text x="507" y="160" fill="#8b95a7" font-size="10">F2 → F3</text>
</svg>
