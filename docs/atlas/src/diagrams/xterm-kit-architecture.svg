<svg viewBox="0 0 980 704" width="100%" role="img" aria-label="The package boundary for kolu's xterm machinery. Two consumers sit on top: the kolu client's Terminal.tsx policy half (padi attach wire, frame kinds, keybindings, theme values, renderer preference, WebGL budget policy, paste and drop upload, file-ref links, tap policy, MobileKeyBar and sticky modifiers, mobile chrome, activity, diagnostics, the e2e __xterm bridge) imports both the core and the /solid entrypoint; the kaval daemon's ptyHost.ts policy half (node-pty spawn and exit, attach and getHistory verbs, bounded-snapshot cache, reflow-epoch stale replies, OSC metadata, foreground sampling, the headless mirror itself) imports the core only, keeping solid-js and the DOM out of the daemon closure. The package holds two compartments. The /solid browser adapter: the Xterm component, createXtermLifecycle for owner-correct async construct and dispose, attachWebGL for single-owner addon lifetime with context-loss recovery and deterministic loseContext release, createRenderRecovery for forced sync repaints, wireScrollIntent, and the touch surface — enableSoftKeyboardInput, wireTouchTaps, and wireTouchScroll — owning tap-vs-scroll discrimination and the soft-keyboard focus rules, with an IME-routing slot reserved for the open PR 1634. The runtime-neutral core, which works on any terminal, browser or headless, with no DOM and no solid-js: the hardened write path (createScrollLock, createSnapshotBoundary, createBackfillController with seam tokens, RIS halt, and generation guards, fetch injected so no wire type enters), fail-loud buffer surgery (prependScrollback: in-place splice, register shift, renderer pokes, throwing on any missing symbol or headroom shortfall), mirror anchoring joining from kaval (createMirrorAnchor: onTrim eviction origin, RIS re-anchor, reflowEpoch, plus snapToWrapHead for wrap-safe serialize cuts), and the /internals door to _core.* whose cosmetic reads degrade to null. The contract-pin tests ship inside the package so any pinned-symbol move on an xterm bump is red CI. Underneath, the volatility adapted: the exact-pinned @xterm/xterm 6.1.0-beta.225 with its addons in the browser, and @xterm/headless 6.0.0 in node, their BufferLine shapes verified identical by the pins." style="max-width:980px;font:13px ui-sans-serif,system-ui,sans-serif">
  <defs>
    <marker id="xkArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-muted,#8a8f98)" />
    </marker>
    <marker id="xkGood" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--good-stroke,#15803D)" />
    </marker>
    <marker id="xkStruct" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--struct-stroke,#0D32B2)" />
    </marker>
  </defs>

  <!-- consumer: kolu client -->
  <rect x="20" y="20" width="452" height="168" rx="12" fill="none" stroke="var(--ink-muted,#b6bcc6)" stroke-width="1.3" stroke-dasharray="5 5" />
  <text x="34" y="44" font-size="11" font-weight="700" fill="var(--ink,#1a1d21)" font-family="ui-monospace,'SF Mono',Menlo,monospace">kolu client · Terminal.tsx — the policy half (stays)</text>
  <text x="34" y="62" font-size="9.5" font-style="italic" fill="var(--ink-muted,#8a8f98)">which bytes, when, for whom</text>
  <text x="34" y="84" font-size="10" fill="var(--struct-sub,#4A5072)">padi attach wire · frame kinds (snapshot | delta) · unenrolledStreamCall</text>
  <text x="34" y="102" font-size="10" fill="var(--struct-sub,#4A5072)">keybindings + prohibited chords · theme values · renderer preference</text>
  <text x="34" y="120" font-size="10" fill="var(--struct-sub,#4A5072)">WebGL budget policy — which tiles hold a context (webglBudget.ts)</text>
  <text x="34" y="138" font-size="10" fill="var(--struct-sub,#4A5072)">paste/drop upload · file-ref links · tap policy (what a tap opens)</text>
  <text x="34" y="156" font-size="10" fill="var(--struct-sub,#4A5072)">MobileKeyBar + sticky modifiers · mobile chrome</text>
  <text x="34" y="174" font-size="10" fill="var(--struct-sub,#4A5072)">activity + diagnostics · the e2e __xterm bridge</text>

  <!-- consumer: kaval daemon -->
  <rect x="508" y="20" width="452" height="168" rx="12" fill="none" stroke="var(--ink-muted,#b6bcc6)" stroke-width="1.3" stroke-dasharray="5 5" />
  <text x="522" y="44" font-size="11" font-weight="700" fill="var(--ink,#1a1d21)" font-family="ui-monospace,'SF Mono',Menlo,monospace">kaval daemon · ptyHost.ts — the policy half (stays)</text>
  <text x="522" y="62" font-size="9.5" font-style="italic" fill="var(--ink-muted,#8a8f98)">PTYs, verbs, metadata</text>
  <text x="522" y="84" font-size="10" fill="var(--struct-sub,#4A5072)">node-pty spawn/exit · attach + getHistory verbs</text>
  <text x="522" y="102" font-size="10" fill="var(--struct-sub,#4A5072)">bounded-snapshot cache · reflow-epoch stale replies</text>
  <text x="522" y="120" font-size="10" fill="var(--struct-sub,#4A5072)">OSC 7/633 metadata · foreground sampling · XTVERSION answer</text>
  <text x="522" y="138" font-size="10" fill="var(--struct-sub,#4A5072)">the mirror itself — one headless xterm per PTY</text>

  <!-- consumer → package arrows -->
  <path d="M246 188 L246 236" fill="none" stroke="var(--good-stroke,#15803D)" stroke-width="2" marker-end="url(#xkGood)" />
  <text x="258" y="216" font-size="10" font-weight="600" fill="var(--good-text,#166534)">imports core + /solid</text>
