  <text x="54" y="430" font-size="9.5" fill="var(--struct-sub,#4A5072)">single-owner addon · context-loss recovery ·</text>
  <text x="54" y="443" font-size="9.5" fill="var(--struct-sub,#4A5072)">deterministic loseContext() release</text>
  <text x="54" y="475" font-size="10" font-weight="600" fill="var(--ink,#1a1d21)" font-family="ui-monospace,'SF Mono',Menlo,monospace">createRenderRecovery</text>
  <text x="54" y="489" font-size="9.5" fill="var(--struct-sub,#4A5072)">forced sync repaint when the rAF loop parks</text>
  <text x="54" y="521" font-size="10" font-weight="600" fill="var(--ink,#1a1d21)" font-family="ui-monospace,'SF Mono',Menlo,monospace">wireScrollIntent</text>
  <text x="54" y="535" font-size="9.5" fill="var(--struct-sub,#4A5072)">DOM wheel/pointer wiring for the core scroll lock</text>
  <text x="54" y="553" font-size="10" font-weight="600" fill="var(--ink,#1a1d21)" font-family="ui-monospace,'SF Mono',Menlo,monospace">enableSoftKeyboardInput · wireTouch*</text>
  <text x="54" y="567" font-size="9.5" fill="var(--struct-sub,#4A5072)">tap-vs-scroll · soft-keyboard rules · IME slot</text>

  <!-- composes arrow -->
  <path d="M324 424 L344 424" fill="none" stroke="var(--ink-muted,#8a8f98)" stroke-width="1.5" marker-end="url(#xkArrow)" />
  <text x="334" y="414" text-anchor="middle" font-size="8.5" font-style="italic" fill="var(--ink-muted,#8a8f98)">uses</text>

  <!-- core compartment -->
  <rect x="344" y="276" width="596" height="296" rx="8" fill="var(--surface,#F7F8FE)" stroke="var(--struct-stroke,#0D32B2)" stroke-width="1.5" />
  <text x="642" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="var(--struct-stroke,#0D32B2)" font-family="ui-monospace,'SF Mono',Menlo,monospace">core — runtime-neutral: any Terminal, browser or headless · no DOM · no solid-js</text>

  <!-- core: hardened write path -->
  <rect x="360" y="312" width="280" height="118" rx="6" fill="none" stroke="var(--struct-stroke,#0D32B2)" stroke-width="1.2" />
  <text x="500" y="332" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink,#11203a)">hardened write path</text>
  <text x="500" y="350" text-anchor="middle" font-size="9.5" fill="var(--struct-sub,#4A5072)" font-family="ui-monospace,'SF Mono',Menlo,monospace">createScrollLock · createSnapshotBoundary</text>
