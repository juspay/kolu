  <text x="500" y="480" text-anchor="middle" font-size="9.5" fill="var(--struct-sub,#4A5072)" font-family="ui-monospace,'SF Mono',Menlo,monospace">createMirrorAnchor · snapToWrapHead</text>
  <text x="500" y="498" text-anchor="middle" font-size="9.5" fill="var(--struct-sub,#4A5072)">onTrim eviction origin · RIS re-anchor · reflowEpoch</text>
  <text x="500" y="516" text-anchor="middle" font-size="9.5" fill="var(--struct-sub,#4A5072)">wrap-safe serialize cuts</text>
  <text x="500" y="534" text-anchor="middle" font-size="9.5" font-style="italic" fill="var(--ink-muted,#8a8f98)">fail-loud too — a frozen origin corrupts history</text>

