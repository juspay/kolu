  <text x="54" y="324" font-size="10" font-weight="600" fill="var(--ink,#1a1d21)" font-family="ui-monospace,'SF Mono',Menlo,monospace">&lt;Xterm&gt;</text>
  <text x="54" y="338" font-size="9.5" fill="var(--struct-sub,#4A5072)">the component form — reactive props, onReady handle</text>
  <text x="54" y="370" font-size="10" font-weight="600" fill="var(--ink,#1a1d21)" font-family="ui-monospace,'SF Mono',Menlo,monospace">createXtermLifecycle</text>
  <text x="54" y="384" font-size="9.5" fill="var(--struct-sub,#4A5072)">owner-correct async construct + dispose (#591/#606)</text>
