  <text x="788" y="480" text-anchor="middle" font-size="9.5" fill="var(--struct-sub,#4A5072)">cosmetic reads degrade to null</text>
  <text x="788" y="496" text-anchor="middle" font-size="9.5" fill="var(--struct-sub,#4A5072)" font-family="ui-monospace,'SF Mono',Menlo,monospace">renderService · readBufferBytes · coords patch</text>
