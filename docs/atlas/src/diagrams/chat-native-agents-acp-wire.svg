<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="ui-sans-serif,system-ui,sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3a6ea5"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b7a3a"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6d4fa3"/>
    </marker>
  </defs>

  <!-- ══════════ Xyne Spaces ══════════ -->
  <rect x="20" y="90" width="170" height="120" rx="12" fill="#faf8f2" stroke="#ddd6c4"/>
  <text x="38" y="114" font-size="12" font-weight="700" fill="#5b6470" letter-spacing=".07em">XYNE SPACES</text>
  <text x="38" y="136" font-size="12" fill="#1a1c20">your chat threads</text>
  <text x="38" y="156" font-size="12" fill="#1a1c20">app API · flow cards</text>
  <text x="38" y="176" font-size="12" fill="#8a8272">identity · delivery</text>

  <!-- ══════════ pesu ══════════ -->
  <rect x="260" y="90" width="170" height="120" rx="12" fill="#faf8f2" stroke="#ddd6c4"/>
  <text x="278" y="114" font-size="12" font-weight="700" fill="#5b6470" letter-spacing=".07em">PESU — DAEMON</text>
  <text x="278" y="136" font-size="12" fill="#1a1c20">webhook + binds</text>
  <text x="278" y="156" font-size="12" fill="#1a1c20">ACP client (official lib)</text>
  <text x="278" y="176" font-size="12" font-family="ui-monospace,monospace" fill="#8a8272">thread ↔ terminal</text>

  <!-- ══════════ kolu terminal boundary ══════════ -->
  <rect x="500" y="50" width="480" height="220" rx="12" fill="#faf8f2" stroke="#ddd6c4"/>
  <text x="518" y="76" font-size="12" font-weight="700" fill="#5b6470" letter-spacing=".07em">KOLU TERMINAL — KAVAL PTY TILE</text>

  <rect x="520" y="100" width="190" height="110" rx="8" fill="#ffffff" stroke="#c9c2b0"/>
  <text x="536" y="124" font-size="12" font-weight="700" fill="#6d4fa3">@kolu/acp · acp-proxy</text>
  <text x="536" y="146" font-size="12" fill="#1a1c20">serves ACP on a socket</text>
  <text x="536" y="166" font-size="12" fill="#1a1c20">spawn · respawn · cancel</text>
  <text x="536" y="186" font-size="12" fill="#8a8272">renders frames in the PTY</text>

  <rect x="760" y="100" width="200" height="110" rx="8" fill="#ffffff" stroke="#c9c2b0"/>
  <text x="776" y="124" font-size="12" font-weight="700" fill="#1a1c20">ACP adapter</text>
  <text x="776" y="146" font-size="12" fill="#1a1c20">claude-agent-acp ·</text>
  <text x="776" y="166" font-size="12" fill="#1a1c20">codex-acp — any stdio</text>
  <text x="776" y="186" font-size="12" font-family="ui-monospace,monospace" fill="#8a8272">headless — no TUI</text>

  <text x="520" y="250" font-size="12" fill="#8a8272">the tile is the depth view — messages, tool calls, permission decisions scroll by</text>

  <!-- ══════════ arrows ══════════ -->
  <!-- XS → pesu webhook -->
  <line x1="190" y1="120" x2="260" y2="120" stroke="#3a6ea5" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="196" y="110" font-size="11" fill="#3a6ea5">webhook · HMAC</text>
  <!-- pesu → XS replies -->
  <line x1="260" y1="180" x2="190" y2="180" stroke="#3a6ea5" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="120" y="230" font-size="11" fill="#3a6ea5">postMessage · updateMessage</text>
  <text x="120" y="246" font-size="11" fill="#3a6ea5">agentProgress · flow cards</text>

  <!-- pesu → proxy ACP socket -->
  <line x1="430" y1="150" x2="520" y2="150" stroke="#6d4fa3" stroke-width="2" marker-start="url(#arrP)" marker-end="url(#arrP)"/>
  <text x="436" y="140" font-size="11" font-weight="700" fill="#6d4fa3">ACP · unix socket</text>

  <!-- proxy → adapter ACP stdio -->
  <line x1="710" y1="150" x2="760" y2="150" stroke="#6d4fa3" stroke-width="2" marker-start="url(#arrP)" marker-end="url(#arrP)"/>
  <text x="702" y="140" font-size="11" font-weight="700" fill="#6d4fa3">ACP · stdio</text>

  <!-- pesu → padi lifecycle.create -->
  <path d="M 345 90 C 345 20, 740 10, 740 50" fill="none" stroke="#1b7a3a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
  <text x="470" y="26" font-size="11" fill="#1b7a3a">padi lifecycle.create — the tile is an ordinary terminal</text>
</svg>
