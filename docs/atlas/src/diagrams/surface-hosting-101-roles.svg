<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="inherit" role="img" aria-label="How the session pieces relate: one role at the top, implementations below it, kolu's extension beside, and the two framework consumers at the bottom — one of which wrongly names the class"><defs><marker id="m1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="currentColor" opacity="0.75"/></marker></defs><rect x="330" y="22" width="320" height="86" rx="9" fill="#22a06b" fill-opacity="0.1" stroke="#22a06b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="490.0" y="41" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">RemoteMirrorSession — the ROLE</text><text x="490.0" y="57" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">an interface: the PLUG SHAPE, nothing runs</text><text x="490.0" y="70" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">pin() · currentClient() · onState() · destroy()</text><text x="490.0" y="83" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">&quot;hand me a live client + tell me the pipe&#x27;s state&quot;</text><rect x="60" y="190" width="270" height="104" rx="9" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-width="1.5"/><text x="195.0" y="209" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">HostSession — a CLASS</text><text x="195.0" y="225" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">the ssh+Nix appliance that FITS the plug:</text><text x="195.0" y="238" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">provision binary → run over ssh →</text><text x="195.0" y="251" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">reconnect w/ backoff → give up loudly</text><text x="195.0" y="264" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">drishti holds N of these (its fleet)</text><path d="M 195 190 L 420 112" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#m1)"/><text x="307.5" y="144.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">implements the role</text><rect x="650" y="190" width="270" height="96" rx="9" fill="#22a06b" fill-opacity="0.1" stroke="#22a06b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="785.0" y="209" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">BoundPadi — kolu&#x27;s SUB-ROLE</text><text x="785.0" y="225" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">the same plug + 2 padi-shaped pins:</text><text x="785.0" y="238" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">drainBoundPadi() — restart verb</text><text x="785.0" y="251" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">padi identity readouts (hello)</text><path d="M 785 190 L 560 112" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#m1)" stroke-dasharray="6 4"/><text x="672.5" y="144.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">extends the role (still an interface)</text><rect x="520" y="340" width="240" height="96" rx="9" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.5"/><text x="640.0" y="359" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">PadiBindingSession (local arm)</text><text x="640.0" y="375" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">unix socket to a padi on THIS box</text><text x="640.0" y="388" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">its own reconnect loop (transport-</text><text x="640.0" y="401" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">dictated — audited: L6 verdict c)</text><rect x="790" y="340" width="180" height="96" rx="9" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.5"/><text x="880.0" y="359" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">RemotePadiSession</text><text x="880.0" y="375" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">(remote arm)</text><text x="880.0" y="388" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">WRAPS a HostSession</text><text x="880.0" y="401" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">+ convergence policy</text><text x="880.0" y="414" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">(the L3 kit&#x27;s decide())</text><path d="M 640 340 L 720 286" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#m1)"/><text x="680.0" y="306.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">implements BoundPadi</text><path d="M 880 340 L 850 286" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#m1)"/><text x="865.0" y="306.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.85">implements BoundPadi</text><path d="M 790 392 L 330 260" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.75" marker-end="url(#m1)"/><text x="560.0" y="319.0" text-anchor="middle" font-size="9.5" fill="#a855f7" opacity="0.85">wraps →</text><rect x="40" y="340" width="240" height="80" rx="9" fill="#c08a2d" fill-opacity="0.1" stroke="#c08a2d" stroke-width="1.5"/><text x="160.0" y="359" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">reServeSurface (consumer)</text><text x="160.0" y="375" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">mirror + serve-again machinery</text><text x="160.0" y="388" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">accepts ANY plug — it consumes</text><text x="160.0" y="401" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">the ROLE. Correct.</text><path d="M 160 340 L 400 112" stroke="#22a06b" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#m1)"/><text x="280.0" y="219.0" text-anchor="middle" font-size="9.5" fill="#22a06b" opacity="0.85">consumes the role ✓</text><rect x="40" y="460" width="340" height="74" rx="9" fill="#c08a2d" fill-opacity="0.1" stroke="#c08a2d" stroke-width="1.5"/><text x="210.0" y="479" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">buildHostRegistry (consumer)</text><text x="210.0" y="495" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">session-per-host map + ?host= dispatch</text><text x="210.0" y="508" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">slot today: session: HostSession  ← names the APPLIANCE</text><text x="210.0" y="521" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.82">the widen: session: PoolableSession (the role + destroy)</text><path d="M 230 460 L 195 296" stroke="#d64545" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#m1)"/><text x="212.5" y="371.0" text-anchor="middle" font-size="9.5" fill="#d64545" opacity="0.85">✗ today: names the class (the bug)</text><path d="M 330 460 L 470 114" stroke="#22a06b" stroke-width="1.4" fill="none" opacity="0.75" marker-end="url(#m1)" stroke-dasharray="5 4"/><text x="400.0" y="280.0" text-anchor="middle" font-size="9.5" fill="#22a06b" opacity="0.85">→ the widen: back to the role</text><g font-size="10" fill="currentColor" opacity="0.85"><text x="420" y="480">dashed box = interface (a shape, nothing runs)</text><text x="420" y="497">solid box = running code</text><text x="420" y="514">arrows: implements / extends / wraps / consumes</text><text x="420" y="531">green ✓ = speaks the role · red ✗ = names the class (the smell)</text></g></svg>