<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" font-family="inherit" role="img" aria-label="Port-forward preview: two hops that are both existing pipes — browser to kolu-server over the normal origin, kolu-server to the dev server through padi over the existing surface wire"><defs><marker id="pf" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="currentColor" opacity="0.75"/></marker></defs><rect x="20" y="60" width="230" height="140" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="3 4"/><text x="135" y="52" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">YOUR MACHINE (anywhere)</text><rect x="330" y="60" width="280" height="300" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="3 4"/><text x="470" y="52" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">HEADLESS BOX (runs kolu-server)</text><rect x="690" y="60" width="270" height="300" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="3 4"/><text x="825" y="52" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">REMOTE PADI HOST (over ssh)</text><rect x="40" y="90" width="190" height="80" rx="9" fill="#3b82f6" fill-opacity="0.11" stroke="#3b82f6" stroke-width="1.5"/><text x="135.0" y="111" text-anchor="middle" font-size="13.5" font-weight="700" fill="currentColor">Browser</text><text x="135.0" y="129" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.82">kolu tab + the preview</text><text x="135.0" y="143" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.82">iframe — ONE origin</text><rect x="360" y="90" width="220" height="80" rx="9" fill="#22a06b" fill-opacity="0.11" stroke="#22a06b" stroke-width="1.5"/><text x="470.0" y="111" text-anchor="middle" font-size="13.5" font-weight="700" fill="currentColor">kolu-server</text><text x="470.0" y="129" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.82">reverse-proxy route:</text><text x="470.0" y="143" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.82">/preview-port/&lt;host&gt;/&lt;port&gt;/*</text><rect x="360" y="240" width="220" height="90" rx="9" fill="#22a06b" fill-opacity="0.11" stroke="#22a06b" stroke-width="1.5" stroke-dasharray="5 3"/><text x="470.0" y="261" text-anchor="middle" font-size="13.5" font-weight="700" fill="currentColor">padi wire (exists)</text><text x="470.0" y="279" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.82">stdio-over-ssh surface link:</text><text x="470.0" y="293" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.82">cells · procedures · BYTE</text><text x="470.0" y="307" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.82">STREAMS (terminalAttach kin)</text><rect x="710" y="90" width="230" height="80" rx="9" fill="#a855f7" fill-opacity="0.11" stroke="#a855f7" stroke-width="1.5"/><text x="825.0" y="111" text-anchor="middle" font-size="13.5" font-weight="700" fill="currentColor">padi (on the host)</text><text x="825.0" y="129" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.82">port sensor: sees the URL in</text><text x="825.0" y="143" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.82">PTY output · serves ports cell</text><rect x="710" y="240" width="230" height="90" rx="9" fill="#c08a2d" fill-opacity="0.11" stroke="#c08a2d" stroke-width="1.5"/><text x="825.0" y="261" text-anchor="middle" font-size="13.5" font-weight="700" fill="currentColor">dev server</text><text x="825.0" y="279" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.82">localhost:3000 — started by</text><text x="825.0" y="293" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.82">the agent in a kolu terminal</text><text x="825.0" y="307" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.82">(never exposed publicly)</text><path d="M 230 130 L 360 130" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.8" marker-end="url(#pf)"/><text x="295.0" y="122.0" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.9">HOP A: normal kolu origin (HTTPS/WS) — already open</text><path d="M 470 170 L 470 240" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.8" marker-end="url(#pf)"/><text x="470.0" y="197.0" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.9">rides</text><path d="M 580 285 L 710 285" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.8" marker-end="url(#pf)"/><text x="645.0" y="277.0" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.9">HOP B: TCP bytes as a surface</text><text x="645" y="300" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.9">byte-stream member — the pipe already exists</text><path d="M 825 240 L 825 170" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.8" marker-end="url(#pf)"/><text x="825.0" y="197.0" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.9">padi dials localhost:3000 (loopback, on-host)</text><text x="30" y="400" font-size="11" fill="currentColor" opacity="0.85"><tspan font-weight="700">The trick:</tspan> nothing new listens anywhere. The browser talks to the origin it already trusts; kolu-server pipes bytes down the padi wire it already holds; padi dials loopback on its own host. Two hops = two existing pipes.</text></svg>