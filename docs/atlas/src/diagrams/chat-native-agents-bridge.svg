<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 668" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">The seam — observe out raw; act in through the coordinator</title>
  <desc id="desc">XS, the chat app, sits on top and owns identity, login, presence, and attribution. Two channels connect it to kolu below. The green OBSERVE channel flows out of padi raw and read-only: the who-needs-me board, attention pings, and deep links into kolu for depth. The blue ACT channel flows in through one door: the coordinator, an orchestrator agent running in an ordinary kolu terminal, whose inbox is the write floor and which also assists the humans' own discussion. Inside the kolu machine, the coordinator terminal drives the worker terminals with the fleet loop — create, send, wait, snapshot — while padi watches every terminal with agent sensors and owns durable sessions, and kaval owns each PTY as its single writer. Chat has no raw write verbs on workers; that absence is the design.</desc>
  <defs>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 z" fill="#15803D" />
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 z" fill="#0D32B2" />
    </marker>
    <marker id="arrK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="760" height="668" fill="#fbfbfd" />
  <text x="40" y="34" font-size="17" font-weight="700" fill="#1a1c20">The seam — observe out raw · act through the coordinator</text>
  <text x="40" y="54" font-size="12" fill="#5b6472">one attributed inbox is the write floor · chat never writes to a worker terminal</text>

  <!-- XS box -->
  <rect x="40" y="72" width="680" height="84" rx="10" fill="#ffffff" stroke="#cbd2dc" stroke-width="1.5" />
  <text x="60" y="100" font-size="14" font-weight="700" fill="#1a1c20">XS — the chat app</text>
  <text x="60" y="120" font-size="12" fill="#5b6472">owns identity · login · presence · attribution — humans discuss here, the coordinator participates</text>
  <text x="60" y="140" font-size="12" fill="#5b6472">renders the board · pings attention · deep-links into kolu for depth</text>

  <!-- OBSERVE channel (green, up) -->
  <line x1="150" y1="296" x2="150" y2="162" stroke="#15803D" stroke-width="2.5" marker-end="url(#arrG)" />
  <text x="94" y="188" font-size="12.5" font-weight="700" fill="#15803D">OBSERVE — raw · read-only</text>
  <text x="94" y="207" font-size="11.5" fill="#3f6212">the board straight off padi:</text>
  <text x="94" y="223" font-size="11.5" fill="#3f6212">working · asking you · just finished</text>
  <text x="94" y="239" font-size="11.5" fill="#3f6212">attention pings the thread</text>
  <text x="94" y="255" font-size="11.5" fill="#3f6212">deep links → depth in kolu itself</text>

  <!-- ACT channel (blue, down into the coordinator terminal) -->
  <line x1="560" y1="162" x2="560" y2="330" stroke="#0D32B2" stroke-width="2.5" marker-end="url(#arrB)" />
  <text x="430" y="188" font-size="12.5" font-weight="700" fill="#0D32B2">ACT — one door</text>
  <text x="430" y="207" font-size="11.5" fill="#31437c">thread messages, attributed,</text>
  <text x="430" y="223" font-size="11.5" fill="#31437c">land in the coordinator's inbox —</text>
  <text x="430" y="239" font-size="11.5" fill="#31437c">the write floor, serialized by</text>
  <text x="430" y="255" font-size="11.5" fill="#31437c">conversation, not by locks</text>

  <!-- kolu machine box -->
  <rect x="40" y="296" width="680" height="322" rx="10" fill="#f4f6f9" stroke="#cbd2dc" stroke-width="1.5" />
  <text x="60" y="322" font-size="13" font-weight="700" fill="#1a1c20">KOLU — on one machine, or several (local + ssh remotes behind one host switcher)</text>

  <!-- coordinator terminal -->
  <rect x="70" y="340" width="290" height="112" rx="8" fill="#ffffff" stroke="#0D32B2" stroke-width="2" />
  <text x="86" y="364" font-size="12.5" font-weight="700" fill="#0D32B2">the coordinator terminal</text>
  <text x="86" y="382" font-size="11.5" fill="#3c4553">an orchestrator agent in an ordinary PTY</text>
  <text x="86" y="398" font-size="11.5" fill="#3c4553">/orchestrator contract: claims verified at the</text>
  <text x="86" y="414" font-size="11.5" fill="#3c4553">tree · grounded rulings · recorded-PIDs-only</text>
  <text x="86" y="430" font-size="11.5" fill="#3c4553">teardown · the human merges every PR</text>

  <!-- fleet loop arrow -->
  <line x1="360" y1="396" x2="428" y2="396" stroke="#64748b" stroke-width="2" marker-end="url(#arrK)" />
  <text x="394" y="384" font-size="10.5" fill="#5b6472" text-anchor="middle">the fleet loop</text>
  <text x="394" y="414" font-size="10.5" fill="#5b6472" text-anchor="middle">create · send ·</text>
  <text x="394" y="428" font-size="10.5" fill="#5b6472" text-anchor="middle">wait · snapshot</text>

  <!-- worker terminals -->
  <rect x="430" y="340" width="260" height="112" rx="8" fill="#ffffff" stroke="#cbd2dc" stroke-width="1.5" />
  <text x="446" y="364" font-size="12.5" font-weight="700" fill="#1a1c20">worker terminals</text>
  <text x="446" y="382" font-size="11.5" fill="#3c4553">claude · codex · opencode — one task each,</text>
  <text x="446" y="398" font-size="11.5" fill="#3c4553">own git worktree, briefs + report-back tokens,</text>
  <text x="446" y="414" font-size="11.5" fill="#3c4553">questions routed back to the coordinator</text>
  <text x="446" y="430" font-size="11.5" fill="#3c4553">(never answered in their own PTY)</text>

  <!-- padi bar -->
  <rect x="70" y="472" width="620" height="52" rx="8" fill="#ffffff" stroke="#15803D" stroke-width="1.5" />
  <text x="86" y="493" font-size="12.5" font-weight="700" fill="#15803D">padi — agent sensors + durable sessions</text>
  <text x="86" y="511" font-size="11.5" fill="#3c4553">watches every terminal without touching it · folds to the board · owns restore identity across restarts</text>

  <!-- kaval bar -->
  <rect x="70" y="536" width="620" height="52" rx="8" fill="#ffffff" stroke="#cbd2dc" stroke-width="1.5" />
  <text x="86" y="557" font-size="12.5" font-weight="700" fill="#1a1c20">kaval — owns each live PTY, the single writer</text>
  <text x="86" y="575" font-size="11.5" fill="#3c4553">spawn · write · kill · resize — serializes input, last one wins · mirrors every screen</text>

  <text x="380" y="648" font-size="11.5" fill="#5b6472" text-anchor="middle">kolu authenticates nothing — the connection is the trust. Chat has no raw write verbs on workers: that absence is the design.</text>
</svg>
