<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" font-family="system-ui, sans-serif">
  <rect width="920" height="260" fill="#0f1117"/>
  <!-- legend -->
  <g font-size="10.5" fill="#8b95a7">
    <circle cx="790" cy="26" r="5" fill="#5b8def"/><text x="802" y="30">new build</text>
  </g>

  <!-- nodes -->
  <g>
    <rect x="40" y="100" width="240" height="58" rx="9" fill="#141925" stroke="#5b8def" stroke-width="1.5"/>
    <text x="54" y="122" fill="#9db4e8" font-size="12.5" font-weight="600">TR1 · every terminal a tile</text>
    <text x="54" y="139" fill="#8b95a7" font-size="10.5">auto-tiling + edges · splits retired</text>

    <rect x="390" y="100" width="240" height="58" rx="9" fill="#141925" stroke="#5b8def" stroke-width="1.5"/>
    <text x="404" y="122" fill="#9db4e8" font-size="12.5" font-weight="600">TR2 · depth legalized</text>
    <text x="404" y="139" fill="#8b95a7" font-size="10.5">recursive Dock · totality assert · restore fix</text>

    <rect x="680" y="170" width="210" height="58" rx="9" fill="#141925" stroke="#5b8def" stroke-width="1.5"/>
    <text x="694" y="192" fill="#9db4e8" font-size="12.5" font-weight="600">TR3 · focus = camera</text>
    <text x="694" y="209" fill="#8b95a7" font-size="10.5">maximized mode deleted</text>
  </g>

  <!-- edges -->
  <path d="M 280 129 L 388 129" stroke="#8b95a7" stroke-width="1.4" fill="none"/>
  <path d="M 388 129 l -12 -6 l 0 12 z" fill="#8b95a7"/>
  <path d="M 280 145 C 460 210, 560 200, 678 197" stroke="#8b95a7" stroke-width="1.4" fill="none" stroke-dasharray="5 4"/>
  <path d="M 678 197 l -12 -5 l 2 12 z" fill="#8b95a7"/>

  <text x="290" y="90" fill="#8b95a7" font-size="10">rendering must be total before depth becomes legal input</text>
  <text x="330" y="232" fill="#8b95a7" font-size="10">dashed = ordering preference (less canvas churn after TR1), not a dependency</text>
</svg>
