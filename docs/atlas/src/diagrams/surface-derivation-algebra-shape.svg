<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="system-ui, sans-serif">
  <rect width="980" height="470" fill="#0f1117"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b95a7"/>
    </marker>
  </defs>

  <!-- lane titles -->
  <text x="30" y="30" fill="#8b95a7" font-size="13" font-weight="600">SOURCES</text>
  <text x="330" y="30" fill="#8b95a7" font-size="13" font-weight="600">THE DERIVERS — declarations, not wiring</text>
  <text x="770" y="30" fill="#8b95a7" font-size="13" font-weight="600">MEMBERS (wire-read-only)</text>

  <!-- sources -->
  <rect x="25" y="46" width="230" height="72" rx="8" fill="#1a2130" stroke="#2dd4a7" stroke-width="1.5"/>
  <text x="140" y="68" fill="#e6eaf2" font-size="12" text-anchor="middle">push observables</text>
  <text x="140" y="85" fill="#8b95a7" font-size="10.5" text-anchor="middle">session.onState · system ticks</text>
  <text x="140" y="101" fill="#8b95a7" font-size="10.5" text-anchor="middle">→ observableSource(install)</text>

  <rect x="25" y="132" width="230" height="72" rx="8" fill="#1a2130" stroke="#2dd4a7" stroke-width="1.5"/>
  <text x="140" y="154" fill="#e6eaf2" font-size="12" text-anchor="middle">pollers</text>
  <text x="140" y="171" fill="#8b95a7" font-size="10.5" text-anchor="middle">read() + install(onTick)</text>
  <text x="140" y="187" fill="#8b95a7" font-size="10.5" text-anchor="middle">→ pollSource · pollCollection</text>

  <rect x="25" y="218" width="230" height="72" rx="8" fill="#1a2130" stroke="#2dd4a7" stroke-width="1.5"/>
  <text x="140" y="240" fill="#e6eaf2" font-size="12" text-anchor="middle">sibling members</text>
  <text x="140" y="257" fill="#8b95a7" font-size="10.5" text-anchor="middle">a collection/cell in the same spec</text>
  <text x="140" y="273" fill="#8b95a7" font-size="10.5" text-anchor="middle">→ from: "terminals" (boot-checked)</text>

  <rect x="25" y="304" width="230" height="72" rx="8" fill="#1a2130" stroke="#2dd4a7" stroke-width="1.5"/>
  <text x="140" y="326" fill="#e6eaf2" font-size="12" text-anchor="middle">keyed families</text>
  <text x="140" y="343" fill="#8b95a7" font-size="10.5" text-anchor="middle">members list/subscribe + attach(key)</text>
  <text x="140" y="359" fill="#8b95a7" font-size="10.5" text-anchor="middle">→ registryFromFamily</text>

  <!-- derivers container -->
  <rect x="300" y="46" width="400" height="330" rx="10" fill="#141925" stroke="#3d4a63" stroke-width="1.5"/>

  <rect x="316" y="62" width="368" height="52" rx="6" fill="#1a2130" stroke="#5b8def"/>
  <text x="500" y="83" fill="#9db4e8" font-size="12" font-weight="600" text-anchor="middle">foldCollection — stateless refold, its own flush</text>
  <text x="500" y="100" fill="#8b95a7" font-size="10.5" text-anchor="middle">every write seam arms it structurally; a throw crashes (sync in-tick)</text>

  <rect x="316" y="122" width="368" height="52" rx="6" fill="#1a2130" stroke="#5b8def"/>
  <text x="500" y="143" fill="#9db4e8" font-size="12" font-weight="600" text-anchor="middle">deriveCell — stateless map</text>
  <text x="500" y="160" fill="#8b95a7" font-size="10.5" text-anchor="middle">frame error: log · skip · continue (frames are independent)</text>

  <rect x="316" y="182" width="368" height="52" rx="6" fill="#1a2130" stroke="#5b8def"/>
  <text x="500" y="203" fill="#9db4e8" font-size="12" font-weight="600" text-anchor="middle">scanCell · scanStream — carried state</text>
  <text x="500" y="220" fill="#8b95a7" font-size="10.5" text-anchor="middle">seedable from a store; step error: log · STOP · hold last state</text>

  <rect x="316" y="242" width="368" height="52" rx="6" fill="#1a2130" stroke="#5b8def"/>
  <text x="500" y="263" fill="#9db4e8" font-size="12" font-weight="600" text-anchor="middle">pollCollection — diff → upsert changed · evict vanished</text>
  <text x="500" y="280" fill="#8b95a7" font-size="10.5" text-anchor="middle">the diff's equality IS the member's declared equals</text>

  <rect x="316" y="302" width="368" height="52" rx="6" fill="#1a2130" stroke="#5b8def"/>
  <text x="500" y="323" fill="#9db4e8" font-size="12" font-weight="600" text-anchor="middle">registryFromFamily — hold · reconcile · project</text>
  <text x="500" y="340" fill="#8b95a7" font-size="10.5" text-anchor="middle">one member's failure never freezes siblings</text>

  <text x="500" y="368" fill="#5b6678" font-size="10" text-anchor="middle" font-style="italic">every deriver: seed from truth · dedup at the target's spec equals · the framework's reconnect story</text>

  <!-- members -->
  <rect x="745" y="46" width="210" height="62" rx="8" fill="#1a2130" stroke="#e8b44c" stroke-width="1.5"/>
  <text x="850" y="70" fill="#e6eaf2" font-size="12" text-anchor="middle">derived cell</text>
  <text x="850" y="88" fill="#8b95a7" font-size="10.5" text-anchor="middle">store snapshot, then changes</text>

  <rect x="745" y="126" width="210" height="62" rx="8" fill="#1a2130" stroke="#e8b44c" stroke-width="1.5"/>
  <text x="850" y="150" fill="#e6eaf2" font-size="12" text-anchor="middle">scan stream</text>
  <text x="850" y="168" fill="#8b95a7" font-size="10.5" text-anchor="middle">snapshot(state), then deltas</text>

  <rect x="745" y="206" width="210" height="62" rx="8" fill="#1a2130" stroke="#e8b44c" stroke-width="1.5"/>
  <text x="850" y="230" fill="#e6eaf2" font-size="12" text-anchor="middle">collection</text>
  <text x="850" y="248" fill="#8b95a7" font-size="10.5" text-anchor="middle">per-key gets · coalesced deltas</text>

  <rect x="745" y="286" width="210" height="62" rx="8" fill="#1a2130" stroke="#e8b44c" stroke-width="1.5"/>
  <text x="850" y="310" fill="#e6eaf2" font-size="12" text-anchor="middle">MapRegistry</text>
  <text x="850" y="328" fill="#8b95a7" font-size="10.5" text-anchor="middle">consumed by serveSurfaceMap</text>

  <!-- arrows -->
  <line x1="255" y1="82" x2="298" y2="100" stroke="#8b95a7" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="255" y1="168" x2="298" y2="180" stroke="#8b95a7" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="255" y1="254" x2="298" y2="240" stroke="#8b95a7" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="255" y1="340" x2="298" y2="328" stroke="#8b95a7" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="700" y1="88" x2="743" y2="77" stroke="#8b95a7" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="700" y1="208" x2="743" y2="157" stroke="#8b95a7" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="700" y1="268" x2="743" y2="237" stroke="#8b95a7" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="700" y1="328" x2="743" y2="317" stroke="#8b95a7" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- boot-check gate -->
  <rect x="300" y="396" width="400" height="52" rx="8" fill="#1a2130" stroke="#e05252" stroke-width="1.5"/>
  <text x="500" y="417" fill="#e6eaf2" font-size="11.5" font-weight="600" text-anchor="middle">the boot checks — wiring-time, not runtime</text>
  <text x="500" y="435" fill="#8b95a7" font-size="10.5" text-anchor="middle">mutation verbs (incl. test__set) on a derived member rejected · declared-graph cycles = boot error</text>
  <line x1="500" y1="376" x2="500" y2="394" stroke="#e05252" stroke-width="1.2" marker-end="url(#arr)"/>

  <text x="490" y="464" fill="#5b6678" font-size="10.5" text-anchor="middle">a derived member is a DECLARATION — the framework owns the wiring, the seeding, the dedup, and the reconnect story</text>
</svg>
