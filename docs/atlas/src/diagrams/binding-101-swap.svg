<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" font-family="inherit" role="img" aria-label="What a host switch actually does: bump the pick epoch, warm the new host, retire the old binding (socket closed, sends throw a typed retired error), and every connectionScoped subscription tears down and re-keys onto the new binding"><defs><marker id="bx" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="currentColor" opacity="0.75"/></marker></defs><rect x="20" y="30" width="290" height="70" rx="9" fill="#a855f7" fill-opacity="0.11" stroke="#a855f7" stroke-width="1.5"/><text x="165.0" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">the pick (palette / 1008 fallback)</text><text x="165.0" y="67.0" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">switchHost(&quot;zest&quot;) — FIRST statement:</text><text x="165.0" y="80.5" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">myPick = ++pickEpoch (cancels any in-flight pick)</text><rect x="20" y="150" width="290" height="80" rx="9" fill="#c08a2d" fill-opacity="0.11" stroke="#c08a2d" stroke-width="1.5"/><text x="165.0" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">warm it server-side</text><text x="165.0" y="187.0" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">await hosts.add — ssh provision,</text><text x="165.0" y="200.5" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">can take SECONDS; after the await:</text><text x="165.0" y="214.0" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">if (myPick !== pickEpoch) return  ← superseded?</text><rect x="20" y="280" width="290" height="90" rx="9" fill="#d0454c" fill-opacity="0.11" stroke="#d0454c" stroke-width="1.5"/><text x="165.0" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">retire the OLD binding</text><text x="165.0" y="317.0" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">socket CLOSED · send stubbed to throw a</text><text x="165.0" y="330.5" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">TYPED &quot;retired by this client&quot; error</text><text x="165.0" y="344.0" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">(never the stale-restart lie) — a late call</text><text x="165.0" y="357.5" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">REJECTS instead of landing on the wrong host</text><rect x="390" y="150" width="270" height="90" rx="9" fill="#3b82f6" fill-opacity="0.11" stroke="#3b82f6" stroke-width="1.5"/><text x="525.0" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">activeBinding() flips</text><text x="525.0" y="187.0" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">the signal fires SYNCHRONOUSLY;</text><text x="525.0" y="200.5" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">cache holds ONE live binding —</text><text x="525.0" y="214.0" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">a retired entry is rebuilt on demand</text><rect x="390" y="300" width="270" height="100" rx="9" fill="#22a06b" fill-opacity="0.11" stroke="#22a06b" stroke-width="1.5"/><text x="525.0" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">every connectionScoped sub</text><text x="525.0" y="337.0" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">keyed root DISPOSED → abort reaches the</text><text x="525.0" y="350.5" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">sub (owner-tied dispose — the leak fix) →</text><text x="525.0" y="364.0" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">factory re-runs against the NEW binding;</text><text x="525.0" y="377.5" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">first value SYNCHRONOUS (render effect)</text><rect x="720" y="150" width="240" height="90" rx="9" fill="#22a06b" fill-opacity="0.11" stroke="#22a06b" stroke-width="1.5" stroke-dasharray="5 3"/><text x="840.0" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">the invariant</text><text x="840.0" y="187.0" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">A DISPOSED SUBSCRIPTION</text><text x="840.0" y="200.5" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">CANNOT REPORT ANYTHING</text><text x="840.0" y="214.0" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">— not an error, not a toast,</text><text x="840.0" y="227.5" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">not a stale value</text><rect x="720" y="300" width="240" height="100" rx="9" fill="#a855f7" fill-opacity="0.11" stroke="#a855f7" stroke-width="1.5"/><text x="840.0" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">what kolu still owns</text><text x="840.0" y="337.0" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">pure POLICY: which host, the picker,</text><text x="840.0" y="350.5" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">recents, sessionStorage, toasts.</text><text x="840.0" y="364.0" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">The machinery above is framework:</text><text x="840.0" y="377.5" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">createActiveConnectionManager +</text><text x="840.0" y="391.0" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.82">connectionScoped + createKeyedRoot</text><path d="M 165 100 L 165 150" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.8" marker-end="url(#bx)"/><text x="165.0" y="117.0" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.9">ok</text><path d="M 165 230 L 165 280" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.8" marker-end="url(#bx)"/><text x="165.0" y="247.0" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.9">commit (last pick wins)</text><path d="M 310 190 L 390 190" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.8" marker-end="url(#bx)"/><text x="350.0" y="182.0" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.9"></text><path d="M 310 320 L 390 330" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.8" marker-end="url(#bx)"/><text x="350.0" y="317.0" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.9">the swap propagates</text><path d="M 525 240 L 525 300" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.8" marker-end="url(#bx)"/><text x="525.0" y="262.0" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.9">re-key</text><path d="M 660 190 L 720 190" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.8" marker-end="url(#bx)" stroke-dasharray="4 3"/><text x="690.0" y="182.0" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.9"></text><path d="M 660 340 L 720 340" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.8" marker-end="url(#bx)" stroke-dasharray="4 3"/><text x="690.0" y="332.0" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.9">made structural by</text><text x="20" y="435" font-size="11" fill="currentColor" opacity="0.85"><tspan font-weight="700">The three bugs this design ate:</tspan> the yank (stale pick committing late — epoch) · the misroute (a call landing on the wrong host — typed retirement) · the toast leak (a never-disposed sub reporting a dead socket — owner-tied dispose).</text></svg>