<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="ui-sans-serif,system-ui" font-size="13">
  <defs>
    <marker id="fx-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
    </marker>
    <marker id="fx-arri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <text x="24" y="28" font-weight="700" fill="#1a1c20" font-size="15">One written focus fact — everything else is a fold of it</text>
  <text x="24" y="48" font-size="12" fill="#5b6470">Verbs are the only writers · derivations are pure reads · every surface reads a selector. No other store holds focus.</text>

  <!-- column headers -->
  <text x="24" y="84" font-size="11" fill="#5b6470" font-weight="700">VERBS — THE ONLY WRITERS</text>
  <text x="340" y="84" font-size="11" fill="#5b6470" font-weight="700">THE FACT, THEN ITS DERIVATIONS</text>
  <text x="680" y="84" font-size="11" fill="#5b6470" font-weight="700">CONSUMERS</text>

  <!-- verbs -->
  <rect x="24" y="94" width="250" height="118" rx="10" fill="#fef3e2" stroke="#b45309" stroke-width="1.4"/>
  <text x="40" y="118" font-weight="700" fill="#b45309">focusTerminal(id)</text>
  <text x="40" y="136" font-size="12" fill="#1a1c20">the ONE write — sets the fact,</text>
  <text x="40" y="152" font-size="12" fill="#1a1c20">expands the panel, remembers the tab</text>
  <text x="40" y="174" font-size="11" fill="#92600a">side effects live here, never in effects:</text>
  <text x="40" y="190" font-size="11" fill="#92600a">visit MRU · unread clear · setActive wire</text>

  <rect x="24" y="226" width="250" height="70" rx="10" fill="#fef3e2" stroke="#b45309" stroke-width="1.4"/>
  <text x="40" y="250" font-weight="700" fill="#b45309">collapsePanel(parent)</text>
  <text x="40" y="268" font-size="12" fill="#1a1c20">child held focus → refocus parent</text>
  <text x="40" y="284" font-size="11" fill="#92600a">invariants kept at the write site</text>

  <line x1="274" y1="150" x2="338" y2="136" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#fx-arri)"/>
  <line x1="274" y1="258" x2="338" y2="160" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#fx-arri)"/>

  <!-- the fact -->
  <rect x="340" y="94" width="300" height="84" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="356" y="120" font-weight="700" fill="#4f46e5" font-size="14">focusedTerminalId</text>
  <text x="356" y="140" font-size="12" fill="#1a1c20">TerminalId | null · per host · createSignal</text>
  <text x="356" y="158" font-size="12" fill="#1a1c20">split or top-level — one id space</text>

  <line x1="490" y1="178" x2="490" y2="208" stroke="#0b6478" stroke-width="1.5" marker-end="url(#fx-arr)"/>

  <!-- derivations -->
  <rect x="340" y="210" width="300" height="72" rx="10" fill="#e8f1f8" stroke="#0b6478" stroke-width="1.4"/>
  <text x="356" y="234" font-weight="700" fill="#0b6478">activeTileId = topLevelOf(focused)</text>
  <text x="356" y="252" font-size="12" fill="#1a1c20">createMemo over parentId — re-parenting</text>
  <text x="356" y="268" font-size="12" fill="#1a1c20">corrects the tile reactively, for free</text>

  <line x1="490" y1="282" x2="490" y2="300" stroke="#0b6478" stroke-width="1.5" marker-end="url(#fx-arr)"/>

  <rect x="340" y="302" width="300" height="56" rx="10" fill="#e8f1f8" stroke="#0b6478" stroke-width="1.4"/>
  <text x="356" y="326" font-weight="700" fill="#0b6478">isFocused · isActiveTile</text>
  <text x="356" y="344" font-size="12" fill="#1a1c20">createSelector — O(2) row updates, not O(n)</text>

  <line x1="490" y1="358" x2="490" y2="376" stroke="#0b6478" stroke-width="1.5" marker-end="url(#fx-arr)"/>

  <rect x="340" y="378" width="300" height="56" rx="10" fill="#e8f1f8" stroke="#0b6478" stroke-width="1.4"/>
  <text x="356" y="402" font-weight="700" fill="#0b6478">livePane · shouldFocusMain/Sub</text>
  <text x="356" y="420" font-size="12" fill="#1a1c20">TerminalContent: comparisons, no store</text>

  <!-- one reads-arrow into consumers -->
  <line x1="648" y1="264" x2="676" y2="264" stroke="#5b6470" stroke-width="1.5" marker-end="url(#fx-arr)"/>
  <text x="662" y="252" font-size="10" fill="#5b6470" text-anchor="middle">reads</text>

  <!-- consumers -->
  <rect x="680" y="94" width="276" height="108" rx="10" fill="#f0f1f3" stroke="#5b6470" stroke-width="1.2"/>
  <text x="696" y="118" font-weight="700" fill="#374151">dockRowAttrs → [data-dock-row]</text>
  <text x="696" y="136" font-size="12" fill="#1a1c20">parent row lights: isActiveTile(id)</text>
  <text x="696" y="152" font-size="12" fill="#1a1c20">sub-entry lights: isFocused(id)</text>
  <text x="696" y="168" font-size="12" fill="#1a1c20">nested focus lights BOTH — by definition</text>
  <text x="696" y="188" font-size="11" fill="#5b6470">CSS keys the shared hook, no variants</text>

  <rect x="680" y="218" width="276" height="56" rx="10" fill="#f0f1f3" stroke="#5b6470" stroke-width="1.2"/>
  <text x="696" y="242" font-weight="700" fill="#374151">xterm focus effect</text>
  <text x="696" y="260" font-size="12" fill="#1a1c20">props.focused · refocusNonce kept</text>

  <rect x="680" y="290" width="276" height="56" rx="10" fill="#f0f1f3" stroke="#5b6470" stroke-width="1.2"/>
  <text x="696" y="314" font-weight="700" fill="#374151">wire: chrome.setActive(tile)</text>
  <text x="696" y="332" font-size="12" fill="#1a1c20">unchanged — a split is never persisted</text>

  <rect x="680" y="376" width="276" height="104" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="696" y="400" font-weight="700" fill="#b91c1c">DELETED</text>
  <text x="696" y="420" font-size="12" fill="#7f1d1d">focusTarget "main" | "sub"</text>
  <text x="696" y="438" font-size="12" fill="#7f1d1d">seeding getSubPanel — a read that writes</text>
  <text x="696" y="456" font-size="12" fill="#7f1d1d">the four-step landing walk</text>
</svg>
