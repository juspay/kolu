<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="ui-sans-serif,system-ui,sans-serif">
  <defs>
    <marker id="lfB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3a6ea5"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="12" font-weight="700" fill="#5b6470" letter-spacing=".07em">THE DOOR LIVES EXACTLY AS LONG AS ITS PROCESS</text>

  <!-- birth -->
  <rect x="30" y="56" width="250" height="140" rx="12" fill="#e3f4e9" stroke="#1b7a3a" stroke-width="1.5"/>
  <text x="48" y="82" font-size="13" font-weight="700" fill="#1b7a3a">birth</text>
  <text x="48" y="106" font-size="11.5" fill="#1a1c20">kolu spawns the ssh child…</text>
  <text x="48" y="126" font-size="11.5" fill="#1a1c20">…and waits for one line back:</text>
  <rect x="48" y="138" width="214" height="26" rx="6" fill="#1a1c20"/>
  <text x="60" y="156" font-size="11" font-family="ui-monospace,monospace" fill="#8ecf6e">PORT-FORWARD-READY</text>
  <text x="48" y="184" font-size="10.5" fill="#54785f">only then is the chip marked forwarded</text>

  <!-- life -->
  <rect x="310" y="56" width="250" height="140" rx="12" fill="#eaf1f8" stroke="#3a6ea5" stroke-width="1.5"/>
  <text x="328" y="82" font-size="13" font-weight="700" fill="#3a6ea5">life</text>
  <text x="328" y="106" font-size="11.5" fill="#1a1c20">the remote <tspan font-family="ui-monospace,monospace">cat</tspan> just… waits.</text>
  <text x="328" y="126" font-size="11.5" fill="#1a1c20">It reads input that never comes,</text>
  <text x="328" y="146" font-size="11.5" fill="#1a1c20">holding the connection open —</text>
  <text x="328" y="166" font-size="11.5" fill="#1a1c20">and the door with it.</text>
  <text x="328" y="186" font-size="10.5" fill="#5b7ea5">no timers, no keep-alive code in kolu</text>

  <!-- death -->
  <rect x="590" y="56" width="240" height="140" rx="12" fill="#fbeadd" stroke="#c2611b" stroke-width="1.5"/>
  <text x="608" y="82" font-size="13" font-weight="700" fill="#c2611b">death — any of these</text>
  <text x="608" y="106" font-size="11.5" fill="#1a1c20">you click ⨯ → kolu kills the child</text>
  <text x="608" y="126" font-size="11.5" fill="#1a1c20">the dev server stops → auto-cancel</text>
  <text x="608" y="146" font-size="11.5" fill="#1a1c20">kolu itself dies → the pipe snaps,</text>
  <text x="608" y="163" font-size="11.5" fill="#1a1c20">ssh exits on its own</text>

  <!-- convergence -->
  <line x1="155" y1="196" x2="390" y2="252" stroke="#3a6ea5" stroke-width="1.6" marker-end="url(#lfB)"/>
  <line x1="435" y1="196" x2="430" y2="248" stroke="#3a6ea5" stroke-width="1.6" marker-end="url(#lfB)"/>
  <line x1="710" y1="196" x2="475" y2="252" stroke="#3a6ea5" stroke-width="1.6" marker-end="url(#lfB)"/>

  <rect x="250" y="256" width="360" height="66" rx="12" fill="#faf8f2" stroke="#ddd6c4"/>
  <text x="430" y="284" font-size="13" font-weight="700" fill="#1a1c20" text-anchor="middle">the moment the process ends,</text>
  <text x="430" y="304" font-size="13" fill="#1a1c20" text-anchor="middle">the kernel closes its listener — instantly</text>

  <text x="430" y="356" font-size="11.5" fill="#8a8574" text-anchor="middle">There is nothing to clean up and nothing that can be forgotten:</text>
  <text x="430" y="374" font-size="11.5" fill="#8a8574" text-anchor="middle">a door cannot outlive its owner, because the door IS the owner's open socket.</text>

  <text x="430" y="412" font-size="10.5" fill="#b3a68a" text-anchor="middle">This is why quitting kolu never leaves ports mapped — a shared-master orphan is unspellable here.</text>
</svg>
