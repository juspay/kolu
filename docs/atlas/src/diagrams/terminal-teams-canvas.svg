<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="system-ui, sans-serif">
  <rect width="920" height="430" fill="#0f1117"/>
  <text x="30" y="34" fill="#8b95a7" font-size="13" font-weight="600">THE CANVAS — one task, one visible team</text>

  <!-- relation edges (under tiles) -->
  <g stroke="#3d4a63" stroke-width="2" fill="none">
    <path d="M330 190 C 430 120, 480 110, 560 120"/>
    <path d="M330 220 C 440 240, 490 245, 560 240"/>
    <path d="M330 250 C 430 330, 480 340, 560 345"/>
  </g>
  <g fill="#8b95a7" font-size="10">
    <text x="435" y="118">delegates: implement</text>
    <text x="440" y="228">consults: architecture</text>
    <text x="437" y="326">reviews: electricity</text>
  </g>

  <!-- orchestrator tile -->
  <rect x="60" y="140" width="270" height="160" rx="10" fill="#141925" stroke="#e8b44c" stroke-width="2"/>
  <rect x="60" y="140" width="270" height="30" rx="10" fill="#1a2130"/>
  <text x="75" y="160" fill="#f0d49b" font-size="13" font-weight="600">orchestrator · RT-main</text>
  <text x="75" y="192" fill="#c8d0de" font-size="11">holds the plan of record,</text>
  <text x="75" y="208" fill="#c8d0de" font-size="11">dispatches briefs, verifies at the</text>
  <text x="75" y="224" fill="#c8d0de" font-size="11">tree, rules on consults</text>
  <text x="75" y="252" fill="#8b95a7" font-size="10.5">goal: W7 shipped · may not stop</text>
  <text x="75" y="266" fill="#8b95a7" font-size="10.5">without report (stop-hook)</text>

  <!-- teammate tiles -->
  <g>
    <rect x="560" y="70" width="240" height="96" rx="10" fill="#141925" stroke="#2dd4a7" stroke-width="1.5"/>
    <rect x="560" y="70" width="240" height="26" rx="10" fill="#1a2130"/>
    <text x="574" y="88" fill="#7fe3c3" font-size="12" font-weight="600">implementor · worktree W7</text>
    <text x="574" y="112" fill="#c8d0de" font-size="10.5">builds test-first on its branch;</text>
    <text x="574" y="126" fill="#c8d0de" font-size="10.5">reports at stage boundaries</text>
    <text x="574" y="148" fill="#8b95a7" font-size="10">state: working · 3/8 stages</text>

    <rect x="560" y="196" width="240" height="90" rx="10" fill="#141925" stroke="#5b8def" stroke-width="1.5"/>
    <rect x="560" y="196" width="240" height="26" rx="10" fill="#1a2130"/>
    <text x="574" y="214" fill="#9db4e8" font-size="12" font-weight="600">architect · read-only</text>
    <text x="574" y="238" fill="#c8d0de" font-size="10.5">answers design consults with</text>
    <text x="574" y="252" fill="#c8d0de" font-size="10.5">/architecture-first-principles</text>
    <text x="574" y="274" fill="#8b95a7" font-size="10">state: idle · awaiting consult</text>

    <rect x="560" y="316" width="240" height="90" rx="10" fill="#141925" stroke="#c07ae8" stroke-width="1.5"/>
    <rect x="560" y="316" width="240" height="26" rx="10" fill="#1a2130"/>
    <text x="574" y="334" fill="#dbb8f0" font-size="12" font-weight="600">watchguard · lowy lens</text>
    <text x="574" y="358" fill="#c8d0de" font-size="10.5">reviews each push for boundary</text>
    <text x="574" y="372" fill="#c8d0de" font-size="10.5">violations; red-flags to orchestrator</text>
    <text x="574" y="394" fill="#8b95a7" font-size="10">state: watching pushes</text>
  </g>

  <!-- caption strip -->
  <rect x="60" y="330" width="270" height="76" rx="8" fill="#141925" stroke="#3d4a63"/>
  <text x="75" y="352" fill="#c8d0de" font-size="11">Edges are RELATIONS — typed, on the</text>
  <text x="75" y="368" fill="#c8d0de" font-size="11">wire, persisted — generalizing today's</text>
  <text x="75" y="384" fill="#c8d0de" font-size="11">sub-terminal parentId.</text>
</svg>
