<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="inherit" role="img" aria-label="The surface framework hosting side: kolu one-bound-host story on top, drishti fleet story below, shared framework packages in the middle"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="currentColor" opacity="0.7"/></marker></defs><text x="28" y="34" font-size="10" letter-spacing="1.5" fill="currentColor" opacity="0.6" style="text-transform:uppercase">kolu — one canvas, bound to ONE host at a time</text><rect x="28" y="48" width="150" height="86" rx="8" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1.4"/><text x="103.0" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">browser tab</text><text x="103.0" y="82" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">the canvas UI</text><text x="103.0" y="95" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">.use() hooks (Solid)</text><text x="103.0" y="108" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">ONE websocket</text><rect x="258" y="48" width="240" height="86" rx="8" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1.4"/><text x="378.0" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">kolu-server</text><text x="378.0" y="82" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">reServeSurface = mirror + serve</text><text x="378.0" y="95" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">holds a live COPY of padiSurface</text><text x="378.0" y="108" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">forwards writes upstream</text><rect x="578" y="48" width="180" height="86" rx="8" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1.4"/><text x="668.0" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">padi  (on the host)</text><text x="668.0" y="82" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">owns the terminal workspace</text><text x="668.0" y="95" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">serves padiSurface</text><text x="668.0" y="108" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">+ the frozen control core</text><rect x="818" y="48" width="114" height="86" rx="8" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1.4"/><text x="875.0" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">kaval</text><text x="875.0" y="82" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">the PTYs</text><text x="875.0" y="95" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">(your shells</text><text x="875.0" y="108" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">live here)</text><path d="M 178 91 L 250 91" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.7" marker-end="url(#ar)"/><text x="218.0" y="85.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.75">one socket</text><path d="M 498 91 L 570 91" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.7" marker-end="url(#ar)"/><text x="538.0" y="85.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.75">a session dials it</text><path d="M 758 91 L 810 91" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.7" marker-end="url(#ar)"/><rect x="258" y="158" width="240" height="92" rx="8" fill="#c08a2d" fill-opacity="0.1" stroke="#c08a2d" stroke-width="1.4"/><text x="378.0" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">the session (BoundPadi role)</text><text x="378.0" y="192" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">&quot;can hand me a live client +</text><text x="378.0" y="205" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">tell me connection state&quot;</text><text x="378.0" y="218" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">local arm: unix socket</text><text x="378.0" y="231" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">remote arm: wraps HostSession (ssh)</text><path d="M 378 158 L 370 134" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.7" marker-end="url(#ar)"/><text x="28" y="296" font-size="10" letter-spacing="1.5" fill="currentColor" opacity="0.6" style="text-transform:uppercase">the shared framework (the electricity — both apps run on it)</text><rect x="28" y="308" width="286" height="72" rx="8" fill="#22a06b" fill-opacity="0.1" stroke="#22a06b" stroke-width="1.4"/><text x="171.0" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">@kolu/surface</text><text x="171.0" y="342" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">the contract + serve + mirror</text><text x="171.0" y="355" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">cells · collections · procedures · streams</text><rect x="334" y="308" width="286" height="72" rx="8" fill="#22a06b" fill-opacity="0.1" stroke="#22a06b" stroke-width="1.4"/><text x="477.0" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">@kolu/surface-app</text><text x="477.0" y="342" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">Solid hooks over a client</text><text x="477.0" y="355" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">(today: ONE static client per app)</text><rect x="640" y="308" width="292" height="72" rx="8" fill="#22a06b" fill-opacity="0.1" stroke="#22a06b" stroke-width="1.4"/><text x="786.0" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">@kolu/surface-nix-host</text><text x="786.0" y="342" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">HostSession (ssh+Nix, a CLASS)</text><text x="786.0" y="355" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">reServeSurface · buildHostRegistry</text><text x="28" y="424" font-size="10" letter-spacing="1.5" fill="currentColor" opacity="0.6" style="text-transform:uppercase">drishti — a FLEET: many hosts at once (the second consumer)</text><rect x="28" y="436" width="150" height="80" rx="8" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-width="1.4"/><text x="103.0" y="454" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">drishti web</text><text x="103.0" y="470" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">fleet dashboard</text><text x="103.0" y="483" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">?host=zest picks</text><text x="103.0" y="496" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">which machine</text><rect x="258" y="436" width="240" height="80" rx="8" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-width="1.4"/><text x="378.0" y="454" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">buildHostRegistry</text><text x="378.0" y="470" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">Map: host → { session · handler }</text><text x="378.0" y="483" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">dispatches each socket by ?host=</text><text x="378.0" y="496" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">add / remove / reconnect (fleet)</text><rect x="578" y="436" width="160" height="80" rx="8" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-width="1.4"/><text x="658.0" y="454" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">HostSession × N</text><text x="658.0" y="470" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">one per machine</text><text x="658.0" y="483" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">provision + ssh</text><text x="658.0" y="496" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">reconnect · give-up</text><rect x="798" y="436" width="134" height="80" rx="8" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-width="1.4"/><text x="865.0" y="454" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">agents @ hosts</text><text x="865.0" y="470" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">remote daemons</text><text x="865.0" y="483" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">mirrored home</text><path d="M 178 476 L 250 476" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.7" marker-end="url(#ar)"/><text x="218.0" y="470.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.75">?host=</text><path d="M 498 476 L 570 476" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.7" marker-end="url(#ar)"/><text x="538.0" y="470.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.75">session per host</text><path d="M 738 476 L 790 476" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.7" marker-end="url(#ar)"/><text x="768.0" y="470.0" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.75">ssh</text><path d="M 378 308 L 370 254" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.7" marker-end="url(#ar)" stroke-dasharray="4 3"/><path d="M 378 436 L 370 384" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.7" marker-end="url(#ar)" stroke-dasharray="4 3"/><text x="392" y="278" font-size="9" fill="currentColor" opacity="0.6">both stories are built from these parts</text></svg>