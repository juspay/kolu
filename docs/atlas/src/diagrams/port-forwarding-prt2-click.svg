<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" font-family="ui-sans-serif,system-ui,sans-serif">
  <defs>
    <marker id="p2B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3a6ea5"/>
    </marker>
    <marker id="p2G" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b7a3a"/>
    </marker>
    <marker id="p2O" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2611b"/>
    </marker>
    <marker id="p2P" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6d4fa3"/>
    </marker>
  </defs>

  <!-- ══════ Viewer ══════ -->
  <rect x="20" y="40" width="300" height="400" rx="12" fill="#faf8f2" stroke="#ddd6c4"/>
  <text x="38" y="64" font-size="12" font-weight="700" fill="#5b6470" letter-spacing=".07em">VIEWER — zest</text>

  <rect x="40" y="82" width="260" height="96" rx="8" fill="#e3f4e9" stroke="#1b7a3a" stroke-width="1.5"/>
  <text x="56" y="103" font-size="13" font-weight="700" fill="#1b7a3a">Inspector chip (PRT1)</text>
  <text x="56" y="125" font-size="12" font-family="ui-monospace,monospace" fill="#1a1c20">8124 node   ⤴ open</text>
  <text x="56" y="145" font-size="12" font-family="ui-monospace,monospace" fill="#1a1c20">5173 vite   ⤴ open</text>
  <text x="56" y="165" font-size="11" fill="#54785f">every chip now opens — that is PRT2</text>

  <rect x="40" y="330" width="260" height="66" rx="8" fill="#ffffff" stroke="#c9c2b0"/>
  <text x="56" y="352" font-size="13" font-weight="700" fill="#1a1c20">new tab</text>
  <text x="56" y="372" font-size="12" font-family="ui-monospace,monospace" fill="#6d4fa3">http://pureintent:8124</text>
  <text x="56" y="388" font-size="10.5" fill="#8a8574">location.hostname, never "localhost"</text>

  <line x1="170" y1="178" x2="170" y2="326" stroke="#1b7a3a" stroke-width="1.6" marker-end="url(#p2G)"/>
  <text x="182" y="250" font-size="11" fill="#54785f">click → create → open</text>

  <!-- ══════ Kolu server host ══════ -->
  <rect x="360" y="40" width="440" height="440" rx="12" fill="#faf8f2" stroke="#ddd6c4"/>
  <text x="378" y="64" font-size="12" font-weight="700" fill="#5b6470" letter-spacing=".07em">KOLU SERVER HOST — pureintent</text>

  <rect x="380" y="82" width="400" height="64" rx="8" fill="#fbeadd" stroke="#c2611b" stroke-width="1.5"/>
  <text x="396" y="103" font-size="13" font-weight="700" fill="#c2611b">kolu server embeds @kolu/port-forward · new (PRT2)</text>
  <text x="396" y="122" font-size="11.5" fill="#1a1c20">forwards = a cell on the existing surface · lazy on click</text>
  <text x="396" y="138" font-size="11" fill="#8a5b34">⌘K "Forward a port…" · host-tab ⇄ badge · Forwarded Ports lists</text>

  <!-- two mechanisms -->
  <rect x="380" y="180" width="190" height="96" rx="8" fill="#efe9f8" stroke="#6d4fa3" stroke-width="1.5"/>
  <text x="394" y="201" font-size="12.5" font-weight="700" fill="#6d4fa3">case 1 — TCP relay</text>
  <text x="394" y="221" font-size="11" font-family="ui-monospace,monospace" fill="#1a1c20">0.0.0.0:8124</text>
  <text x="394" y="237" font-size="11" font-family="ui-monospace,monospace" fill="#1a1c20">  → 127.0.0.1:8124</text>
  <text x="394" y="256" font-size="10.5" fill="#7a6b93">in-process; for THIS host's</text>
  <text x="394" y="269" font-size="10.5" fill="#7a6b93">loopback-bound servers</text>

  <rect x="590" y="180" width="190" height="96" rx="8" fill="#efe9f8" stroke="#6d4fa3" stroke-width="1.5"/>
  <text x="604" y="201" font-size="12.5" font-weight="700" fill="#6d4fa3">case 2 — ssh child</text>
  <text x="604" y="221" font-size="11" font-family="ui-monospace,monospace" fill="#1a1c20">ssh -L *:5173:</text>
  <text x="604" y="237" font-size="11" font-family="ui-monospace,monospace" fill="#1a1c20">  127.0.0.1:5173 box</text>
  <text x="604" y="256" font-size="10.5" fill="#7a6b93">ONE child per forward;</text>
  <text x="604" y="269" font-size="10.5" fill="#7a6b93">ControlPath=none</text>

  <line x1="500" y1="146" x2="470" y2="176" stroke="#c2611b" stroke-width="1.6" marker-end="url(#p2O)"/>
  <line x1="660" y1="146" x2="680" y2="176" stroke="#c2611b" stroke-width="1.6" marker-end="url(#p2O)"/>

  <!-- lifecycle strip -->
  <rect x="380" y="310" width="400" height="88" rx="8" fill="#eaf1f8" stroke="#3a6ea5" stroke-width="1.5"/>
  <text x="396" y="331" font-size="12.5" font-weight="700" fill="#3a6ea5">a forward lives exactly as long as its owner</text>
  <text x="396" y="351" font-size="11.5" fill="#1a1c20">cancel row → kill(child) · close relay</text>
  <text x="396" y="369" font-size="11.5" fill="#1a1c20">scanner sees the port die → auto-cancel (auto forwards only)</text>
  <text x="396" y="387" font-size="11.5" fill="#1a1c20">kolu killed → kernel closes every listener, instantly</text>

  <rect x="380" y="424" width="400" height="40" rx="8" fill="#e3f4e9" stroke="#1b7a3a"/>
  <text x="396" y="448" font-size="11.5" fill="#1b7a3a">padi port sensor (PRT1) — the death signal auto-cancel rides</text>
  <line x1="580" y1="424" x2="580" y2="402" stroke="#3a6ea5" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#p2B)"/>

  <!-- traffic: browser → listener → mechanisms -->
  <line x1="300" y1="360" x2="376" y2="240" stroke="#6d4fa3" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#p2P)"/>
  <text x="290" y="300" font-size="10.5" fill="#7a6b93">HTTP</text>

  <!-- ══════ Remote host ══════ -->
  <rect x="840" y="40" width="320" height="400" rx="12" fill="#faf8f2" stroke="#ddd6c4"/>
  <text x="858" y="64" font-size="12" font-weight="700" fill="#5b6470" letter-spacing=".07em">REMOTE HOST — e.g. kolu-bot</text>

  <rect x="860" y="82" width="280" height="56" rx="8" fill="#ffffff" stroke="#c9c2b0"/>
  <text x="876" y="104" font-size="13" font-weight="700" fill="#1a1c20">sshd</text>
  <text x="876" y="122" font-size="11" fill="#8a8574">the tunnel's far end</text>

  <rect x="860" y="180" width="280" height="76" rx="8" fill="#ffffff" stroke="#c9c2b0"/>
  <text x="876" y="202" font-size="13" font-weight="700" fill="#1a1c20">dev server</text>
  <text x="876" y="222" font-size="12" font-family="ui-monospace,monospace" fill="#6d4fa3">127.0.0.1:5173</text>
  <text x="876" y="240" font-size="10.5" fill="#8a8574">loopback — unreachable from anywhere, until now</text>

  <line x1="780" y1="220" x2="856" y2="110" stroke="#6d4fa3" stroke-width="1.8" marker-end="url(#p2P)"/>
  <text x="790" y="150" font-size="10.5" fill="#7a6b93">encrypted</text>
  <line x1="1000" y1="138" x2="1000" y2="176" stroke="#6d4fa3" stroke-width="1.8" marker-end="url(#p2P)"/>
  <text x="1012" y="160" font-size="10.5" fill="#7a6b93">local hop</text>

  <!-- ══════ Legend ══════ -->
  <rect x="240" y="492" width="14" height="14" rx="3" fill="#e3f4e9" stroke="#1b7a3a"/>
  <text x="262" y="503" font-size="12" fill="#1a1c20">shipped (PRT1)</text>
  <rect x="420" y="492" width="14" height="14" rx="3" fill="#fbeadd" stroke="#c2611b"/>
  <text x="442" y="503" font-size="12" fill="#1a1c20">new in PRT2</text>
  <rect x="580" y="492" width="14" height="14" rx="3" fill="#efe9f8" stroke="#6d4fa3"/>
  <text x="602" y="503" font-size="12" fill="#1a1c20">@kolu/port-forward mechanisms (shipped in PRT0)</text>
</svg>
