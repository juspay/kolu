<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="880" height="430" rx="12" fill="#f6f4ee"/>
  <text x="440" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#3a3f52">any user's machine — the whole loop, five minutes after cloning</text>

  <!-- human -->
  <rect x="40" y="64" width="180" height="58" rx="9" fill="#fffdf6" stroke="#b9b09a" stroke-width="1.8"/>
  <text x="130" y="89" text-anchor="middle" font-size="13" font-weight="700" fill="#3a3f52">the human</text>
  <text x="130" y="108" text-anchor="middle" font-size="10.5" fill="#5c5334">rules on forks · merges</text>

  <!-- coordinator -->
  <rect x="290" y="64" width="270" height="106" rx="9" fill="#eef0fb" stroke="#6a58c9" stroke-width="2.2"/>
  <text x="425" y="90" text-anchor="middle" font-size="13.5" font-weight="800" fill="#4a3d99">coordinator agent</text>
  <text x="425" y="110" text-anchor="middle" font-size="11" fill="#544a86">a kolu terminal running /orchestrator</text>
  <text x="425" y="128" text-anchor="middle" font-size="11" fill="#544a86">briefs · goals · gates · venue rulings</text>
  <text x="425" y="150" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6a58c9">dashboard in the Code tab ▸ live board</text>

  <!-- lanes -->
  <rect x="630" y="64" width="210" height="106" rx="9" fill="#fdf0e6" stroke="#c2762c" stroke-width="2"/>
  <text x="735" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4d12">lane agents</text>
  <text x="735" y="110" text-anchor="middle" font-size="10.5" fill="#7a5a34">one terminal + worktree each</text>
  <text x="735" y="128" text-anchor="middle" font-size="10.5" fill="#7a5a34">/be → gauntlet → CI → PR</text>
  <text x="735" y="148" text-anchor="middle" font-size="10.5" fill="#7a5a34">questions = files, never dialogs</text>

  <!-- the portable interface bar -->
  <rect x="120" y="222" width="640" height="52" rx="9" fill="#eaf6ee" stroke="#2f9e63" stroke-width="2.4"/>
  <text x="440" y="245" text-anchor="middle" font-size="13.5" font-weight="800" fill="#186a41">kolu mcp — the portable seam (kolu-cli PR2)</text>
  <text x="440" y="264" text-anchor="middle" font-size="10.5" fill="#2c5c42">terminals · urgency · screen.text · create/kill/sendInput(keys) · wait.outputSettled / wait.agentState</text>

  <!-- kolu product -->
  <rect x="220" y="316" width="440" height="80" rx="9" fill="#fffdf6" stroke="#b9b09a" stroke-width="1.8"/>
  <text x="440" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#3a3f52">kolu the product (installed, not the repo)</text>
  <text x="440" y="362" text-anchor="middle" font-size="10.5" fill="#5c5334">padi + kaval daemons · canvas · Code tab · deep links</text>
  <text x="440" y="380" text-anchor="middle" font-size="10.5" fill="#5c5334">kaval-tui / padi-tui = the CLI fallback when MCP is absent</text>

  <defs><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4a5568"/></marker></defs>
  <line x1="220" y1="93" x2="290" y2="93" stroke="#4a5568" stroke-width="1.8" marker-end="url(#b)"/>
  <line x1="560" y1="110" x2="630" y2="110" stroke="#4a5568" stroke-width="1.8" marker-end="url(#b)"/>
  <text x="595" y="100" text-anchor="middle" font-size="10" fill="#4a5568">dispatch</text>
  <line x1="425" y1="170" x2="425" y2="222" stroke="#2f9e63" stroke-width="2" marker-end="url(#b)"/>
  <line x1="735" y1="170" x2="640" y2="222" stroke="#2f9e63" stroke-width="2" marker-end="url(#b)"/>
  <line x1="440" y1="274" x2="440" y2="316" stroke="#2f9e63" stroke-width="2" marker-end="url(#b)"/>
</svg>
