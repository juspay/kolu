<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" font-family="ui-sans-serif,system-ui,sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3a6ea5"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2611b"/>
    </marker>
  </defs>

  <!-- ══════════ Remote host panel ══════════ -->
  <rect x="20" y="40" width="430" height="380" rx="12" fill="#faf8f2" stroke="#ddd6c4"/>
  <text x="40" y="66" font-size="13" font-weight="700" fill="#5b6470" letter-spacing=".08em">REMOTE HOST — THE PADI THAT OWNS THE TERMINAL</text>

  <!-- shell subtree -->
  <rect x="45" y="82" width="190" height="108" rx="8" fill="#ffffff" stroke="#c9c2b0"/>
  <text x="60" y="103" font-size="12" font-family="ui-monospace,monospace" fill="#1a1c20" font-weight="700">fish        27872</text>
  <text x="60" y="123" font-size="12" font-family="ui-monospace,monospace" fill="#1a1c20">├─ node     30588</text>
  <text x="60" y="143" font-size="12" font-family="ui-monospace,monospace" fill="#c2611b" font-weight="700">│   listens :5173</text>
  <text x="60" y="163" font-size="12" font-family="ui-monospace,monospace" fill="#1a1c20">└─ workerd  30596</text>
  <text x="60" y="181" font-size="11" fill="#8a8574">the shell's process subtree</text>

  <!-- scanner (new PT1) -->
  <rect x="45" y="222" width="380" height="72" rx="8" fill="#e3f4e9" stroke="#1b7a3a" stroke-width="1.5"/>
  <text x="62" y="243" font-size="13" font-weight="700" fill="#1b7a3a">kaval processScan · new (PT1)</text>
  <text x="62" y="262" font-size="12" fill="#1a1c20">one pass / 5 s — /proc walk (linux) · ps + lsof (darwin)</text>
  <text x="62" y="280" font-size="12" fill="#1a1c20">subtree + socket-inode join → {processes, ports} per PTY</text>

  <!-- snapshot -->
  <rect x="45" y="326" width="380" height="62" rx="8" fill="#eaf1f8" stroke="#3a6ea5" stroke-width="1.5"/>
  <text x="62" y="348" font-size="13" font-weight="700" fill="#3a6ea5">padi TerminalSnapshot — exists</text>
  <text x="62" y="368" font-size="12" fill="#1b7a3a" font-family="ui-monospace,monospace" font-weight="700">+ processes · + ports  (new fields)</text>

  <line x1="140" y1="190" x2="140" y2="218" stroke="#1b7a3a" stroke-width="1.6" marker-end="url(#arrG)"/>
  <line x1="140" y1="294" x2="140" y2="322" stroke="#1b7a3a" stroke-width="1.6" marker-end="url(#arrG)"/>

  <!-- ══════════ Local panel ══════════ -->
  <rect x="700" y="40" width="460" height="380" rx="12" fill="#faf8f2" stroke="#ddd6c4"/>
  <text x="720" y="66" font-size="13" font-weight="700" fill="#5b6470" letter-spacing=".08em">LOCAL MACHINE — KOLU SERVER + BROWSER</text>

  <!-- browser tab -->
  <rect x="725" y="96" width="410" height="52" rx="8" fill="#ffffff" stroke="#c9c2b0"/>
  <text x="742" y="117" font-size="13" font-weight="700" fill="#1a1c20">browser tab</text>
  <text x="742" y="136" font-size="12" font-family="ui-monospace,monospace" fill="#c2611b">http://localhost:61000</text>

  <!-- inspector (new PT1) -->
  <rect x="725" y="192" width="410" height="106" rx="8" fill="#e3f4e9" stroke="#1b7a3a" stroke-width="1.5"/>
  <text x="742" y="213" font-size="13" font-weight="700" fill="#1b7a3a">Inspector — Ports &amp; Processes · new (PT1 · PT2)</text>
  <text x="742" y="234" font-size="12" font-family="ui-monospace,monospace" fill="#1a1c20">PORTS      5173 node  ⤴ open · ⇄ :61000 · ⨯</text>
  <text x="742" y="254" font-size="12" font-family="ui-monospace,monospace" fill="#1a1c20">           61922 workerd  ⤴</text>
  <text x="742" y="274" font-size="12" font-family="ui-monospace,monospace" fill="#1a1c20">PROCESSES  node 30588 · workerd 30596 · kill ⨯</text>
  <text x="742" y="291" font-size="11" fill="#54785f">reconcile-backed store — leaf ticks only</text>

  <!-- server box -->
  <rect x="725" y="332" width="410" height="64" rx="8" fill="#eaf1f8" stroke="#3a6ea5" stroke-width="1.5"/>
  <text x="742" y="354" font-size="13" font-weight="700" fill="#3a6ea5">kolu server surface — exists</text>
  <text x="742" y="374" font-size="12" fill="#c2611b" font-weight="700">forward manager (surface-remote) · new (PT2): 61000 ⇄ 5173</text>

  <!-- local arrows -->
  <line x1="810" y1="332" x2="810" y2="302" stroke="#3a6ea5" stroke-width="1.6" marker-end="url(#arrB)"/>
  <line x1="1020" y1="298" x2="1020" y2="328" stroke="#c2611b" stroke-width="1.6" marker-end="url(#arrO)"/>
  <text x="1032" y="318" font-size="11" fill="#8a5b34">click → create / cancel</text>
  <line x1="900" y1="192" x2="900" y2="152" stroke="#1b7a3a" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="912" y="172" font-size="11" fill="#54785f">window.open</text>

  <!-- ══════════ Lanes between panels ══════════ -->
  <!-- traffic lane (PT2) -->
  <text x="575" y="106" font-size="11.5" text-anchor="middle" font-family="ui-monospace,monospace" fill="#8a5b34">ssh -O forward -L 61000:127.0.0.1:5173</text>
  <text x="575" y="122" font-size="11.5" text-anchor="middle" fill="#8a5b34">on the existing ControlMaster socket · new (PT2)</text>
  <line x1="725" y1="140" x2="242" y2="140" stroke="#c2611b" stroke-width="2" marker-end="url(#arrO)"/>

  <!-- data lane (exists) -->
  <text x="575" y="340" font-size="11.5" text-anchor="middle" fill="#3a6ea5" font-weight="700">ssh surface mirror — exists</text>
  <line x1="425" y1="357" x2="721" y2="357" stroke="#3a6ea5" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="575" y="378" font-size="11" text-anchor="middle" fill="#7d94ad">same pipe as cwd · git · agent state</text>

  <!-- ══════════ Legend ══════════ -->
  <rect x="330" y="437" width="14" height="14" rx="3" fill="#eaf1f8" stroke="#3a6ea5"/>
  <text x="352" y="448" font-size="12" fill="#1a1c20">exists today</text>
  <rect x="460" y="437" width="14" height="14" rx="3" fill="#e3f4e9" stroke="#1b7a3a"/>
  <text x="482" y="448" font-size="12" fill="#1a1c20">new in PT1 — detection + UI</text>
  <rect x="680" y="437" width="14" height="14" rx="3" fill="#fbeadd" stroke="#c2611b"/>
  <text x="702" y="448" font-size="12" fill="#1a1c20">new in PT2 — remote forwards</text>
</svg>
