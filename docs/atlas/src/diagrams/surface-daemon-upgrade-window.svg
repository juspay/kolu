<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" font-family="system-ui, sans-serif">
  <rect width="1180" height="660" fill="#0f1117"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b95a7"/>
    </marker>
    <marker id="arrNew" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8b44c"/>
    </marker>
  </defs>

  <!-- ===== consumers row ===== -->
  <rect x="30" y="24" width="500" height="128" rx="9" fill="#1a2130" stroke="#3a4356" stroke-width="1.4"/>
  <text x="280" y="48" fill="#e6eaf2" font-size="13.5" font-weight="600" text-anchor="middle">kolu — first consumer (proves each piece as it lands)</text>
  <rect x="52" y="62" width="140" height="34" rx="6" fill="#232c3d" stroke="#3a4356"/>
  <text x="122" y="79" fill="#e6eaf2" font-size="11.5" text-anchor="middle">kolu-server</text>
  <text x="122" y="91" fill="#8b95a7" font-size="9.5" text-anchor="middle">supervises padi · local + ssh</text>
  <rect x="220" y="62" width="140" height="34" rx="6" fill="#232c3d" stroke="#3a4356"/>
  <text x="290" y="79" fill="#e6eaf2" font-size="11.5" text-anchor="middle">padi (daemon)</text>
  <text x="290" y="91" fill="#8b95a7" font-size="9.5" text-anchor="middle">supervises kaval</text>
  <rect x="388" y="62" width="120" height="34" rx="6" fill="#232c3d" stroke="#3a4356"/>
  <text x="448" y="79" fill="#e6eaf2" font-size="11.5" text-anchor="middle">kaval (daemon)</text>
  <text x="448" y="91" fill="#8b95a7" font-size="9.5" text-anchor="middle">not-drainable</text>
  <line x1="192" y1="79" x2="220" y2="79" stroke="#8b95a7" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="360" y1="79" x2="388" y2="79" stroke="#8b95a7" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="280" y="122" fill="#8b95a7" font-size="10.5" text-anchor="middle">hand-rolled today: remote ssh convergence arm · drain skeleton · drain budget</text>
  <text x="280" y="138" fill="#a78bfa" font-size="10.5" font-weight="600" text-anchor="middle">UW1 migrates all three into the framework</text>

  <rect x="650" y="24" width="500" height="128" rx="9" fill="#1a2130" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="900" y="48" fill="#e6eaf2" font-size="13.5" font-weight="600" text-anchor="middle">drishti — second consumer (UW3 adoption)</text>
  <rect x="672" y="62" width="180" height="34" rx="6" fill="#232c3d" stroke="#3a4356"/>
  <text x="762" y="79" fill="#e6eaf2" font-size="11.5" text-anchor="middle">parent (Bun server)</text>
  <text x="762" y="91" fill="#8b95a7" font-size="9.5" text-anchor="middle">home-manager deploys · linux + macOS</text>
  <rect x="920" y="62" width="208" height="34" rx="6" fill="#232c3d" stroke="#a78bfa"/>
  <text x="1024" y="79" fill="#e6eaf2" font-size="11.5" text-anchor="middle">agent daemon (new)</text>
  <text x="1024" y="91" fill="#a78bfa" font-size="9.5" text-anchor="middle">idle-60m · on-disk 30-min metric ring</text>
  <line x1="852" y1="79" x2="920" y2="79" stroke="#a78bfa" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arrNew)"/>
  <text x="886" y="70" fill="#8b95a7" font-size="9.5" text-anchor="middle">ssh</text>
  <text x="900" y="122" fill="#8b95a7" font-size="10.5" text-anchor="middle">today: agent respawned per dial, state dies with the link</text>
  <text x="900" y="138" fill="#a78bfa" font-size="10.5" font-weight="600" text-anchor="middle">becomes: front adopts a surviving daemon; history outlives deploys</text>

  <text x="590" y="176" fill="#8b95a7" font-size="10.5" text-anchor="middle">odu serve — third tenant on a loose npins pin: every framework PR posts an odu-impact verdict, no pair PR</text>

  <!-- consumer -> package arrows -->
  <line x1="180" y1="152" x2="180" y2="216" stroke="#8b95a7" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="400" y1="152" x2="400" y2="216" stroke="#8b95a7" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="780" y1="152" x2="780" y2="216" stroke="#a78bfa" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrNew)"/>
  <line x1="1000" y1="152" x2="1000" y2="216" stroke="#a78bfa" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrNew)"/>

  <!-- ===== framework band ===== -->
  <rect x="30" y="216" width="545" height="230" rx="9" fill="#1a2130" stroke="#3a4356" stroke-width="1.4"/>
  <text x="302" y="240" fill="#e6eaf2" font-size="13.5" font-weight="600" text-anchor="middle">@kolu/surface-daemon-supervisor</text>
  <text x="52" y="264" fill="#8b95a7" font-size="11">exists: endpoint machine · converge / decide · policy&lt;Cap&gt; · drivers · restart</text>
  <text x="52" y="292" fill="#a78bfa" font-size="11.5" font-weight="600">UW1 — the window kit completed:</text>
  <text x="66" y="312" fill="#e6eaf2" font-size="11">drainAndAwaitExit — exit is ground truth, never the RPC</text>
  <text x="66" y="330" fill="#e6eaf2" font-size="11">drain admission as policy data — budget survives adopts, cross-supervisor give-up</text>
  <text x="66" y="348" fill="#e6eaf2" font-size="11">adopted-stale outcome (closes the L23 fence-spent gap)</text>
  <text x="66" y="366" fill="#e6eaf2" font-size="11">ConvergenceAnomaly incl. cross-supervisor — typed, never silent no-ops</text>
  <text x="66" y="384" fill="#e6eaf2" font-size="11">one converge for endpoint and ssh arms — boot-method trio goes internal</text>
  <text x="52" y="414" fill="#8b95a7" font-size="10.5">supervisor tests gain recycleForeignGate + socketContractMismatch (UW2)</text>
  <text x="52" y="430" fill="#8b95a7" font-size="10.5">deps stay: node + @kolu/surface-daemon only</text>

  <rect x="605" y="216" width="545" height="230" rx="9" fill="#1a2130" stroke="#3a4356" stroke-width="1.4"/>
  <text x="877" y="240" fill="#e6eaf2" font-size="13.5" font-weight="600" text-anchor="middle">@kolu/surface-daemon</text>
  <text x="627" y="262" fill="#8b95a7" font-size="11">exists: pid gate · daemonMain · frontDaemonOverStdio · ConvergenceIdentity</text>
  <text x="627" y="286" fill="#a78bfa" font-size="11.5" font-weight="600">UW0 — daemonHome:</text>
  <text x="641" y="304" fill="#e6eaf2" font-size="11">state-vs-runtime placement · 0700 dirs · artifacts registered by construction</text>
  <text x="627" y="328" fill="#a78bfa" font-size="11.5" font-weight="600">UW2 — identity across the socket seam:</text>
  <text x="641" y="346" fill="#e6eaf2" font-size="11">frozen control core fragment (hello + drain) — probe lands supervisor-side</text>
  <text x="627" y="370" fill="#a78bfa" font-size="11.5" font-weight="600">UW2 — ./upgrade-window.testlib subpath:</text>
  <text x="641" y="388" fill="#e6eaf2" font-size="11">yesterday-daemon fixture · watchdog · skew + previous-release harnesses</text>
  <text x="627" y="412" fill="#a78bfa" font-size="11.5" font-weight="600">UW4 — versioned gate identity (the capstone):</text>
  <text x="641" y="430" fill="#e6eaf2" font-size="11">writes pid + start-instant · pid stays the first token — every reader can signal the holder</text>

  <line x1="575" y1="330" x2="605" y2="330" stroke="#8b95a7" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="590" y="320" fill="#8b95a7" font-size="9.5" text-anchor="middle">dep</text>

  <!-- ===== window strip ===== -->
  <line x1="302" y1="446" x2="302" y2="500" stroke="#e8b44c" stroke-width="1.4" marker-end="url(#arrAmber)"/>
  <line x1="877" y1="446" x2="877" y2="500" stroke="#e8b44c" stroke-width="1.4" marker-end="url(#arrAmber)"/>

  <rect x="30" y="500" width="1120" height="130" rx="9" fill="#251f12" stroke="#e8b44c" stroke-width="1.6"/>
  <text x="590" y="526" fill="#e8b44c" font-size="13.5" font-weight="600" text-anchor="middle">the mixed-version window — yesterday's daemon and today's supervisor share these files</text>
  <rect x="80" y="544" width="300" height="52" rx="6" fill="#1a2130" stroke="#3a4356"/>
  <text x="230" y="566" fill="#e6eaf2" font-size="11.5" text-anchor="middle">gate file (pid → pid + start-instant, UW4)</text>
  <text x="230" y="584" fill="#8b95a7" font-size="10" text-anchor="middle">kaval.pid · padi.pid · agent.pid</text>
  <rect x="440" y="544" width="300" height="52" rx="6" fill="#1a2130" stroke="#3a4356"/>
  <text x="590" y="566" fill="#e6eaf2" font-size="11.5" text-anchor="middle">unix socket — frozen hello at any skew</text>
  <text x="590" y="584" fill="#8b95a7" font-size="10" text-anchor="middle">pty-host.sock · padi.sock · agent.sock</text>
  <rect x="800" y="544" width="300" height="52" rx="6" fill="#1a2130" stroke="#3a4356"/>
  <text x="950" y="566" fill="#e6eaf2" font-size="11.5" text-anchor="middle">state files — versioned, watchdog-registered</text>
  <text x="950" y="584" fill="#8b95a7" font-size="10" text-anchor="middle">config.json#session · history.ring.json</text>
  <text x="590" y="618" fill="#8b95a7" font-size="10.5" text-anchor="middle">every file both generations touch is registered in a shared-artifact inventory; an unregistered file turns CI red with registration instructions</text>
</svg>
