<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" font-family="system-ui, sans-serif">
  <rect width="980" height="440" fill="#0f1117"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b95a7"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4a7"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8b44c"/>
    </marker>
  </defs>

  <!-- lane titles -->
  <text x="35" y="30" fill="#8b95a7" font-size="13" font-weight="600">ONE WRITER PER HOST</text>
  <text x="330" y="30" fill="#8b95a7" font-size="13" font-weight="600">THE FRAMEWORK — three generic pieces</text>
  <text x="745" y="30" fill="#8b95a7" font-size="13" font-weight="600">THE APP'S PIXELS</text>

  <!-- writers: kolu hosts -->
  <rect x="25" y="55" width="185" height="58" rx="8" fill="#1a2130" stroke="#2dd4a7" stroke-width="1.5"/>
  <text x="117" y="78" fill="#e6eaf2" font-size="12.5" text-anchor="middle">padi @ zest</text>
  <text x="117" y="95" fill="#8b95a7" font-size="10.5" text-anchor="middle">awaiting fold → attention cell</text>

  <rect x="25" y="123" width="185" height="58" rx="8" fill="#1a2130" stroke="#2dd4a7" stroke-width="1.5"/>
  <text x="117" y="146" fill="#e6eaf2" font-size="12.5" text-anchor="middle">padi @ local</text>
  <text x="117" y="163" fill="#8b95a7" font-size="10.5" text-anchor="middle">same fold, same cell</text>

  <!-- writers: drishti -->
  <rect x="25" y="235" width="185" height="70" rx="8" fill="#1a2130" stroke="#e8b44c" stroke-width="1.5"/>
  <text x="117" y="258" fill="#e6eaf2" font-size="12.5" text-anchor="middle">drishti server, per host</text>
  <text x="117" y="275" fill="#8b95a7" font-size="10.5" text-anchor="middle">30-min metrics ring</text>
  <text x="117" y="291" fill="#8b95a7" font-size="10.5" text-anchor="middle">threshold + hysteresis → alerts cell</text>

  <text x="117" y="340" fill="#5b6678" font-size="10.5" text-anchor="middle" font-style="italic">level state: "what needs you NOW"</text>
  <text x="117" y="356" fill="#5b6678" font-size="10.5" text-anchor="middle" font-style="italic">written once, where it can be known</text>

  <!-- framework container -->
  <rect x="290" y="48" width="380" height="348" rx="10" fill="#141925" stroke="#3d4a63" stroke-width="1.5"/>

  <!-- surface-remote -->
  <rect x="308" y="66" width="344" height="76" rx="6" fill="#1a2130" stroke="#5b8def"/>
  <text x="480" y="88" fill="#9db4e8" font-size="12" font-weight="600" text-anchor="middle">@kolu/surface-remote</text>
  <text x="480" y="106" fill="#e6eaf2" font-size="11" text-anchor="middle">Mirrored&lt;V&gt; = {hydrated: false | true, value}</text>
  <text x="480" y="123" fill="#8b95a7" font-size="10.5" text-anchor="middle">the honest first frame — a default is not the authority's truth</text>

  <!-- surface-map -->
  <rect x="308" y="156" width="344" height="118" rx="6" fill="#1a2130" stroke="#5b8def"/>
  <text x="480" y="178" fill="#9db4e8" font-size="12" font-weight="600" text-anchor="middle">@kolu/surface-map</text>
  <text x="480" y="197" fill="#e6eaf2" font-size="11" text-anchor="middle">membership kernel (shared with scopedByEntry)</text>
  <text x="480" y="215" fill="#e6eaf2" font-size="11" text-anchor="middle">stepEntryAttention — the pure fold, property-tested</text>
  <text x="480" y="232" fill="#8b95a7" font-size="10.5" text-anchor="middle">join · exit · liveness · frame{hydrated} ⇒ raised ids</text>
  <text x="480" y="250" fill="#e6eaf2" font-size="11" text-anchor="middle">watchByEntry — eager pump · get(key): live | stale</text>
  <text x="480" y="266" fill="#8b95a7" font-size="10.5" text-anchor="middle">deliberately no total() — aggregation is app policy</text>

  <!-- surface-app -->
  <rect x="308" y="288" width="344" height="92" rx="6" fill="#1a2130" stroke="#5b8def"/>
  <text x="480" y="310" fill="#9db4e8" font-size="12" font-weight="600" text-anchor="middle">@kolu/surface-app</text>
  <text x="480" y="329" fill="#e6eaf2" font-size="11" text-anchor="middle">notify — the origin's ONE service worker</text>
  <text x="480" y="346" fill="#8b95a7" font-size="10.5" text-anchor="middle">tag-keyed show/close: same tag replaces, never stacks</text>
  <text x="480" y="363" fill="#8b95a7" font-size="10.5" text-anchor="middle">onClick hands {host, itemId} back — the app routes</text>

  <!-- app outputs: kolu -->
  <rect x="720" y="55" width="230" height="126" rx="8" fill="#1a2130" stroke="#2dd4a7" stroke-width="1.5"/>
  <text x="835" y="78" fill="#e6eaf2" font-size="12.5" font-weight="600" text-anchor="middle">kolu</text>
  <text x="835" y="98" fill="#8b95a7" font-size="10.5" text-anchor="middle">chips: att.get(host) — dimmed when stale</text>
  <text x="835" y="115" fill="#8b95a7" font-size="10.5" text-anchor="middle">badge: Σ items over LIVE hosts</text>
  <text x="835" y="132" fill="#8b95a7" font-size="10.5" text-anchor="middle">OS notification per item id</text>
  <text x="835" y="152" fill="#2dd4a7" font-size="10.5" text-anchor="middle">click ⇒ switchHost + focusTerminal</text>

  <!-- app outputs: drishti -->
  <rect x="720" y="235" width="230" height="110" rx="8" fill="#1a2130" stroke="#e8b44c" stroke-width="1.5"/>
  <text x="835" y="258" fill="#e6eaf2" font-size="12.5" font-weight="600" text-anchor="middle">drishti</text>
  <text x="835" y="278" fill="#8b95a7" font-size="10.5" text-anchor="middle">badge: COUNT of hosts in trouble</text>
  <text x="835" y="295" fill="#8b95a7" font-size="10.5" text-anchor="middle">(its own fold — NOT a sum)</text>
  <text x="835" y="315" fill="#e8b44c" font-size="10.5" text-anchor="middle">click ⇒ expandHost</text>

  <!-- arrows: writers → framework -->
  <line x1="210" y1="84" x2="288" y2="100" stroke="#2dd4a7" stroke-width="1.3" marker-end="url(#arrGreen)"/>
  <line x1="210" y1="152" x2="288" y2="130" stroke="#2dd4a7" stroke-width="1.3" marker-end="url(#arrGreen)"/>
  <line x1="210" y1="270" x2="288" y2="270" stroke="#e8b44c" stroke-width="1.3" marker-end="url(#arrAmber)"/>
  <text x="238" y="62" fill="#5b6678" font-size="10">cells over</text>
  <text x="238" y="76" fill="#5b6678" font-size="10">the wire</text>

  <!-- arrows: framework → apps -->
  <line x1="670" y1="115" x2="718" y2="115" stroke="#2dd4a7" stroke-width="1.3" marker-end="url(#arrGreen)"/>
  <line x1="670" y1="290" x2="718" y2="290" stroke="#e8b44c" stroke-width="1.3" marker-end="url(#arrAmber)"/>
  <text x="694" y="102" fill="#5b6678" font-size="10" text-anchor="middle">raised</text>
  <text x="694" y="277" fill="#5b6678" font-size="10" text-anchor="middle">raised</text>

  <!-- footer -->
  <text x="490" y="424" fill="#5b6678" font-size="11" text-anchor="middle">the framework hands facts (raised ids · live/stale values); every aggregation, pixel, and click meaning stays in the app</text>
</svg>
