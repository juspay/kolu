<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" font-family="system-ui, sans-serif">
  <rect width="980" height="500" fill="#0f1117"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b95a7"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4a7"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8b44c"/>
    </marker>
  </defs>

  <!-- ══ PHASE 1 band ══ -->
  <text x="30" y="32" fill="#8b95a7" font-size="13" font-weight="600">PHASE 1 — THE SURFACE REFACTOR PR (paired kolu · drishti · odu adoptions)</text>
  <rect x="30" y="44" width="920" height="112" rx="10" fill="#141925" stroke="#3d4a63" stroke-width="1.5"/>

  <rect x="46" y="60" width="288" height="80" rx="6" fill="#1a2130" stroke="#5b8def"/>
  <text x="190" y="82" fill="#9db4e8" font-size="11.5" font-weight="600" text-anchor="middle">@kolu/surface — the Dynamic, completed</text>
  <text x="190" y="101" fill="#e6eaf2" font-size="10.5" text-anchor="middle">updated(({prev, next}) =&gt; void)</text>
  <text x="190" y="118" fill="#8b95a7" font-size="10" text-anchor="middle">fires iff the value CHANGES; a first frame</text>
  <text x="190" y="132" fill="#8b95a7" font-size="10" text-anchor="middle">is a value, not a change</text>

  <rect x="346" y="60" width="288" height="80" rx="6" fill="#1a2130" stroke="#5b8def"/>
  <text x="490" y="82" fill="#9db4e8" font-size="11.5" font-weight="600" text-anchor="middle">@kolu/surface-remote — no fabrication</text>
  <text x="490" y="101" fill="#e6eaf2" font-size="10.5" text-anchor="middle">no frame until the authority's first real one</text>
  <text x="490" y="118" fill="#8b95a7" font-size="10" text-anchor="middle">"undefined until the first frame" end-to-end;</text>
  <text x="490" y="132" fill="#8b95a7" font-size="10" text-anchor="middle">the default belongs to the ONE writer</text>

  <rect x="646" y="60" width="288" height="80" rx="6" fill="#1a2130" stroke="#5b8def"/>
  <text x="790" y="82" fill="#9db4e8" font-size="11.5" font-weight="600" text-anchor="middle">the derivation algebra</text>
  <text x="790" y="101" fill="#e6eaf2" font-size="10.5" text-anchor="middle">foldCollection · scanCell · pollCollection …</text>
  <text x="790" y="118" fill="#8b95a7" font-size="10" text-anchor="middle">derived members declared, not hand-wired;</text>
  <text x="790" y="132" fill="#8b95a7" font-size="10" text-anchor="middle">one writer boot-checked · dedup at spec equals</text>

  <!-- phase 1 → phase 2 -->
  <line x1="490" y1="156" x2="490" y2="186" stroke="#8b95a7" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="502" y="176" fill="#5b6678" font-size="10.5">phase 2 rides the completed primitives</text>

  <!-- ══ PHASE 2 band ══ -->
  <text x="30" y="208" fill="#8b95a7" font-size="13" font-weight="600">PHASE 2 — W5: ATTENTION</text>
  <text x="30" y="224" fill="#5b6678" font-size="10.5" font-style="italic">level state: "what needs you now" — one writer per host, an ordinary per-entry cell</text>

  <!-- writers -->
  <rect x="30" y="240" width="180" height="52" rx="8" fill="#1a2130" stroke="#2dd4a7" stroke-width="1.5"/>
  <text x="120" y="261" fill="#e6eaf2" font-size="12" text-anchor="middle">padi, per host</text>
  <text x="120" y="278" fill="#8b95a7" font-size="10.5" text-anchor="middle">declared fold → urgency cell (existing)</text>

  <rect x="30" y="330" width="180" height="66" rx="8" fill="#1a2130" stroke="#e8b44c" stroke-width="1.5"/>
  <text x="120" y="351" fill="#e6eaf2" font-size="12" text-anchor="middle">drishti server, per host</text>
  <text x="120" y="368" fill="#8b95a7" font-size="10.5" text-anchor="middle">metrics ring · threshold +</text>
  <text x="120" y="383" fill="#8b95a7" font-size="10.5" text-anchor="middle">hysteresis → alerts cell (new)</text>

  <!-- framework middle -->
  <rect x="250" y="236" width="400" height="112" rx="6" fill="#1a2130" stroke="#5b8def"/>
  <text x="450" y="258" fill="#9db4e8" font-size="12" font-weight="600" text-anchor="middle">@kolu/surface-map — watchByEntry (eager)</text>
  <text x="450" y="277" fill="#e6eaf2" font-size="11" text-anchor="middle">scopedByEntry's membership kernel, eager policy</text>
  <text x="450" y="294" fill="#8b95a7" font-size="10.5" text-anchor="middle">raise = pure set-diff over updated's {prev, next} pairs</text>
  <text x="450" y="311" fill="#e6eaf2" font-size="11" text-anchor="middle">get(key): live | stale — chips read this</text>
  <text x="450" y="328" fill="#8b95a7" font-size="10.5" text-anchor="middle">deliberately no total() — aggregation is app policy</text>

  <rect x="250" y="362" width="400" height="92" rx="6" fill="#1a2130" stroke="#5b8def"/>
  <text x="450" y="384" fill="#9db4e8" font-size="12" font-weight="600" text-anchor="middle">@kolu/surface-app — notify</text>
  <text x="450" y="403" fill="#e6eaf2" font-size="11" text-anchor="middle">the origin's ONE service worker</text>
  <text x="450" y="420" fill="#8b95a7" font-size="10.5" text-anchor="middle">tag-keyed show/close: same tag replaces, never stacks</text>
  <text x="450" y="437" fill="#8b95a7" font-size="10.5" text-anchor="middle">onClick hands {host, itemId} back — the app routes</text>

  <!-- apps right -->
  <rect x="690" y="236" width="260" height="112" rx="8" fill="#1a2130" stroke="#2dd4a7" stroke-width="1.5"/>
  <text x="820" y="258" fill="#e6eaf2" font-size="12.5" font-weight="600" text-anchor="middle">kolu</text>
  <text x="820" y="278" fill="#8b95a7" font-size="10.5" text-anchor="middle">chips: att.get(host) — dimmed when stale</text>
  <text x="820" y="295" fill="#8b95a7" font-size="10.5" text-anchor="middle">badge: Σ items over LIVE hosts</text>
  <text x="820" y="312" fill="#8b95a7" font-size="10.5" text-anchor="middle">OS notification per item id</text>
  <text x="820" y="332" fill="#2dd4a7" font-size="10.5" text-anchor="middle">click ⇒ switchHost + focusTerminal</text>

  <rect x="690" y="362" width="260" height="92" rx="8" fill="#1a2130" stroke="#e8b44c" stroke-width="1.5"/>
  <text x="820" y="384" fill="#e6eaf2" font-size="12.5" font-weight="600" text-anchor="middle">drishti</text>
  <text x="820" y="404" fill="#8b95a7" font-size="10.5" text-anchor="middle">badge: COUNT of hosts with any live alert</text>
  <text x="820" y="421" fill="#8b95a7" font-size="10.5" text-anchor="middle">(its own fold — NOT a sum)</text>
  <text x="820" y="441" fill="#e8b44c" font-size="10.5" text-anchor="middle">click ⇒ expandHost</text>

  <!-- arrows: writers → framework -->
  <line x1="210" y1="266" x2="248" y2="278" stroke="#2dd4a7" stroke-width="1.3" marker-end="url(#arrGreen)"/>
  <line x1="210" y1="363" x2="248" y2="330" stroke="#e8b44c" stroke-width="1.3" marker-end="url(#arrAmber)"/>

  <!-- arrows: framework → apps -->
  <line x1="650" y1="285" x2="688" y2="285" stroke="#2dd4a7" stroke-width="1.3" marker-end="url(#arrGreen)"/>
  <line x1="650" y1="404" x2="688" y2="404" stroke="#e8b44c" stroke-width="1.3" marker-end="url(#arrAmber)"/>
  <text x="669" y="272" fill="#5b6678" font-size="10" text-anchor="middle">raised</text>
  <text x="669" y="391" fill="#5b6678" font-size="10" text-anchor="middle">raised</text>

  <!-- footer -->
  <text x="490" y="484" fill="#5b6678" font-size="11" text-anchor="middle">the framework hands facts (change pairs · raised ids · live/stale values); every aggregation, pixel, and click meaning stays in the app</text>
</svg>
