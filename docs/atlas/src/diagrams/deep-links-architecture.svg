<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="ui-monospace, Menlo, monospace" font-size="13">
  <rect width="860" height="300" fill="#0d1117"/>
  <!-- URL sources -->
  <rect x="20" y="30" width="200" height="34" rx="6" fill="#1f2937" stroke="#58a6ff"/>
  <text x="120" y="52" fill="#c9d1d9" text-anchor="middle">link click / bookmark</text>
  <rect x="20" y="76" width="200" height="34" rx="6" fill="#1f2937" stroke="#58a6ff"/>
  <text x="120" y="98" fill="#c9d1d9" text-anchor="middle">launchQueue (PWA capture)</text>
  <rect x="20" y="122" width="200" height="34" rx="6" fill="#1f2937" stroke="#58a6ff"/>
  <text x="120" y="144" fill="#c9d1d9" text-anchor="middle">hashchange (live)</text>
  <text x="120" y="188" fill="#8b949e" text-anchor="middle" font-size="11">manifest launch_handler:</text>
  <text x="120" y="203" fill="#8b949e" text-anchor="middle" font-size="11">focus-existing</text>

  <!-- parser -->
  <rect x="290" y="76" width="220" height="80" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="400" y="106" fill="#e6edf3" text-anchor="middle" font-weight="bold">deepLink.ts (leaf)</text>
  <text x="400" y="126" fill="#8b949e" text-anchor="middle" font-size="11">parse, don't validate</text>
  <text x="400" y="142" fill="#8b949e" text-anchor="middle" font-size="11">bad → loud toast, never route</text>

  <!-- arrows sources->parser -->
  <path d="M220 47 H255 V116 H290" stroke="#58a6ff" fill="none"/>
  <path d="M220 93 H290" stroke="#58a6ff" fill="none"/>
  <path d="M220 139 H255 V116" stroke="#58a6ff" fill="none"/>
  <polygon points="290,116 280,111 280,121" fill="#58a6ff"/>

  <!-- existing actions -->
  <rect x="590" y="20" width="250" height="34" rx="6" fill="#1f2937" stroke="#d29922"/>
  <text x="715" y="42" fill="#c9d1d9" text-anchor="middle">setActiveHost (binding switch)</text>
  <rect x="590" y="64" width="250" height="34" rx="6" fill="#1f2937" stroke="#d29922"/>
  <text x="715" y="86" fill="#c9d1d9" text-anchor="middle">store.activate (tile focus)</text>
  <rect x="590" y="108" width="250" height="34" rx="6" fill="#1f2937" stroke="#d29922"/>
  <text x="715" y="130" fill="#c9d1d9" text-anchor="middle">right panel · showCode(path)</text>
  <rect x="590" y="152" width="250" height="34" rx="6" fill="#1f2937" stroke="#d29922"/>
  <text x="715" y="174" fill="#c9d1d9" text-anchor="middle">settings dialog</text>
  <text x="715" y="212" fill="#8b949e" text-anchor="middle" font-size="11">all EXISTING seams — the router adds none</text>

  <!-- arrows parser->actions -->
  <path d="M510 100 H550 V37 H590" stroke="#d29922" fill="none"/>
  <path d="M510 108 H560 V81 H590" stroke="#d29922" fill="none"/>
  <path d="M510 124 H560 V125 H590" stroke="#d29922" fill="none"/>
  <path d="M510 132 H550 V169 H590" stroke="#d29922" fill="none"/>

  <!-- law strip -->
  <rect x="20" y="240" width="820" height="40" rx="6" fill="#161b22" stroke="#f85149"/>
  <text x="430" y="264" fill="#f85149" text-anchor="middle" font-size="12">LAW: a deep link only VIEWS — no URL may create, kill, write, or send. Mutation via URL is unrepresentable (no route exists).</text>
</svg>
