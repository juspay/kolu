    <text x="380" y="156" fill="#8b95a7" font-size="10.5">pure · total · deterministic</text>
    <text x="380" y="196" fill="#8b95a7" font-size="10.5">drag ⇒ per-tile manual override</text>
    <text x="380" y="212" fill="#8b95a7" font-size="10.5">no “Autoarrange” action — auto is</text>
    <text x="380" y="226" fill="#8b95a7" font-size="10.5">the resting state, not a command</text>
  </g>

