  <text x="880" y="360" fill="#7fe3c3" font-size="11" font-weight="600">☰ Dock = the same tree, walked as rows</text>
  <text x="880" y="376" fill="#8b95a7" font-size="10">recursive indent · click a row → camera flies there</text>
