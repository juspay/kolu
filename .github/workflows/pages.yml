# Build and deploy the Kolu website to GitHub Pages.
#
# The site lives in its own flake under website/ — `nix build ./website`
# produces the static artefact without evaluating Kolu's runnable flake.
name: pages

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "docs/atlas/dist/**"
      # Every out-of-tree file website/default.nix copies into the site's
      # build sandbox must be listed here, or changing it silently skips the
      # deploy. Drift-pinned: website/test/pages-deploy-paths.test.mjs parses
      # default.nix's ${../...} interpolations and asserts each has an entry.
      - "packages/client/favicon.svg"
      - "packages/kaval/logo.svg"
      - "packages/padi/logo.svg"
      - "packages/server/package.json"
      - "scripts/fence-langs.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            extra-substituters = https://cache.nixos.asia/oss
            extra-trusted-public-keys = oss:KO872wNJkCDgmGN3xy9dT89WAhvv13EiKncTtHDItVU=
            accept-flake-config = true

      - name: Build website (nix)
        run: nix build ./website --print-out-paths

      - name: Stage artefact
        run: |
          # result/ is a symlink into /nix/store (read-only). Pages needs
          # a writable directory with a .nojekyll file and correct perms.
          mkdir -p _site
          cp -rL result/* _site/
          chmod -R u+w _site
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
