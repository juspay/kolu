name: pages

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "docs/atlas/dist/**"
      - "packages/client/favicon.svg"
      - "packages/kaval/logo.svg"
      - "packages/padi/logo.svg"
      - "packages/server/package.json"
      - "scripts/fence-langs.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            extra-substituters = https://cache.kolu.dev/kolu-r2
            extra-trusted-public-keys = kolu-r2-1:7KmFrK05rVrnxkyZi9hJGnJJmRCpg87u6MUQIk7nokQ=
            accept-flake-config = true

      - name: Build website (nix)
        run: nix build ./website --print-out-paths

      - name: Stage artefact
        run: |
          mkdir -p _site
          cp -rL result/* _site/
          chmod -R u+w _site
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
