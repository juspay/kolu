# Push kolu's closures to its OWN binary cache — `https://cache.kolu.dev/kolu-r2`,
# the `kolu-r2` bucket odu keeps on Cloudflare R2. The flake already lists this
# cache as a substituter, so a green push warms CI boxes and local `nix build`s.
#
# THIS FILE WRITES THE CACHE FOR DARWIN ONLY. `odu ci run` pushes every
# recipe's `result*` closure to the cache the repo's `flake.nix` `nixConfig`
# names, so the x86_64-linux warm is `ci::nix` (+ `ci::website-nix`,
# `ci::odu-nix`), verified by `ci::cache-substitutable` on the same lane. One
# linux build, on the lane that already had to do it, instead of a second one
# here. Darwin has no odu lane in this repo's gate (`ci/protect` pins
# x86_64-linux), so darwin stays GitHub's job.
#
# `publish-closures` still runs on BOTH, and its ubuntu leg no longer has a
# linux warm from this file to lean on — the tradeoff is spelled out at that
# job. Read "darwin-only" as a statement about who WRITES the cache here, not
# about which systems this workflow touches.
#
# The cache is kolu's, not a shared Attic cache: odu serves it (`odu cache
# push` is the client), it re-signs every narinfo with the `kolu-r2-1` key the
# flake declares, and it drops what upstream `cache.nixos.org` already signs
# instead of re-uploading nixpkgs.
#
# THE PUSH IS ONE ACTION, not a shell pipeline: odu's own push action, pinned
# by commit, which builds the odu it pushes with out of that commit's checkout
# and then proves what it pushed (see the step below).
#
# ONE FACT, not three. The step is given the SUBSTITUTER URL this repo already
# substitutes from (`https://cache.kolu.dev/kolu-r2`); that cache states where
# a push is taken and which bucket it lands in in its own `nix-cache-info`
# (`Odu-Origin`, `Odu-Bucket`). Reads come from R2 — static files nothing can
# push to — so the two addresses genuinely differ; the cache is what
# reconciles them, not this file. The URL is named here rather than inferred
# from `flake.nix` because odu's pusher only authenticates to a URL the
# operator named (juspay/odu#163). And the push has one success: a path is
# STORED (`200`) or the step is red. There is no in-between "the cache will
# catch up" answer.
#
# The build set is DERIVED, never hand-listed, and derived by the one script
# that already answers "what does this repo build" — `ci/flake-build`. This job
# used to run a bare `nix build` (= `.#default` alone) and push whatever new
# store paths appeared, so coverage was an emergent property of `default`'s
# closure rather than a decision. `padi-agent` sat outside it and was never
# warmed at all; `kaval-tui`, `padi-tui` and `osfacts` were warmed only
# incidentally, and would have gone quietly cold the day they left that
# closure. Nothing declared the intent, and nothing would have gone red.
#
# Sharing the script with `ci::nix` makes the gap impossible to express rather
# than merely detectable: a newly exposed output is warmed the day it lands,
# and the cache job cannot disagree with CI about what this repo builds.
#
# Two later corrections, both from one production incident (juspay/kolu#2101,
# F5(a) — a deploy whose remote hosts found no `padi-agent` in the cache and
# compiled the daemon over ssh, while this job was green):
#
#   * WHICH COMMIT. On `pull_request` the checkout defaulted to the synthetic
#     `refs/pull/N/merge` tree, so a branch's own head — the thing developers,
#     odu, and deploys all build — was never warmed. See the `ref:` note below.
#   * TRUST NOTHING, ASK THE CACHE. Pushing is an instruction, not a result.
#     The final step queries the cache back for the remote-agent closures
#     (`ci/agent-substitutable`), so "warmed" is an observation.
name: nix-cache

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege — this job only needs the checkout and ODU_CACHE_TOKEN secret.
permissions:
  contents: read

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest → aarch64-darwin (GitHub's current image). ONE entry on
        # purpose: x86_64-linux is warmed by the odu lanes (`ci::nix` and its
        # subflake siblings leave `result*` out-links; odu pushes each closure
        # as part of the node's completion) and verified there by
        # `ci::cache-substitutable`. Darwin has no odu lane in the gate, so it
        # is warmed here. The cost is at `publish-closures`, whose ubuntu leg
        # loses the in-workflow warm it used to inherit — stated in full at
        # that job. aarch64-linux stays out until something needs it warmed;
        # x86_64-darwin is no longer a kolu system at all — agent-distro does
        # not build there.
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # `ref:` is LOAD-BEARING on `pull_request`. actions/checkout defaults to
      # `github.ref`, which for that event is `refs/pull/N/merge` — a synthetic
      # merge of the PR into its base that NOTHING else ever builds. Developers
      # check out the branch head; odu's CI lanes fetch the pushed head SHA; a
      # `nix run github:juspay/kolu/<branch>` resolves the head; and a
      # pre-release deploy ships the head. Whenever the base has moved (i.e.
      # always, on a branch that lives more than a day) those closures differ,
      # so the job warmed a tree nobody wanted and left the one everybody wanted
      # cold. That is how a production deploy found no `padi-agent` in the cache
      # and provisioned remote hosts by COMPILING the daemon over ssh
      # (juspay/kolu#2101, F5(a)) while this job sat green.
      #
      # Warm what people actually build. `head.sha` is empty on non-PR events,
      # where the fallback is checkout's own default (the pushed master commit /
      # the dispatched ref) — the correct tree there already.
      #
      # No new exposure: this is `pull_request`, not `pull_request_target`, so a
      # fork PR gets no `ODU_CACHE_TOKEN` and cannot push regardless of which of
      # the two trees is checked out. Both refs already run this PR's Nix code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Pin by commit (CodeQL: unpinned third-party action). v35 → 9f63be7.
      # Defaults to Nix 2.34.7, which is what the pinned odu client is run with.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            extra-substituters = https://cache.kolu.dev/kolu-r2
            extra-trusted-public-keys = kolu-r2-1:7KmFrK05rVrnxkyZi9hJGnJJmRCpg87u6MUQIk7nokQ=
            accept-flake-config = true

      # Discovery is `ci/flake-build` — the SAME script every `ci::*-nix` node
      # already uses (`nix`, `website-nix`, `odu-nix` in ci/mod.just). It
      # enumerates attrNames of the flake's own outputs, dies loudly when a
      # required kind is empty, and ends in `nix build -L … --print-out-paths`,
      # so its stdout IS the list of built artifacts (`-L` logs go to stderr).
      # Those nodes pass `--link` so odu can push what they built from the
      # out-links; this job pushes an explicit path list, so it does not.
      # Warming the cache and building in CI are therefore the same question
      # with one answer; a job that spelled the question itself could drift
      # from `ci::nix` again, which is exactly how `padi-agent` stayed cold
      # and unnoticed.
      #
      # We push the closures of the built outputs, NOT a before/after diff of
      # `nix path-info --all`. The diff inferred "what this build produced" from
      # ambient global store state, which was wrong in both directions: it
      # over-pushed anything unrelated that touched the store inside the window
      # (the whole nixpkgs build-time toolchain, republished into a project
      # cache), and silently EXCLUDED genuine closure members that happened to
      # predate the snapshot — every path the push client's own install shares
      # with kolu. Naming the artifact directly is both smaller and correct, and
      # needs no `.drv`/`.check`/`.lock` blocklist to filter clutter that never
      # arrives.
      - name: Build every flake output
        id: build
        shell: bash
        run: |
          # Written out rather than inherited from `shell: bash`. Relying on the
          # implicit `-eo pipefail` is what let the old pre-snapshot step run a
          # pipe unprotected: `nix path-info | sort` would exit 0 on a failed
          # path-info, silently truncating the file the whole push set rode on.
          set -euo pipefail

          # Fold the build log; the push step below is the result. Each warm
          # appends its out-paths to the list that step reads.
          : > "$RUNNER_TEMP/outputs"
          warm() {
            local label="$*"
            echo "::group::build $label"
            local paths
            paths=$(bash ci/flake-build "$@")
            printf '%s\n' "$paths"
            echo "::endgroup::"
            # A positive assertion, not dressing. Without it a run that built
            # and pushed NOTHING is indistinguishable from a healthy one: the
            # step stays green and the only symptom is everyone's builds
            # quietly going cold. Green must mean "warmed", not "ran".
            if [ -z "$paths" ]; then
              echo "::error::ci/flake-build produced no output paths for: $label"
              exit 1
            fi
            printf '%s\n' "$paths" >> "$RUNNER_TEMP/outputs"
            echo "built $label → $(printf '%s\n' "$paths" | wc -l | tr -d ' ') outputs"
          }
          warm .
          # The nested flakes, with the SAME --kinds their own CI nodes use
          # (`website-nix`, `odu-nix`). These have closures that share nothing with
          # the root flake — ./ci pins its own nixpkgs — so nothing else warms
          # them and they were being rebuilt cold on every run, forever.
          # `pages.yml` reads this cache but never writes it, so the website's
          # closure in particular had no writer at all.
          #
          # ./osfacts is absent because the tool left the tree (OSF5) — kolu
          # pins it, `.#osfacts` builds the pinned source, and `warm .` covers
          # that like any other package. The two example subflakes are absent for a
          # different and weaker reason — they are genuinely uncovered, but they
          # only build docsites that nobody substitutes locally. If that stops
          # being true, add them here; do not assume they are warm.
          warm --kinds packages,checks ./website
          warm --kinds packages ./ci

          # The one channel between steps is a step output, so the list the
          # push action takes as `paths:` is written here, whole.
          {
            printf 'paths<<KOLU_OUTPUTS\n'
            cat "$RUNNER_TEMP/outputs"
            printf 'KOLU_OUTPUTS\n'
          } >> "$GITHUB_OUTPUT"

      # ONE process, one list. odu computes each closure from the roots it is
      # given, asks the bucket what it is missing in one batched query, drops
      # what an upstream key (`cache.nixos.org-1`) signed, orders uploads by
      # dependency depth and retries each path — so the paths built above are
      # all this step has to hand over. `cache` is the read URL this repo
      # substitutes from, and the action resolves the push origin from that
      # cache's own `nix-cache-info`: the bucket's bytes live in R2 and are
      # only written through odu. The pusher still chunks a NAR, so no body
      # cap binds it.
      #
      # THE PUSHER IS THE ACTION'S OWN ODU. The action builds `#odu` from the
      # checkout it lives in — its own pinned commit — so a moved branch cannot
      # change what runs as the publisher, and this repository's npins pin is
      # not asked the same question a second time. Nix is already installed
      # above; the action never installs one.
      #
      # Every path is stored or the step is red: `200` is odu's only "stored"
      # answer, a refusal is red at once, and only a transient answer (429, 5xx)
      # is retried. There is no deferred "held" state to wait out.
      #
      # AND THEN IT ASKS THE CACHE BACK — a read-back the shell this replaced
      # could not give. For every path the bucket serves, the action requests
      # the narinfo at the SUBSTITUTER's own address and the NAR that narinfo
      # names, requiring 200 at the size it claims. Plain HTTP throughout, so no
      # local narinfo cache can answer for the bucket, and a NAR truncated by a
      # proxy is caught rather than counted as landed. Its step summary is a
      # table read from `odu cache push --output json`, never scraped from human
      # output. A push here is verified, not trusted.
      #
      # THE TOKEN RULE lives in the action and never in an `if:` here, where a
      # `secrets` expression would have to be read. A pull request with no
      # token — every fork PR; this is `pull_request`, not `_target` — builds
      # and pushes nothing, says so, and succeeds; a `push` event with no token
      # FAILS, because a cache job that goes green having warmed nothing is the
      # state this whole file exists to make impossible.
      - uses: juspay/odu/.github/actions/push@306e313671bfb9b8ba80f4a804aac9dca1947aa6 # odu master: #159 merged
        with:
          token: ${{ secrets.ODU_CACHE_TOKEN }}
          # EXPLICIT, not inferred. odu #159 made this input optional (infer
          # from `./flake.nix`'s `nixConfig`), but its push client sends a
          # token only to a URL the OPERATOR named, so an inferred substituter
          # pushes anonymously and the bucket answers 401 — juspay/odu#163.
          cache: https://cache.kolu.dev/kolu-r2
          paths: ${{ steps.build.outputs.paths }}
          # Hold this push's closure while it is the default branch's.
          pin: ${{ github.ref_name == github.event.repository.default_branch }}

      # The push above proves what the BUCKET SERVES, path by path. This asks
      # the narrower, load-bearing question the deploy actually depends on: are
      # the remote-agent closures a `--host` dial provisions really there —
      # using the same source tree, package inventory and cache list
      # `@kolu/surface-remote` reads at dial time. It asks by plain HTTP
      # narinfo GET, so nix's local narinfo cache cannot answer on the server's
      # behalf (that false-red this step once). Rationale and scope live in the
      # script's header.
      #
      # NOTE THE BOUNDARY: green here is a receipt about a COMMIT, and it lands
      # tens of minutes after that commit becomes deployable. It does not, and
      # cannot, cover the artifact an operator ships — see `ci/agent-preflight`,
      # which is the deploy-host half of this.
      #
      # Also a node on the odu lane now (`ci::cache-substitutable`, `needs:
      # nix`): odu pushes a node's `result*` closures as part of that node's
      # completion, so on linux the dependency edge already means "after this
      # lane's push". It could not live there while the push was a GitHub job
      # running concurrently with the odu lanes — an odu node would have been
      # asking before the answer could be yes. Here it stays because darwin
      # has no odu lane, and the question has a real answer after our own
      # push, in our own job.
      #
      # It is a HARD failure, not a warning. A soft-fail would restore the state
      # this whole job was already in during the incident: green, and cold.
      - name: Verify the agent closures are substitutable
        # A fork PR pushed nothing, so there is nothing of its own to verify.
        # Same fork gate as the push: same-repo runs always ask.
        if: github.event.pull_request.head.repo.fork != true
        shell: bash
        run: |
          set -euo pipefail
          bash ci/agent-substitutable

  # The agents' content-addressed builds and the index naming them, so a dial
  # from a published revision has the host pull its daemon with NO trust — no
  # `trusted-users`, no cache key (`@kolu/surface-remote`'s `provisionAgent`
  # index step; `.github/actions/publish-closure` is the publisher). Its own
  # job because the action installs the Nix it rewrites with (2.34.8 — see its
  # `action.yml`), which must be the job's only Nix. kolu's `ca-index` branch
  # is born by the first master push; a pull request rewrites, smokes and
  # import-verifies, and writes no index.
  #
  # `needs: build-and-push` IS ONLY A WARM FOR DARWIN NOW, and that asymmetry
  # is deliberate. The action realises `source` and every exposed attr with its
  # own `nix build` on the runner's system (`publish-closure.py`), which
  # substitutes from `cache.kolu.dev/kolu-r2` (`accept-flake-config = true` in
  # its `action.yml`). On macOS the job above just pushed those closures. On
  # ubuntu the writer is the odu lane, which is a different system with no
  # ordering relationship to this workflow — so the ubuntu leg SUBSTITUTES when
  # the lane landed the commit first and BUILDS the agent closure itself
  # otherwise.
  #
  # That is the price of not building linux twice, and it is paid in runner
  # minutes on the uncommon path, never in correctness: the index this job
  # writes is content-addressed from the closure it realised, so a self-built
  # one is identical to a substituted one. Restoring `ubuntu-latest` to
  # `build-and-push` would buy the warm back at the cost of the second full
  # linux build this PR exists to remove.
  #
  # The action reads HOW to push from the declaration itself: kolu's agent
  # source bakes `pusher = { kind = "odu"; }` (default.nix), so a push here is
  # `odu cache push --cache https://cache.kolu.dev/kolu-r2` from THIS repo's
  # npins pin, under `ODU_CACHE_TOKEN` — no client is chosen by an input, and
  # no address either: the cache states its own origin and bucket.
  publish-closures:
    needs: build-and-push
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Pushes the `ca-index` branch of this repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The same tree `build-and-push` warmed — see its `ref:` note.
          ref: ${{ github.event.pull_request.head.sha }}

      # What a remote may resolve from the agent source, DERIVED from the one
      # inventory (`nix/agent-packages.json`'s `expose`), never hand-listed.
      - id: expose
        run: |
          echo "installables=$(jq -r '.expose | join(" ")' nix/agent-packages.json)" >> "$GITHUB_OUTPUT"

      # `source` mode: the action reads the declaration, the index key and the
      # caches from the baked agent source itself — nothing here restates them.
      - uses: ./.github/actions/publish-closure
        with:
          source: .#agent-flake-source
          installables: ${{ steps.expose.outputs.installables }}
          latest: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          # One line per exposed attr — the action fails on an attr with none,
          # so a new `expose` entry cannot slip through unsmoked. padi and
          # kaval have no `--version`; `--help` loads the whole program and
          # exits 0, which is what "it execs" needs.
          smoke: |
            padi-agent=bin/padi --help
            padi=bin/padi --help
            kaval=bin/kaval --help
          odu-cache-token: ${{ secrets.ODU_CACHE_TOKEN }}
