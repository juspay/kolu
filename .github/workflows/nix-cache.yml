# Build every output this flake exposes, on linux + darwin, and push each
# closure to kolu's OWN binary cache — `https://cache.kolu.dev`, the `kolu`
# bucket on odu's public cache. The flake already lists this cache as a
# substituter, so a green push here warms CI boxes and local `nix build`s on
# both platforms.
#
# The cache is kolu's, not a shared Attic cache: odu serves it (`odu cache
# push` is the client), it re-signs every narinfo with the `kolu-1` key the
# flake declares, and it drops what upstream `cache.nixos.org` already signs
# instead of re-uploading nixpkgs.
#
# TWO FACTS ABOUT THE PUSH. It goes to the cache's ADVERTISED name — the same
# `cache.kolu.dev` every consumer substitutes from — because the pinned odu
# chunks a NAR across requests, so Cloudflare's 100 MB per-body cap is not in
# the way. And the push has one success: a path is STORED (`200`) or the push
# is red. There is no in-between "the cache will catch up" answer.
#
# The build set is DERIVED, never hand-listed, and derived by the one script
# that already answers "what does this repo build" — `ci/flake-build`. This job
# used to run a bare `nix build` (= `.#default` alone) and push whatever new
# store paths appeared, so coverage was an emergent property of `default`'s
# closure rather than a decision. `padi-agent` sat outside it and was never
# warmed at all; `kaval-tui`, `padi-tui` and `osfacts` were warmed only
# incidentally, and would have gone quietly cold the day they left that
# closure. Nothing declared the intent, and nothing would have gone red.
#
# Sharing the script with `ci::nix` makes the gap impossible to express rather
# than merely detectable: a newly exposed output is warmed the day it lands,
# and the cache job cannot disagree with CI about what this repo builds.
#
# Two later corrections, both from one production incident (juspay/kolu#2101,
# F5(a) — a deploy whose remote hosts found no `padi-agent` in the cache and
# compiled the daemon over ssh, while this job was green):
#
#   * WHICH COMMIT. On `pull_request` the checkout defaulted to the synthetic
#     `refs/pull/N/merge` tree, so a branch's own head — the thing developers,
#     odu, and deploys all build — was never warmed. See the `ref:` note below.
#   * TRUST NOTHING, ASK THE CACHE. Pushing is an instruction, not a result.
#     The final step queries the cache back for the remote-agent closures
#     (`ci/agent-substitutable`), so "warmed" is an observation.
name: nix-cache

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege — this job only needs the checkout and ODU_CACHE_TOKEN secret.
permissions:
  contents: read

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest → x86_64-linux; macos-latest → aarch64-darwin
        # (GitHub's current macos-latest image). Covers the two platforms
        # that actually run kolu day-to-day; aarch64-linux stays out of the
        # matrix until something needs it warmed (x86_64-darwin is no longer a
        # kolu system at all — agent-distro does not build there).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # `ref:` is LOAD-BEARING on `pull_request`. actions/checkout defaults to
      # `github.ref`, which for that event is `refs/pull/N/merge` — a synthetic
      # merge of the PR into its base that NOTHING else ever builds. Developers
      # check out the branch head; odu's CI lanes fetch the pushed head SHA; a
      # `nix run github:juspay/kolu/<branch>` resolves the head; and a
      # pre-release deploy ships the head. Whenever the base has moved (i.e.
      # always, on a branch that lives more than a day) those closures differ,
      # so the job warmed a tree nobody wanted and left the one everybody wanted
      # cold. That is how a production deploy found no `padi-agent` in the cache
      # and provisioned remote hosts by COMPILING the daemon over ssh
      # (juspay/kolu#2101, F5(a)) while this job sat green.
      #
      # Warm what people actually build. `head.sha` is empty on non-PR events,
      # where the fallback is checkout's own default (the pushed master commit /
      # the dispatched ref) — the correct tree there already.
      #
      # No new exposure: this is `pull_request`, not `pull_request_target`, so a
      # fork PR gets no `ODU_CACHE_TOKEN` and cannot push regardless of which of
      # the two trees is checked out. Both refs already run this PR's Nix code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Pin by commit (CodeQL: unpinned third-party action). v35 → 9f63be7.
      # Defaults to Nix 2.34.7, which is what the pinned odu client is run with.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            extra-substituters = https://cache.kolu.dev
            extra-trusted-public-keys = kolu-1:eAXwD1RPt1BpFjrHfVUO8Ia0bK32WcuIeJcwFWmgj9Y=
            accept-flake-config = true

      # Discovery is `ci/flake-build` — the SAME script every `ci::*-nix` node
      # already uses (ci/mod.just:90, :124, :148). It enumerates attrNames of
      # the flake's own outputs, dies loudly when a required kind is empty, and
      # ends in `nix build -L --no-link --print-out-paths`, so its stdout IS the
      # list of built artifacts (`-L` logs go to stderr). Warming the cache and
      # building in CI are therefore the same question with one answer; a job
      # that spelled the question itself could drift from `ci::nix` again, which
      # is exactly how `padi-agent` stayed cold and unnoticed.
      #
      # We push the closures of the built outputs, NOT a before/after diff of
      # `nix path-info --all`. The diff inferred "what this build produced" from
      # ambient global store state, which was wrong in both directions: it
      # over-pushed anything unrelated that touched the store inside the window
      # (the whole nixpkgs build-time toolchain, republished into a project
      # cache), and silently EXCLUDED genuine closure members that happened to
      # predate the snapshot — every path the push client's own install shares
      # with kolu. Naming the artifact directly is both smaller and correct, and
      # needs no `.drv`/`.check`/`.lock` blocklist to filter clutter that never
      # arrives.
      - name: Build every flake output
        shell: bash
        run: |
          # Written out rather than inherited from `shell: bash`. Relying on the
          # implicit `-eo pipefail` is what let the old pre-snapshot step run a
          # pipe unprotected: `nix path-info | sort` would exit 0 on a failed
          # path-info, silently truncating the file the whole push set rode on.
          set -euo pipefail

          # Fold the build log; the push step below is the result. Each warm
          # appends its out-paths to the list that step reads.
          : > "$RUNNER_TEMP/outputs"
          warm() {
            local label="$*"
            echo "::group::build $label"
            local paths
            paths=$(bash ci/flake-build "$@")
            printf '%s\n' "$paths"
            echo "::endgroup::"
            # A positive assertion, not dressing. Without it a run that built
            # and pushed NOTHING is indistinguishable from a healthy one: the
            # step stays green and the only symptom is everyone's builds
            # quietly going cold. Green must mean "warmed", not "ran".
            if [ -z "$paths" ]; then
              echo "::error::ci/flake-build produced no output paths for: $label"
              exit 1
            fi
            printf '%s\n' "$paths" >> "$RUNNER_TEMP/outputs"
            echo "built $label → $(printf '%s\n' "$paths" | wc -l | tr -d ' ') outputs"
          }
          warm .
          # The nested flakes, with the SAME --kinds their own CI nodes use
          # (ci/mod.just:124, :148). These have closures that share nothing with
          # the root flake — ./ci pins its own nixpkgs — so nothing else warms
          # them and they were being rebuilt cold on every run, forever.
          # `pages.yml` reads this cache but never writes it, so the website's
          # closure in particular had no writer at all.
          #
          # ./osfacts is absent because the tool left the tree (OSF5) — kolu
          # pins it, `.#osfacts` builds the pinned source, and `warm .` covers
          # that like any other package. The two example subflakes are absent for a
          # different and weaker reason — they are genuinely uncovered, but they
          # only build docsites that nobody substitutes locally. If that stops
          # being true, add them here; do not assume they are warm.
          warm --kinds packages,checks ./website
          warm --kinds packages ./ci

      # ONE process, one list. odu computes each closure from the roots it is
      # given, asks the bucket what it is missing in one batched query, drops
      # what an upstream key (`cache.nixos.org-1`) signed, orders uploads by
      # dependency depth and retries each path — so the roots named above are
      # all this step has to hand over.
      #
      # The client is THIS repo's npins-pinned odu, handed to Nix as a LOCKED
      # ref (url AND npins' `narHash`) — a branch that moved cannot change what
      # runs as the publisher. `--origin` is the cache's advertised name: the
      # client chunks a NAR, so the proxy's body cap costs nothing.
      #
      # Every path is stored or the step is red: `200` is odu's only "stored"
      # answer, a refusal is red at once, and only a transient answer (429, 5xx)
      # is retried. There is no deferred "held" state to wait out.
      #
      # Fork PRs get no `ODU_CACHE_TOKEN` (header above); `secrets` isn't
      # readable in a step `if:`, and gating on presence would silently skip a
      # same-repo run with a missing token. An empty credential therefore fails
      # odu here, which is what a same-repo push must do.
      - name: Push the closures to the cache
        if: github.event.pull_request.head.repo.fork != true
        shell: bash
        env:
          ODU_CACHE_TOKEN: ${{ secrets.ODU_CACHE_TOKEN }}
        run: |
          set -euo pipefail
          echo "push → $(wc -l < "$RUNNER_TEMP/outputs" | tr -d ' ') outputs:"
          pin=$(jq -r .pins.odu.url npins/sources.json)
          hash=$(jq -r .pins.odu.hash npins/sources.json)
          # A LOCKED ref: npins' url AND its narHash, percent-encoded exactly as
          # the publisher action's own client does.
          ref="$pin?narHash=$(jq -rn --arg h "$hash" '$h|@uri')#odu"
          # shellcheck disable=SC2046 # store paths hold no whitespace; one process, one list
          nix run --accept-flake-config "$ref" -- \
            cache push kolu --origin https://cache.kolu.dev $(cat "$RUNNER_TEMP/outputs")

      # The push above is an INSTRUCTION; this is the VERDICT. It re-asks the
      # cache — over the network, as a client — whether the remote-agent
      # closures a `--host` dial provisions are really there, using the same
      # source tree, package inventory and cache list `@kolu/surface-remote`
      # reads at dial time. It asks by plain HTTP narinfo GET, so nix's local
      # narinfo cache cannot answer on the server's behalf (that false-red this
      # step once). Rationale and scope live in the script's header.
      #
      # NOTE THE BOUNDARY: green here is a receipt about a COMMIT, and it lands
      # tens of minutes after that commit becomes deployable. It does not, and
      # cannot, cover the artifact an operator ships — see `ci/agent-preflight`,
      # which is the deploy-host half of this.
      #
      # Placed HERE and not in `ci/mod.just` on purpose: the odu lanes run
      # concurrently with this job on the same commit, so an odu node would be
      # asking before the answer could be yes. After our own push, in our own
      # job, the question has a real answer — and a red here means the exact
      # thing it says, on both platforms the matrix covers.
      #
      # It is a HARD failure, not a warning. A soft-fail would restore the state
      # this whole job was already in during the incident: green, and cold.
      - name: Verify the agent closures are substitutable
        # A fork PR pushed nothing, so there is nothing of its own to verify.
        # Same fork gate as the push: same-repo runs always ask.
        if: github.event.pull_request.head.repo.fork != true
        shell: bash
        run: |
          set -euo pipefail
          bash ci/agent-substitutable

  # The agents' content-addressed builds and the index naming them, so a dial
  # from a published revision has the host pull its daemon with NO trust — no
  # `trusted-users`, no cache key (`@kolu/surface-remote`'s `provisionAgent`
  # index step; `.github/actions/publish-closure` is the publisher). After
  # `build-and-push` so the input-addressed closures are already in the cache
  # this job substitutes from. Its own job because the action installs the Nix
  # it rewrites with (2.34.8 — see its `action.yml`), which must be the job's
  # only Nix. kolu's `ca-index` branch is born by the first master push; a pull
  # request rewrites, smokes and import-verifies, and writes no index.
  #
  # The action reads HOW to push from the declaration itself: kolu's agent
  # source bakes `pusher = { kind = "odu"; bucket = "kolu"; }` (default.nix), so
  # a push here is `odu cache push kolu` from THIS repo's npins pin, under
  # `ODU_CACHE_TOKEN` — no client is chosen by an input.
  publish-closures:
    needs: build-and-push
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Pushes the `ca-index` branch of this repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The same tree `build-and-push` warmed — see its `ref:` note.
          ref: ${{ github.event.pull_request.head.sha }}

      # What a remote may resolve from the agent source, DERIVED from the one
      # inventory (`nix/agent-packages.json`'s `expose`), never hand-listed.
      - id: expose
        run: |
          echo "installables=$(jq -r '.expose | join(" ")' nix/agent-packages.json)" >> "$GITHUB_OUTPUT"

      # `source` mode: the action reads the declaration, the index key and the
      # caches from the baked agent source itself — nothing here restates them.
      - uses: ./.github/actions/publish-closure
        with:
          source: .#agent-flake-source
          installables: ${{ steps.expose.outputs.installables }}
          latest: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          # One line per exposed attr — the action fails on an attr with none,
          # so a new `expose` entry cannot slip through unsmoked. padi and
          # kaval have no `--version`; `--help` loads the whole program and
          # exits 0, which is what "it execs" needs.
          smoke: |
            padi-agent=bin/padi --help
            padi=bin/padi --help
            kaval=bin/kaval --help
          odu-cache-token: ${{ secrets.ODU_CACHE_TOKEN }}
