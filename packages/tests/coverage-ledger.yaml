#     replacements:
#       - file: packages/example/src/example.test.ts
#         test: "suite > replacement"
#         lane: unit
#         platforms: [linux, darwin]
#         realism: [real-fs]
#         counterfactual:
#           file: packages/example/src/example.test.ts
#           test: "suite > fails with the watcher disconnected"
